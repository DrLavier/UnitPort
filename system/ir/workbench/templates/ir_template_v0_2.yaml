meta:
  ir_version: "0.2"
  spec_name: "unitport-unified-ir"
  generated_at: "2026-02-14T00:00:00Z"
  source:
    project: "unitport"
    canvas_id: ""
    compiler_unit: ""
  trace:
    mission_id: ""
    scenario_id: ""
    run_id: ""

target:
  mode: "simulation" # simulation | real
  backend:
    vendor: "unitree" # unitree | bostion_dynamics | xiaomi | other
    robot_model: ""
    runtime_profile: "" # e.g. mujoco_local / spot_sdk / cyberdog_ros2

session:
  connect:
    endpoint: ""
    transport: "" # grpc | ros2 | custom
    timeout_sec: 10
  auth:
    required: false
    method: "" # password | token | cert | none
    credential_ref: ""
  time_sync:
    required: false
    policy: "best_effort" # required | best_effort | disabled
  ownership:
    required: true
    mode: "exclusive" # exclusive | shared
    keepalive_sec: 2

capabilities:
  required:
    locomotion: true
    posture: true
    manipulation: false
    perception: false
    navigation: false
  optional: []

mission:
  graph:
    nodes: []
    edges: []
  entry_node: ""
  exit_policy: "complete_all" # complete_all | first_success | fail_fast

behavior:
  scripts:
    language: "python" # python (v0.2 baseline)
    entrypoints: []
  parameters: {}

command_model:
  idempotency:
    enabled: true
    key_fields: ["command_id", "sequence", "timestamp"]
  ordering:
    policy: "monotonic_timestamp" # monotonic_timestamp | sequence_only | none
  preemption:
    strategy: "priority_then_recency" # priority_then_recency | recency_only | disabled

  state_machine:
    initial: "CREATED"
    terminal: ["SUCCEEDED", "FAILED", "CANCELED", "TIMED_OUT", "REJECTED"]
    states:
      - "CREATED"
      - "SUBMITTED"
      - "ACKED"
      - "RUNNING"
      - "PAUSED"
      - "SUCCEEDED"
      - "FAILED"
      - "CANCELED"
      - "TIMED_OUT"
      - "REJECTED"
    transitions:
      - ["CREATED", "SUBMITTED"]
      - ["SUBMITTED", "ACKED"]
      - ["SUBMITTED", "REJECTED"]
      - ["ACKED", "RUNNING"]
      - ["ACKED", "CANCELED"]
      - ["RUNNING", "PAUSED"]
      - ["PAUSED", "RUNNING"]
      - ["RUNNING", "SUCCEEDED"]
      - ["RUNNING", "FAILED"]
      - ["RUNNING", "CANCELED"]
      - ["RUNNING", "TIMED_OUT"]

commands:
  - command_id: "cmd_001"
    sequence: 1
    timestamp: "2026-02-14T00:00:00Z"
    type: "set_mode" # set_mode | set_gait | velocity | action | navigate
    priority: 0
    payload: {}
    constraints: []
    timeout_sec: 10
    ack_deadline_sec: 2
    retry:
      max_attempts: 0
      backoff_sec: 0
    on_conflict: "preempt" # preempt | reject | queue
    expected_feedback:
      progress: true
      rate_hz: 5
      final_result_required: true

safety:
  constraints:
    linear_velocity_max_mps: 0.5
    angular_velocity_max_rps: 1.0
    body_height_range_m: [0.2, 0.5]
  guards:
    low_battery_policy: "degrade" # degrade | stop
    comms_loss_policy: "stop" # continue | stop | safe_shutdown
  estop:
    enabled: true
    level: "settle_then_cut" # none | settle_then_cut | cut

error_model:
  envelope:
    fields:
      - "layer"
      - "code"
      - "message"
      - "retryable"
      - "fatal"
      - "vendor_code"
      - "command_id"
      - "timestamp"
  layers:
    transport:
      description: "Connectivity and protocol-level failures."
      examples: ["DNS_FAILURE", "TIMEOUT", "CHANNEL_CLOSED"]
    sdk:
      description: "Vendor SDK/client API errors."
      examples: ["AUTH_FAILED", "INVALID_REQUEST", "UNAVAILABLE"]
    runtime:
      description: "UnitPort runtime orchestration errors."
      examples: ["STATE_TRANSITION_INVALID", "TASK_CONFLICT", "QUEUE_OVERFLOW"]
    safety:
      description: "Safety-interceptor or guardrail rejections."
      examples: ["ESTOP_ACTIVE", "LIMIT_EXCEEDED", "LOW_BATTERY_LOCK"]
    policy:
      description: "Scenario/mission policy violations."
      examples: ["PRECONDITION_FAILED", "CAPABILITY_MISMATCH", "EXECUTION_BLOCKED"]
  mapping:
    unknown_vendor_error: "sdk.UNCLASSIFIED_VENDOR_ERROR"
    timeout_default: "transport.TIMEOUT"
    precondition_default: "policy.PRECONDITION_FAILED"

observability:
  events:
    enabled: true
    channels: ["state", "command", "fault", "safety"]
  metrics:
    enabled: true
    interval_hz: 5
  audit:
    enabled: true
    include_payload: true
  status_stream:
    include_command_state: true
    include_error_envelope: true

execution:
  scheduler:
    mode: "event_driven" # event_driven | tick
  cancellation:
    enabled: true
    grace_period_sec: 2
  failure_policy:
    strategy: "rollback_or_safe_stop" # retry | rollback_or_safe_stop | fail_fast
  export:
    simulators:
      mujoco:
        enabled: true
        adapter: "mujoco_runner"
    real_targets:
      unitree:
        enabled: true
        adapter: "unitree_service_adapter"
      bostion_dynamics:
        enabled: true
        adapter: "spot_service_adapter"
      xiaomi:
        enabled: true
        adapter: "cyberdog_service_adapter"
