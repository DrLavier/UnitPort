# UnitPort RELEASE — pinned dependency lockfile
#
# Purpose: reproducible installs. ``install.bat`` / ``install.sh`` prefer this
# file over ``requirements.txt`` so the version a maintainer tested is the
# version every end-user sees, mitigating both upstream supply-chain
# compromises and silent breakage from non-malicious major bumps. Plan
# finding P1-2.
#
# Maintenance:
#   1. Bump a package in ``requirements.txt`` (top-level only).
#   2. In a clean ``.venv311`` (after ``reset.bat``), run ``install.bat``
#      to pull the new resolution, then ``pip-compile --generate-hashes
#      requirements.txt -o requirements.lock`` to refresh the lockfile
#      with cryptographic hashes (requires ``pip install pip-tools``).
#   3. Re-test, commit both files together.
#
# The PyTorch line is intentionally the base wheel version. ``ProvisioningTask``
# reinstalls torch from ``https://download.pytorch.org/whl/cu124`` (CUDA build)
# on machines with an NVIDIA GPU; the entry below is the CPU-only fallback the
# stage-0 bootstrap installs.
#
# The current file is a freeze snapshot of the maintainer's reference dev
# environment as of release prep. It pins versions but does NOT carry SHA-256
# hashes — that requires pip-tools per step 2 above. Run with
# ``pip install --require-hashes -r requirements.lock`` once hashes are added.

