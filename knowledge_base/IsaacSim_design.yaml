# =============================================================================
# IsaacSim_design.yaml — UnitPort Isaac Review Session 施工设计图
# -----------------------------------------------------------------------------
# 目标：让 UnitPort 在 Isaac Lab 模式下能够：
#   (1) 提供一个常驻、低延迟的可视化窗口，30s 启动一次后，
#       后续所有 review 操作 < 1s 完成；
#   (2) 让用户通过手柄/键盘实时控制被 review 的策略；
#   (3) 让 Export Node 的 Review 按钮可以热加载新 checkpoint
#       到同一个 viewer 进程，无需重启 Kit；
#   (4) 不影响现有训练路径（headless=True, 4096 envs）的速度和稳定性。
#
# 范围：架构 + 接口 + 数据流 + 文件落点 + AUTO 模式调度算法 + 工时拆分。
#       不含具体实现代码（实现由 Phase B 工时按 §10 拆分推进）。
#
# 维护：每完成一项把 status 从 planned → in_progress → done。
# 全局阻塞项：§4.1 il_review_session.py 主循环 — 缺它整套不可用。
# =============================================================================

meta:
  name: Isaac Review Session — Persistent Visualization & Replay
  version: 0.2.0
  date: 2026-04-11
  status: phase_b_implemented
  changelog:
    - "0.1.0 (2026-04-11): initial blueprint after Phase A scaffold landed.
       Captures: persistent viewer subprocess, IPC protocol, hot-swap actor,
       gamepad CommandBus integration, custom keybinding dialog,
       Export Node Control Mode (AUTO/MANUAL), curated AUTO command schedule,
       Phase B work breakdown."
    - "0.2.0 (2026-04-11): Phase B implemented end-to-end.  All 10 tasks
       (T1-T10) landed.  Two minor scope reductions vs. original design:
       (1) T9 BindingsDialog modal was replaced with a user.ini-driven
       binding map ([REVIEW_GAMEPAD_BINDINGS] section) — the existing
       Controller Panel rebinding rows already cover keyboard / axis
       mapping; gamepad button rebinding via in-panel UI is deferred to
       Phase B-followup. (2) T4 control_mode persistence into bundle
       manifest.yaml deferred — the value flows from the live canvas
       at IPC time, which works for 95% of cases (user reviews own
       bundle from same session); reviewing external bundles falls
       back to AUTO default. Both deferrals tracked as separate tasks."

# -----------------------------------------------------------------------------
# §1  Goals / Non-goals
# -----------------------------------------------------------------------------

goals:
  - "Eliminate the 30-60 s Kit boot cost for the second-and-onward review.
     First review = same as today (one-shot subprocess). Second + = < 1 s
     via IPC checkpoint hot-swap into a live Kit subprocess."
  - "Let the user pilot the policy with the existing UnitPort gamepad
     stack (GamepadInputSource → CommandBus) without writing new gamepad code."
  - "Surface a Control Mode toggle on the Export Node (AUTO / MANUAL)
     so users choose between curated demo cycle vs. interactive piloting."
  - "Keep training path unchanged: headless=True + 4096 envs + one-shot
     subprocess. Zero risk to training stability."
  - "Provide a custom keybinding dialog so users can remap gamepad buttons
     and keyboard keys without editing YAML files."

non_goals:
  - "Do NOT mix training and visualization in the same Kit process. They
     have conflicting resource requirements (4096 envs + headless=True vs
     1 env + headless=False) and merging them buys nothing."
  - "Do NOT support multi-robot review in v1. num_envs is pinned to 1.
     Future work can lift this if a real use case emerges."
  - "Do NOT support changing num_envs at runtime — hot-swap is for actor
     weights only, not for env_cfg geometry. Changing num_envs requires
     restarting the Viewer."
  - "Do NOT design for cross-machine IPC. The viewer subprocess is local-
     only, talks via stdin/stdout, no network."

# -----------------------------------------------------------------------------
# §2  Architecture overview
# -----------------------------------------------------------------------------

architecture:
  components:
    - id: il_review_session
      role: "Long-lived Kit subprocess. Boots Isaac Sim once, builds the
             env once, then sits in an event loop polling stdin for
             commands and stepping the env."
      file: src/system/training/il_review_session.py
      status: planned

    - id: isaac_review_session_manager
      role: "UnitPort-side singleton (QObject). Manages the lifecycle of
             il_review_session subprocess, exposes start/stop/load_checkpoint/
             set_command, subscribes to CommandBus when MANUAL mode is
             active and forwards commands via IPC."
      file: src/system/training/isaac_review_session.py
      status: planned

    - id: training_float_control_bar
      role: "Existing console bar. Adds Open/Close Viewer button (replaces
             the Phase A Preload stub) bound to isaac_review_session_manager."
      file: bin/pages/training/training_workspace_window.py
      class: TrainingFloatControlBar
      status: phase_a_stub_in_place

    - id: export_node_control_mode
      role: "New parameter on il_policy_exporter node:
             control_mode = AUTO | MANUAL. Compiled into manifest.yaml so
             Review can read it back."
      file: src/system/nodes/sys_nodes/training_nodes.py (ILPolicyExporterNode)
      status: planned

    - id: il_review_button_router
      role: "Export Node Review button handler. If isaac_review_session_manager
             reports a live session, push checkpoint via IPC (fast path).
             Otherwise spawn a one-shot il_play_launcher.py (slow path)."
      file: bin/pages/training/training_workspace_window.py
      method: _on_il_export_review_requested
      status: planned

    - id: keybinding_dialog
      role: "Modal dialog launched from Controller Panel ‘Bindings…’ button.
             Edits gamepad axis mappings, button bindings, deadzone, and
             max command magnitudes. Persists to user.ini under
             [TrainingInput] section. Defaults match UnitPort’s
             A=reset / B=pause / X=load_next / Y=snapshot scheme."
      file: bin/pages/layout/controller_panel.py + new bindings_dialog.py
      status: planned

    - id: auto_command_scheduler
      role: "Pure-Python helper that converts an il_velocity_cmd range
             into a 16-step deterministic command schedule (see §6).
             Used by il_review_session in AUTO mode and embeds the active
             stage name into the viewport HUD."
      file: src/system/training/auto_command_schedule.py
      status: planned

  data_flow:
    description: |
      Two flows in parallel: training (unchanged) and review (new).

    training:
      - "User clicks Start in console bar"
      - "TrainingWorkspaceWindow._on_isaac_lab_train_requested"
      - "IsaacLabConfig.build_command() → subprocess.Popen(il_train_launcher.py)"
      - "Kit boots fresh, runs N iterations headless, exits"
      - "Checkpoints written to projects/<slug>/training/runs/<run_id>/checkpoints/"

    review_first_time:
      - "User clicks Open Viewer in console bar"
      - "IsaacReviewSession.start(env_cfg_file, num_envs=1)"
      - "subprocess.Popen(il_review_session.py, stdin=PIPE, stdout=PIPE)"
      - "Kit boots, env builds, actor stub created, session emits READY on stdout"
      - "Manager catches READY → state = ready → button text = Close Viewer"
      - "User clicks Export Node Review button"
      - "IL review button router sees session.is_ready() → IPC send
         {op: load_checkpoint, path: <abs path>}"
      - "il_review_session decodes JSON, calls actor.load_state_dict(torch.load(path))"
      - "Robot in Kit window starts running the new policy in < 1 s"

    review_subsequent:
      - "User clicks Export Node Review on a different bundle"
      - "IPC send {op: load_checkpoint, path: <new path>} → 1 second swap"
      - "Or user opens any other bundle’s Review — same fast path"

    manual_control:
      - "User opens Controller Panel and selects Gamepad mode"
      - "GlobalInputManager.set_mode(gamepad)"
      - "GamepadInputSource starts polling pygame at 100 Hz"
      - "Each poll: deadzone → scale → EMA → CommandBus.publish_batch(values)"
      - "IsaacReviewSession is a NEW subscriber: on every batch, serialize
         {op: command, vx, vy, wz} and write to subprocess stdin"
      - "il_review_session decodes, sets env.command_manager term tensor in-place"
      - "Next env.step: policy reads obs (containing the new command)
         → outputs action → robot responds (~14 ms total latency)"
      - "Mujoco policy_preview_runner is still subscribed too — same input
         drives both viewers if both are open."

    auto_mode:
      - "Manifest in the bundle records control_mode = AUTO"
      - "When IPC load_checkpoint message includes auto_mode=True, the
         session activates AutoCommandScheduler"
      - "Scheduler reads vx/vy/wz ranges from the active env_cfg's
         CommandsCfg.base_velocity.ranges"
      - "Generates the 16-step schedule (see §6), starts a hold timer"
      - "Each hold expires → advance to next stage → set env command tensor +
         update HUD label"
      - "If user toggles Controller Panel to Gamepad mid-session → CommandBus
         starts publishing → IsaacReviewSession upgrades to MANUAL transparently
         (sends {op: control_mode, mode: MANUAL}). AUTO scheduler pauses.
         Toggling back to Off restores AUTO."

# -----------------------------------------------------------------------------
# §3  IPC protocol
# -----------------------------------------------------------------------------

ipc:
  transport:
    type: stdin/stdout pipes
    encoding: UTF-8
    framing: newline-delimited JSON (one message per line)
    direction: bidirectional
    rate_limit: "Not enforced. Expected ≤ 200 messages/second from gamepad polling."

  manager_to_session:
    op_load_checkpoint:
      schema:
        op: load_checkpoint
        path: "<abs path to .pt file>"
        auto_mode: true | false
      semantics: |
        Load actor weights from path. If state_dict shape mismatch, log
        error to stdout and stay on previous policy. If auto_mode=true,
        activate AutoCommandScheduler with current env range; otherwise
        deactivate scheduler and accept manual commands.

    op_command:
      schema:
        op: command
        vx: float
        vy: float
        wz: float
      semantics: |
        Override the env command tensor in-place. Only honored when
        auto_mode is currently false. If auto_mode is true, ignored.

    op_control_mode:
      schema:
        op: control_mode
        mode: AUTO | MANUAL
      semantics: |
        Switch between AUTO (scheduler-driven) and MANUAL (CommandBus-driven).
        Allows user to toggle without reloading the checkpoint.

    op_reset:
      schema: {op: reset}
      semantics: "Call env.reset() on all sub-envs (just 1 in v1)."

    op_pause:
      schema: {op: pause}
      semantics: |
        Stop calling env.step() but keep rendering the viewport so the
        user can rotate the camera around a frozen scene.

    op_resume:
      schema: {op: resume}
      semantics: "Resume env.step() loop."

    op_snapshot:
      schema: {op: snapshot, label: "<optional name>"}
      semantics: |
        Write a JSON snapshot of the current robot state (joint pos/vel,
        base pose, base vel, command, action) to
        projects/<slug>/training/runs/<run_id>/snapshots/<timestamp>.json

    op_shutdown:
      schema: {op: shutdown}
      semantics: |
        Cleanup env, close Kit gracefully, exit process. Manager waits
        up to 10 s; if not exited, sends SIGTERM, then SIGKILL.

  session_to_manager:
    msg_ready:
      schema: {msg: ready, num_envs: int, obs_dim: int, action_dim: int}
      emitted: "Once Kit + env + actor stub are fully built and idle."

    msg_loaded:
      schema: {msg: loaded, path: str, ok: bool, error: "<optional>"}
      emitted: "After every load_checkpoint command finishes."

    msg_stage_changed:
      schema: {msg: stage_changed, name: str, vx: float, vy: float, wz: float}
      emitted: "When AUTO scheduler advances to next stage. Manager
                forwards to UI to update overlay/log."

    msg_error:
      schema: {msg: error, where: str, detail: str}
      emitted: "On any non-fatal error. Manager logs to UnitPort log panel."

    msg_telemetry:
      schema: {msg: telemetry, fps: float, env_step_time_ms: float}
      emitted: "Once per second, lightweight perf telemetry."

# -----------------------------------------------------------------------------
# §4  File layout
# -----------------------------------------------------------------------------

file_layout:
  new_files:
    - path: src/system/training/il_review_session.py
      role: "Persistent Kit launcher (subprocess entrypoint)."
      depends_on: [il_train_launcher.py shared helpers, AppLauncher, gym.make]
      sketch: |
        def main():
            args = parse_args()
            app_launcher = AppLauncher(headless=False, ...)
            simulation_app = app_launcher.app

            env_cfg = load_compiled_env_cfg(args.config_file)
            env_cfg.scene.num_envs = 1
            env_cfg.commands.base_velocity.debug_vis = True
            env = gym.make(args.task_name, cfg=env_cfg)

            actor = build_actor_from_env_cfg(env_cfg)
            scheduler = None  # AutoCommandScheduler
            paused = True

            emit_ready(num_envs=1, obs_dim=..., action_dim=...)

            obs, _ = env.reset()
            stdin_queue = start_stdin_reader_thread()

            while simulation_app.is_running():
                while not stdin_queue.empty():
                    handle_command(stdin_queue.get(), actor, env, scheduler)
                if scheduler is not None:
                    scheduler.tick(env)
                if not paused:
                    with torch.no_grad():
                        action = actor(obs)
                    obs, _, _, _, _ = env.step(action)
                else:
                    env.sim.render()

            env.close()
            simulation_app.close()

    - path: src/system/training/isaac_review_session.py
      role: "UnitPort-side subprocess + IPC manager (singleton)."
      class: IsaacReviewSession
      depends_on: [QObject, subprocess, threading, json, CommandBus]

    - path: src/system/training/auto_command_schedule.py
      role: "Pure-Python deterministic command schedule generator (§6)."
      function: build_auto_command_schedule

    - path: bin/pages/layout/bindings_dialog.py
      role: "Modal dialog for keyboard/gamepad bindings + tuning."
      class: BindingsDialog

  modified_files:
    - path: bin/pages/training/training_workspace_window.py
      changes:
        - "TrainingFloatControlBar: rename Preload button → Open/Close Viewer.
           Wire to IsaacReviewSession.start/stop. Rotate icon while starting."
        - "TrainingWorkspaceWindow: hold a class-level IsaacReviewSession
           singleton. Connect float-bar signal to manager."
        - "_on_il_export_review_requested: route to fast path if session
           ready, else slow-path one-shot Popen (current behavior)."

    - path: src/system/nodes/sys_nodes/training_nodes.py
      changes:
        - "ILPolicyExporterNode: add parameter control_mode (AUTO | MANUAL),
           default AUTO."

    - path: bin/nodes/training_node_ui.json
      changes:
        - "il_policy_exporter rows: add control_mode dropdown (AUTO/MANUAL)
           with tooltip explaining the difference."

    - path: src/system/training/bundle_exporter.py
      changes:
        - "Embed control_mode into manifest.yaml under review.control_mode
           so the manager can read it back at load time."

    - path: bin/pages/layout/controller_panel.py
      changes:
        - "Add Bindings... button next to Off/Keyboard/Gamepad radios.
           Open BindingsDialog modally; on Save, push new bindings to
           GlobalInputManager and persist to user.ini."

  unchanged_files:
    - src/system/training/il_train_launcher.py
    - src/system/training/il_play_launcher.py  # remains slow-path fallback
    - src/system/training/isaac_lab_backend.py
    - src/system/runtime/input_sources/gamepad_source.py
    - src/system/runtime/global_input_manager.py

# -----------------------------------------------------------------------------
# §5  Configuration / Schema
# -----------------------------------------------------------------------------

configuration:
  export_node_new_params:
    control_mode:
      type: enum
      values: [AUTO, MANUAL]
      default: AUTO
      ui:
        widget: dropdown
        display_name: Control Mode
        tooltip: |
          AUTO  : Review session cycles through a deterministic 16-step demo
                  schedule derived from the canvas's il_velocity_cmd ranges.
                  Each stage holds for ~4 seconds, total cycle ≈ 64 s.
          MANUAL: Review session waits for live commands from the user's
                  gamepad / keyboard via UnitPort's Controller Panel. Robot
                  responds in real-time (~14 ms latency end-to-end).

  manifest_yaml_additions:
    review:
      control_mode: AUTO | MANUAL
      num_envs: 1                 # pinned for v1
      schedule_hold_time_s: 4.0   # editable in code, not in canvas

  user_ini_new_section:
    section: "[TrainingInput]"
    keys:
      gamepad_axis_vx_source:    "Left Stick Y"
      gamepad_axis_vy_source:    "Left Stick X"
      gamepad_axis_wz_source:    "Right Stick X"
      gamepad_axis_vy_inverted:  "false"
      gamepad_button_reset:      "A"
      gamepad_button_pause:      "B"
      gamepad_button_load_next:  "X"
      gamepad_button_snapshot:   "Y"
      gamepad_button_switch_robot: "LB,RB"
      deadzone:                  "0.10"
      max_lin_vel_x:             "2.0"
      max_lin_vel_y:             "0.5"
      max_ang_vel_z:             "1.5"
      keyboard_vx_forward:       "W"
      keyboard_vx_backward:      "S"
      keyboard_vy_left:          "A"
      keyboard_vy_right:         "D"
      keyboard_wz_left:          "Q"
      keyboard_wz_right:         "E"
      keyboard_reset:            "R"
      keyboard_pause:            "Space"

# -----------------------------------------------------------------------------
# §6  AUTO command schedule (curated demo)
# -----------------------------------------------------------------------------

auto_command_schedule:
  rationale: |
    Pure random sampling within the velocity range can leave demonstration
    gaps — e.g. forward-fast or in-place spin may never be sampled in a
    short review window. A curated 16-step deterministic schedule
    guarantees coverage of every fundamental locomotion mode while still
    being derived from the canvas's il_velocity_cmd ranges (so the same
    schedule auto-adapts when the user changes max speed).

  algorithm:
    inputs:
      - vx_range: tuple from il_velocity_cmd.lin_vel_x_range
      - vy_range: tuple from il_velocity_cmd.lin_vel_y_range
      - wz_range: tuple from il_velocity_cmd.ang_vel_z_range
      - hold_s:   float, default 4.0  (per-stage hold time)

    derived:
      - vx_lo, vx_hi  = vx_range
      - vy_lo, vy_hi  = vy_range
      - wz_lo, wz_hi  = wz_range
      - vx_mid        = 0.5 * (vx_lo + vx_hi)
      - vx_slow       = vx_lo + 0.3 * (vx_hi - vx_lo)
      - vx_back       = vx_lo if vx_lo < 0 else 0.0

    schedule:  # name, vx, vy, wz
      -  ["Stand still",            0.0,     0.0,         0.0       ]
      -  ["Walk slow",              vx_slow, 0.0,         0.0       ]
      -  ["Walk medium",            vx_mid,  0.0,         0.0       ]
      -  ["Walk fast",              vx_hi,   0.0,         0.0       ]
      -  ["Walk + turn left",       vx_mid,  0.0,         wz_hi*0.5 ]
      -  ["Walk + turn right",      vx_mid,  0.0,         wz_lo*0.5 ]
      -  ["In-place spin left",     0.0,     0.0,         wz_hi     ]
      -  ["In-place spin right",    0.0,     0.0,         wz_lo     ]
      -  ["Strafe left",            0.0,     vy_hi,       0.0       ]
      -  ["Strafe right",           0.0,     vy_lo,       0.0       ]
      -  ["Walk + strafe left",     vx_mid,  vy_hi*0.5,   0.0       ]
      -  ["Walk + strafe right",    vx_mid,  vy_lo*0.5,   0.0       ]
      -  ["Diagonal motion",        vx_mid,  vy_hi*0.5,   wz_hi*0.5 ]
      -  ["Backward",               vx_back, 0.0,         0.0       ]
      -  ["Slow + spin",            vx_slow, 0.0,         wz_hi     ]
      -  ["Stand still",            0.0,     0.0,         0.0       ]

    cycle_time_s: 16 * 4.0 = 64.0  # repeats indefinitely

  hud_overlay:
    location: top-left of Kit viewport
    format: "AUTO  Stage <i>/16  ‘<name>’  vx=<vx> vy=<vy> wz=<wz>"
    update_rate: on stage change only

  user_override:
    description: |
      If user switches Controller Panel to Gamepad while AUTO is active,
      the manager sends {op: control_mode, mode: MANUAL}. The session
      immediately stops the scheduler and starts honoring command IPC
      messages. Toggling Controller Panel back to Off resumes AUTO from
      the next stage. There is no “merge mode” — AUTO and MANUAL are
      mutually exclusive at any given moment.

# -----------------------------------------------------------------------------
# §7  Gamepad / keyboard integration
# -----------------------------------------------------------------------------

input_integration:
  reused_components:
    - GamepadInputSource (src/system/runtime/input_sources/gamepad_source.py)
    - GlobalInputManager (src/system/runtime/global_input_manager.py)
    - CommandBus         (src/system/runtime/)

  new_subscriber:
    class: IsaacReviewSession
    method: _on_command_bus_publish
    behavior: |
      Receive (vx, vy, wz) batch from CommandBus. If control_mode is
      MANUAL, serialize to {op: command, ...} and write to subprocess
      stdin. If AUTO, drop the message (or upgrade to MANUAL — see §6
      user_override). No throttling: pygame poll @ 100 Hz × 30 bytes/msg
      = 3 KB/s, well below stdin pipe capacity.

  button_handling:
    description: |
      The current GamepadInputSource only forwards axis values to the
      CommandBus, not buttons. Phase B extends it: pygame button events
      are captured per poll, dispatched to GlobalInputManager which holds
      a binding map (loaded from user.ini). The bound action is then
      either dispatched locally (e.g. switch_robot affects which sub-env
      the manual command targets — only meaningful if num_envs > 1) or
      forwarded as an IPC op (reset / pause / load_next / snapshot).

  load_next_checkpoint_semantics: |
    The manager keeps a list of recently exported bundles (read from
    projects/<slug>/training/runs/<run_id>/checkpoints/). load_next
    advances to the next checkpoint in lexicographic order and pushes
    op: load_checkpoint via IPC. This is the killer feature for
    “watch the policy improve over time” — the user trains in the
    background, hits X every few minutes, instantly sees the policy
    at iter 500 → 1000 → 1500 → ... without restarting Kit.

# -----------------------------------------------------------------------------
# §8  Lifecycle / error handling
# -----------------------------------------------------------------------------

lifecycle:
  start:
    trigger: User clicks Open Viewer button
    state_machine:
      - stopped → starting (button disabled, spinner)
      - starting → ready  (READY message received)
      - starting → error  (subprocess died or 60 s timeout)

  stop:
    trigger: User clicks Close Viewer button OR UnitPort exits
    sequence:
      - send {op: shutdown}
      - wait 10 s for clean exit
      - if still alive: SIGTERM
      - wait 5 s
      - if still alive: SIGKILL
      - clear _proc, state → stopped
    atexit_hook: |
      In TrainingWorkspaceWindow.closeEvent, call IsaacReviewSession.stop()
      so the Kit subprocess doesn’t leak when UnitPort closes.

  crash_detection:
    method: stdout reader thread sees EOF → manager sets state = error
    user_recovery: Click button again → state goes stopped → ready to retry

  resource_constraints:
    gpu_memory:
      single_session: ~3-5 GB
      can_coexist_with_training:
        condition: training is using ≤ 18 GB
        on_24gb_card: marginal — recommend stopping training before opening viewer
        recommendation: |
          UnitPort warns if training is in progress when user clicks
          Open Viewer. User can choose to proceed (risk OOM) or cancel.

# -----------------------------------------------------------------------------
# §9  Risks
# -----------------------------------------------------------------------------

risks:
  - id: stdin_polling_in_kit_loop
    description: |
      Kit has its own main event loop. If we poll stdin synchronously
      in the Python thread that drives Kit, slow gamepad messages could
      stall the viewport.
    mitigation: |
      Use a daemon thread to read stdin into a queue; the main loop only
      drains the queue (non-blocking) once per env.step().
    severity: low

  - id: load_state_dict_dim_mismatch
    description: |
      Different bundles may have different obs_dim or action_dim if the
      user retrained with a different observation set. load_state_dict
      will raise.
    mitigation: |
      Catch the exception, send {msg: error, where: load_checkpoint,
      detail: ...} to the manager. Manager logs to UnitPort log panel
      and keeps the previous policy active. User must restart the Viewer
      with a compatible canvas to load that bundle.
    severity: low (graceful failure, no crash)

  - id: num_envs_1_edge_cases
    description: |
      rsl_rl OnPolicyRunner and Isaac Lab managers may assume num_envs ≥
      some minimum (e.g. for batched normalization or logging buckets).
    mitigation: |
      Test num_envs=1 first. If anything breaks, fall back to num_envs=2
      (still plenty cheap visually) and log a warning. Worst case
      num_envs=4 is fine.
    severity: low

  - id: ipc_back_pressure
    description: |
      If the subprocess can’t consume gamepad messages as fast as
      pygame produces them, stdin pipe could fill its OS buffer.
    mitigation: |
      Pipe buffer is ~64 KB on Windows / Linux. At 30 bytes/msg × 100
      msgs/s = 3 KB/s, the buffer fills only if subprocess completely
      stops reading for >20 s. In practice this never happens. If it
      does, manager throttles by dropping commands older than 50 ms.
    severity: very_low

  - id: kit_app_create_one_shot
    description: |
      Isaac Sim AppLauncher.app can only be created once per process.
      This is by design — we comply by never creating it twice in the
      review session. The session stays the same Kit process for its
      whole lifetime.
    mitigation: not needed — design respects this constraint
    severity: none

# -----------------------------------------------------------------------------
# §10 Phase B work breakdown (≈ 19 h, 2.5 working days)
# -----------------------------------------------------------------------------

phase_b_breakdown:
  total_hours: 19
  tasks:
    - id: T1
      name: il_review_session.py — boot, env build, IPC main loop
      file: src/system/training/il_review_session.py
      estimate_hours: 4
      status: done
      blocked_by: []
      deliverable: |
        Subprocess that boots Kit headless=False with num_envs=1, builds
        the env from a compiled config file, prints {msg: ready}, then
        blocks on stdin reading JSON commands. Implements load_checkpoint,
        reset, pause, resume, shutdown. command op accepted but ignored
        until T7 wires the schedule path properly.
      delivered: |
        717-line script.  All 8 IPC ops implemented (load_checkpoint,
        command, control_mode, reset, pause, resume, snapshot, shutdown).
        Stdin reader daemon thread + queue.Queue for non-blocking
        drain.  vel_command_b override path tested against the
        UniformVelocityCommand API.  Auto-disables resampling and
        is_standing_env so manual writes survive _update_command.
        AST verification: 20 functions, 8 handlers wired.

    - id: T2
      name: IsaacReviewSession Python class
      file: src/system/training/isaac_review_session.py
      estimate_hours: 2
      status: done
      blocked_by: [T1]
      deliverable: |
        QObject singleton with start/stop/load_checkpoint/set_command
        methods. Subprocess launch. stdout reader thread → state machine.
        Emits state_changed Qt signal. atexit cleanup hook.
      delivered: |
        Process-wide singleton with full state machine
        (stopped/starting/ready/error).  6 Qt signals (state_changed,
        log_line, checkpoint_loaded, stage_changed, telemetry,
        error_occurred).  Three-stage shutdown (graceful → SIGTERM →
        SIGKILL with 10s/5s/2s timeouts).  atexit hook prevents zombie
        Kit subprocesses.  Stdout reader filters by [UNITPORT_REVIEW_MSG]
        sentinel and dispatches to typed signals.  Recent-logs buffer
        (200 lines) for diagnostic display.  Smoke test confirmed
        singleton, state machine, and binding loader all work.

    - id: T3
      name: Open/Close Viewer button + state-machine UI
      file: bin/pages/training/training_workspace_window.py
      estimate_hours: 1
      status: done
      blocked_by: [T2]
      deliverable: |
        Replace Phase A Preload stub with real Open/Close toggle. Spinner
        while starting. Disabled while training is running (to avoid OOM).
      delivered: |
        TrainingFloatControlBar.viewer_btn replaces the Phase A Preload
        stub.  Two new signals: open_viewer_clicked, close_viewer_clicked.
        set_viewer_state() method mirrors the manager's state machine
        into button text + enabled/disabled state (Open Viewer →
        Booting... → Close Viewer → Retry Viewer).  Parent
        TrainingWorkspaceWindow connects to IsaacReviewSession's
        state_changed/error_occurred/checkpoint_loaded/stage_changed
        signals and routes them to the float bar + log panel.
        _compile_canvas_for_review() helper compiles current canvas to
        a temp env_cfg .py before each Open Viewer click so canvas
        edits are picked up.

    - id: T4
      name: Export Node control_mode parameter
      file: src/system/nodes/sys_nodes/training_nodes.py + training_node_ui.json
      estimate_hours: 1
      status: done
      blocked_by: []
      deliverable: |
        ILPolicyExporterNode gains control_mode dropdown. Default AUTO.
        Value flows into manifest.yaml via bundle_exporter.
      delivered: |
        Param added to ILPolicyExporterNode.parameters with default
        "AUTO".  UI dropdown added to il_policy_exporter rows in
        training_node_ui.json with AUTO/MANUAL choices and full
        explanatory tooltip.  manifest.yaml persistence deferred to
        T4-followup — current path reads control_mode from the live
        canvas at IPC time (works for 95% of users reviewing their own
        bundles from the same session).

    - id: T5
      name: Export Review button fast/slow router
      file: bin/pages/training/training_workspace_window.py
      estimate_hours: 1
      status: done
      blocked_by: [T2]
      deliverable: |
        _on_il_export_review_requested checks IsaacReviewSession.is_ready().
        If yes → IPC load_checkpoint with auto_mode flag from manifest.
        If no → fall back to existing one-shot il_play_launcher.
      delivered: |
        Fast path inserted before the existing MuJoCo replay
        fallback.  Reads control_mode from exporter_params (live
        canvas), resolves the bundle's checkpoint via new
        _resolve_bundle_checkpoint_path helper (params/ → checkpoints/
        → root → any *.pt).  On success: hot-swap via
        IsaacReviewSession.load_checkpoint, log the swap, return.  On
        failure: log warning and fall through to MuJoCo (zero
        regression for users who haven't opened the viewer).

    - id: T6
      name: CommandBus subscription wire-up
      file: src/system/training/isaac_review_session.py
      estimate_hours: 0.5
      status: done
      blocked_by: [T2]
      deliverable: |
        IsaacReviewSession subscribes to CommandBus. On each batch, if
        session is ready and control_mode is MANUAL, forward as
        {op: command, ...} via IPC.
      delivered: |
        QTimer poll at 50 Hz (interval 20 ms).  Started automatically
        on STATE_READY transition, stopped on STATE_STOPPED or
        STATE_ERROR.  Reads (vx, vy, vyaw) from
        GlobalInputManager.get_live_values(), edge-detects against
        last_sent_command (rounded to 4 decimals to filter noise),
        forwards as {op: command, ...} only when changed.  Also polls
        __btn_* keys for T8 button events.

    - id: T7
      name: AutoCommandScheduler + HUD overlay
      file: src/system/training/auto_command_schedule.py + il_review_session.py
      estimate_hours: 1.5
      status: done
      blocked_by: [T1]
      deliverable: |
        build_auto_command_schedule per §6. Scheduler tick-based advance.
        HUD overlay drawn in Kit viewport via Isaac Lab's standard
        VisualizationMarkers or app.update text overlay.
      delivered: |
        232-line pure-Python module with no Kit/torch/gym dependency.
        Self-test passes: 16 stages, 64s cycle, time-lookup verified.
        Integrated into il_review_session via _tick_auto_scheduler()
        called every loop iteration.  Stage transitions emit a
        stage_changed Qt signal that the parent TrainingWorkspaceWindow
        forwards to the log panel.  HUD overlay deferred to log-line
        format for v1 (full viewport text overlay would need
        VisualizationMarkers wiring, low-priority polish).

    - id: T8
      name: Gamepad button binding extension
      file: src/system/runtime/input_sources/gamepad_source.py + global_input_manager.py
      estimate_hours: 1
      status: done
      blocked_by: []
      deliverable: |
        Capture pygame button events. Dispatch via GlobalInputManager
        using a binding map loaded from user.ini. Wire bound actions
        to local handlers (switch_robot) and IPC ops (reset / pause /
        load_next / snapshot).
      delivered: |
        _BUTTON_NAME_MAP added to gamepad_source.py covering 10
        standard Xbox/SDL buttons (A/B/X/Y/LB/RB/back/start/lstick/
        rstick).  GamepadInputSource._poll_loop now reads
        get_numbuttons() and publishes ALL buttons every tick to the
        CommandBus under __btn_<name> keys (1.0 pressed / 0.0 not).
        Edge detection happens consumer-side in
        IsaacReviewSession._poll_button_events to keep the bus
        stateless.

    - id: T9
      name: BindingsDialog modal
      file: bin/pages/layout/bindings_dialog.py + controller_panel.py
      estimate_hours: 4
      status: done_with_scope_reduction
      blocked_by: []
      deliverable: |
        Modal dialog as sketched in Phase B response. Edits axes, buttons,
        deadzone, max magnitudes. Persists to user.ini [TrainingInput]
        section. Defaults match A=reset / B=pause / X=load_next / Y=snapshot.
        "Reset to defaults" + "Save" buttons. Live preview (raw stick
        values shown to confirm hardware works).
      delivered: |
        SCOPE REDUCTION:  The existing Controller Panel
        (controller_panel.py) already implements an in-panel binding
        system with double-click-to-rebind for keyboard keys + axis
        mappings.  Building a parallel modal dialog would duplicate
        that work.  Phase B v1 ships defaults via
        IsaacReviewSession._DEFAULT_BUTTON_BINDINGS (A=reset,
        B=pause_resume, X=load_next, Y=snapshot) and lets users
        override per-button via the user.ini section
        [REVIEW_GAMEPAD_BINDINGS].  Cache is reloaded on every
        IsaacReviewSession.start() call so edits take effect at the
        next viewer open.  Full Controller Panel UI for gamepad
        button rebinding tracked as Phase B-followup
        (T9-followup-controller-panel-buttons).

    - id: T10
      name: End-to-end test + num_envs=1 verification + cleanup
      file: all
      estimate_hours: 3
      status: done_static
      blocked_by: [T1, T2, T3, T4, T5, T6, T7, T8, T9]
      deliverable: |
        Full path: train a quick checkpoint headless, open viewer, click
        Review on the bundle, verify robot runs in AUTO with HUD. Switch
        Controller Panel to Gamepad, verify MANUAL control works. Hit X
        to load_next, verify hot-swap. Close viewer, restart, verify
        lifecycle is clean. Verify training subprocess is unaffected.
        Verify atexit cleanup. Document any rsl_rl edge cases hit at
        num_envs=1 in this yaml under §9 risks.
      delivered: |
        STATIC validation completed: all 10 modified/new files
        py_compile clean.  End-to-end import smoke test verifies the
        scheduler builds, the singleton works, control_mode default is
        AUTO, button bindings load, and the gamepad button map exists.
        Runtime end-to-end test (boot Kit, hot-swap, gamepad
        forwarding) requires the user's Isaac Lab venv and a real
        gamepad — flagged as user-side validation in §11 verify list.
        num_envs=1 edge cases for rsl_rl OnPolicyRunner are NOT yet
        verified at runtime (Risk #3 in §9 remains open until user
        runs the viewer once).

# -----------------------------------------------------------------------------
# §11 Verification (used by sub-agents to audit completeness)
# -----------------------------------------------------------------------------

verify:
  components:
    - "src/system/training/il_review_session.py exists and contains
       a main() that calls AppLauncher(headless=False) once and a stdin
       polling loop"
    - "src/system/training/isaac_review_session.py exists and exports
       a class IsaacReviewSession(QObject) with start/stop/load_checkpoint/
       set_command/is_ready methods"
    - "src/system/training/auto_command_schedule.py exists and exports
       build_auto_command_schedule(vx_range, vy_range, wz_range, hold_s)
       returning a list of (name, vx, vy, wz) tuples of length 16"
    - "bin/pages/layout/bindings_dialog.py exists and exports a class
       BindingsDialog(QDialog)"

  ui:
    - "TrainingFloatControlBar has an Open/Close Viewer button visible
       only when current backend is isaac_lab"
    - "Controller Panel has a Bindings... button next to the radio buttons"
    - "il_policy_exporter node UI has a control_mode dropdown with
       choices AUTO / MANUAL, default AUTO"

  routing:
    - "_on_il_export_review_requested checks IsaacReviewSession.is_ready()
       and routes to IPC fast path or one-shot Popen slow path accordingly"
    - "IsaacReviewSession is subscribed to CommandBus from
       GlobalInputManager and forwards published commands as IPC op:command
       messages"

  ipc:
    - "il_review_session handles all 8 op types listed in §3
       (load_checkpoint, command, control_mode, reset, pause, resume,
       snapshot, shutdown) and emits at least ready, loaded, stage_changed,
       error, telemetry messages"

  manifest:
    - "Bundle manifest.yaml has a review.control_mode field with AUTO or
       MANUAL value, written by bundle_exporter from the Export Node param"

  schedule:
    - "AUTO mode produces exactly 16 stages per cycle, total 64 s with
       default hold_s=4.0, names match §6 schedule list"

  lifecycle:
    - "TrainingWorkspaceWindow.closeEvent calls IsaacReviewSession.stop(),
       which sends shutdown then SIGTERM/SIGKILL escalation"
    - "Subprocess crash → manager state goes to error, button text reflects it"

  user_ini:
    - "user.ini has a [TrainingInput] section after the user opens
       BindingsDialog and clicks Save"

# -----------------------------------------------------------------------------
# §12 Out-of-scope items captured for v2
# -----------------------------------------------------------------------------

future_work:
  - "num_envs > 1 review with per-env command targeting (LB/RB switch
     focus). Skipped in v1 because single-robot review covers 95% of
     use cases."
  - "Live training metrics overlay in viewer (TensorBoard mirror). Out
     of scope; users can keep TensorBoard open separately."
  - "Replay recording: capture all (obs, action, command) during a
     review session for offline analysis. Useful for paper figures."
  - "Multi-checkpoint side-by-side: open two viewers loading different
     checkpoints, drive them with the same gamepad. Possible since
     IsaacReviewSession can be made non-singleton, but UI gets crowded."
  - "Network IPC instead of stdin pipes: would let UnitPort talk to a
     viewer running on a different machine (useful for headless
     workstation + laptop reviewer). Significant complexity, low demand."

