spec: amp_ppo_quadruped_bound
target: IsaacLab + rsl_rl, sim2sim MuJoCo
robot: wildcat (4-leg, 12-DoF)
goal: train bound gait from reference motion, deploy via sim2sim

# ── UnitPort implementation status (2026-04-12) ──
# Infrastructure for stages 0-6 is now supported:
#   - RSI: probabilistic + uniform_phase sampling (InitPoseConfig)
#   - Reward blend: linear anneal schedule (AMPConfig.lerp_schedule)
#   - DR timing: delayed activation + linear intensity ramp
#   - Canvas nodes expose all new params (bijection preserved)
# Automatic multi-stage pipeline (train_staged.py) NOT implemented;
# users chain stages manually via checkpoint resume.

problem:
  symptom: cold-start AMP-PPO, 4096 envs x 10k iters, no gait
  root_cause:
    - random policy + noisy discriminator + collapsing reward
    - DR enabled too early
    - no reference state init
    - style reward dominates before policy can stand

reference_data:
  format: npy or txt, per-frame [root_pos, root_quat, joint_pos, (joint_vel)]
  source_options:
    - AMP_for_hardware/datasets (dog mocap)
    - MetalHead/datasets (gallop, trot, jump)
    - record from IsaacGymEnvs ANYmal policy, retarget to wildcat
  retarget:
    method: joint name map + linear leg-length scale, IK refine if needed
    validate: replay in MuJoCo viewer, check foot contacts and base height

stages:

  - id: 0_sanity
    purpose: verify env + reward + PD before touching AMP
    config:
      amp: off
      rsi: off
      dr: off
      reward: [track_lin_vel, track_ang_vel, alive, action_rate, joint_acc]
      command_range: {lin_x: [0.0, 0.5], lin_y: [0, 0], ang_z: [0, 0]}
      iters: 2000
    pass_criteria:
      mean_episode_length: ">= 800 / 1000"
      track_lin_vel_reward: ">= 0.7 of max"
    fail_action: fix PD gains, action scale, or reward weights — do not proceed

  - id: 1_rsi_on
    purpose: seed env states from reference clip
    config:
      rsi:
        enable: true
        prob: 0.9         # 90% of resets sample from reference
        sample: uniform_phase
        fields: [base_pos_z, base_quat, joint_pos]   # skip vel, kinematic only
      early_termination:
        base_z_min: 0.25
        roll_pitch_max_deg: 50
        grace_steps: 5     # ignore termination during grace
    note: APEX-style kinematic-only RSI; full-state RSI is brittle on retargeted data

  - id: 2_ppo_warmup
    purpose: build balance + slow walk prior, no discriminator
    config:
      amp: off
      rsi: on (from stage 1)
      dr: off
      command_range: {lin_x: [0.0, 0.8], lin_y: [-0.2, 0.2], ang_z: [-0.5, 0.5]}
      iters: 1000
    pass_criteria:
      mean_episode_length: ">= 900 / 1000"
      visual: robot walks (any gait), does not fall

  - id: 3_amp_on
    purpose: enable discriminator, task-dominant blend
    config:
      amp: on
      reference_motion: bound_clip.npy
      discriminator:
        hidden: [1024, 512]
        grad_penalty: 0.01      # low for high-dynamic mocap (MetalHead)
        replay_buffer: 1e5
        learning_rate: 1e-4
      reward_blend:
        amp_task_reward_lerp: 0.75   # task-heavy at start
      iters: 2000
    monitor:
      disc_loss: target 0.5–0.7 (not 0 or 1)
      disc_acc: target 0.6–0.8
      style_reward_mean: trending up

  - id: 4_velocity_curriculum
    purpose: expand command range as policy improves
    config:
      curriculum:
        type: grid_adaptive       # legged_gym style
        promote_threshold: 0.8 of tracking reward
        max_lin_x: 2.0
        max_ang_z: 1.0
      iters: 3000
    pass_criteria:
      visual: bound gait visible at >= 1.0 m/s

  - id: 5_anneal_to_style
    purpose: shift weight from task to style for gait quality
    config:
      reward_blend:
        amp_task_reward_lerp:
          schedule: linear
          from: 0.75
          to: 0.3
          over_iters: 2000
      iters: 2000

  - id: 6_dr_and_terrain
    purpose: robustness, sim2sim gap closure — only after gait locked
    config:
      domain_randomization:
        friction: [0.4, 1.6]
        added_mass_kg: [-1.5, 1.5]
        push_interval_s: 8
        push_vel_xy: 0.5
        motor_strength: [0.9, 1.1]
        latency_ms: [0, 20]
      terrain:
        type: rough_curriculum
        levels: 10
      iters: 4000
    pass_criteria:
      survives_push: true
      mean_track_reward: ">= 0.7 across DR range"

total_iters: ~14000   # vs your 10000 stuck baseline

key_hparams:
  ppo:
    lr: 3e-4 adaptive
    clip: 0.2
    entropy: 0.005
    gae_lambda: 0.95
    gamma: 0.99
    minibatches: 4
    epochs: 5
    num_envs: 4096
    rollout_steps: 24
  network:
    actor: [512, 256, 128]
    critic: [512, 256, 128]
    activation: elu
  amp:
    obs: [joint_pos, joint_vel, base_lin_vel, base_ang_vel, foot_pos_local]
    obs_steps: 2

debug_protocol:
  - check: mean_episode_length stuck < 100
    cause: ET too aggressive or RSI not active
    fix: raise grace_steps, verify rsi.prob in logs
  - check: disc_loss collapses to 0
    cause: discriminator overpowering, fake too easy to spot
    fix: raise grad_penalty to 0.05, lower disc lr
  - check: disc_loss collapses to 1
    cause: fake distribution matches real (mode collapse) or buffer empty
    fix: check replay buffer fill, raise entropy
  - check: track reward grows but gait looks unnatural
    cause: lerp still task-heavy
    fix: advance to stage 5 earlier
  - check: works in IsaacLab, fails in MuJoCo
    cause: joint order mismatch, PD gains differ, latency not modeled
    fix: dump joint name list both sides, match Kp/Kd, add latency to stage 6 DR

deliverables:
  - configs/wildcat_bound_stage{0..6}.yaml
  - scripts/train_staged.py    # auto-advances stages on pass_criteria
  - scripts/sim2sim_mujoco.py  # loads exported .pt, MJCF, joint map
  - logs/tensorboard with disc_loss, ep_len, style_r, task_r per stage

references:
  - github.com/Alescontrela/AMP_for_hardware
  - github.com/inspirai/MetalHead
  - github.com/isaac-sim/IsaacLab
  - APEX (arxiv 2505.10022) — kinematic RSI
  - DeepMimic (Peng 2018) — RSI + ET
  - Rapid Locomotion (Margolis RSS 2022) — velocity curriculum
