# ============================================================================
# sim2sim_design.yaml — UnitPort sim-to-sim bridge unification
# ============================================================================
#
# Owner document for the Isaac Lab → MuJoCo sim-to-sim bridge architecture.
# Created 2026-04-11 during the "Option 2" centralization refactor.
#
# Purpose
# -------
# Define the single source of truth for how a policy trained in Isaac Lab
# is translated into the runtime configuration needed to replay it in
# MuJoCo. Before this refactor, two parallel IL parsers existed
# (src/system/policy/il_manifest_compat.py and
# src/system/skill/isaac_lab_manifest_parser.py) with independent obs /
# action / PD / joint-order / height_scan logic, causing silent drift
# between Mission playback, Training preview, and Checkpoint import.
# Option 2 consolidates all of it into one compiler module.
# ============================================================================

meta:
  status: in_progress
  current_stage: S2  # S1 completed 2026-04-11
  started: 2026-04-11
  owner: DrLavier
  related_docs:
    - knowledge_base/AMP_design.yaml
    - knowledge_base/mission_design.yaml
    - knowledge_base/issaclab_report.yaml

# ----------------------------------------------------------------------------
# Problem statement (pre-refactor state)
# ----------------------------------------------------------------------------
problem:
  summary: |
    Two parallel Isaac Lab → runtime-config pipelines exist. Any change to
    one (e.g. the height_scan grid_params bridge added 2026-04-11) has to
    be duplicated in the other or silent divergence occurs. Training
    preview and Mission playback can produce different robot behavior
    from the same bundle because they use different parsers.

  pipeline_a:
    name: Runtime playback pipeline
    entry: src/system/policy/il_manifest_compat.py::upgrade_v2_to_v1
    intermediate_repr: DeployContract
    downstream:
      - policy.obs_builder.ObsBuilder
      - policy.action_applier.ActionApplier
      - sim.pd_controller.PDController.from_deploy_contract
    consumers:
      - src/system/nodes/sys_nodes/behavior_node.py     # Mission runtime
      - src/system/training/vis_check_runner.py          # Training vis check + review
      - src/system/tools/robustness_matrix.py
      - src/system/policy/policy_command_executor.py
      - tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py

  pipeline_b:
    name: Skill / import / preview pipeline
    entry: src/system/skill/isaac_lab_manifest_parser.py::parse_isaac_lab_env_yaml
    intermediate_repr: SkillManifest
    downstream:
      - policy.obs_assembler.ObsAssembler      # duplicates ObsBuilder
      - policy.joint_reorder.compute_reorder_indices  # duplicates JointSpace
      - hardcoded PDController(kp=25, kd=0.5)  # ignores deploy_contract.stiffness
    consumers:
      - bin/pages/training/policy_preview_runner.py       # Training preview
      - src/system/nodes/sys_nodes/reactive_loco_node.py  # Reactive locomotion
      - src/system/service/checkpoint_registry.py          # Bundle import
      - src/system/skill/il_policy_onnx_export.py          # borrows yaml loader only

  duplicated_logic:
    - env.yaml parsing (obs layout, action scale, command fields, robot config)
    - joint order recovery from actuator joint_names_expr regexes
    - default_joint_pos extraction and per-joint expansion
    - PD gain (stiffness/damping/effort) extraction
    - height_scan grid derivation (pattern_cfg size/resolution)
    - observation term scale/clip/history_length defaults

# ----------------------------------------------------------------------------
# Target architecture
# ----------------------------------------------------------------------------
target:
  principle: >
    ONE compiler module owns the Isaac Lab → DeployContract translation.
    DeployContract is the single intermediate representation for sim2sim.
    All sim2sim consumers read from DeployContract, never from env.yaml.
    SkillManifest is retained (42 non-sim2sim consumers) as a view layer
    over DeployContract + skill-orchestration metadata.

  single_entry_point:
    module: src/system/policy/sim2sim_compiler.py
    api: |
      def compile(
          env_yaml: dict,
          manifest_raw: dict,
          mjcf_path: Optional[Path] = None,
      ) -> DeployContract:
          """Canonical Isaac Lab → runtime-config compiler.

          Inputs
          ------
          env_yaml       : parsed Isaac Lab env.yaml (via _IsaacLabEnvYamlLoader)
          manifest_raw   : parsed manifest.yaml (v1 or v2 layout)
          mjcf_path      : optional path to MJCF; used for joint order recovery

          Output
          ------
          DeployContract : the single sim2sim intermediate representation
          """

    helpers_promoted_to_public_api:
      - extract_observations_for_contract
      - extract_action_spec
      - extract_pd_gains
      - extract_default_joint_pos
      - extract_command_ranges
      - recover_joint_order
      - compute_height_scan_dim
      - extract_height_scan_grid_params

  deploy_contract_role: |
    Single intermediate representation between the IL bundle and any
    MuJoCo consumer. Carries exactly the information needed to replay
    the policy: joint_sdk_names, default_joint_pos, observations (with
    grid_params for height_scan), action spec, stiffness/damping/effort.
    Kept single-purpose — does NOT carry skill orchestration metadata.

  skill_manifest_role: |
    Retained as the domain object used by 42 non-sim2sim consumers:
    Service adapters (Unitree/Spot/Cyberdog real-robot deployment),
    Skill orchestration (transition_validator, transition_library),
    Runtime engine, Reactive loop, Compatibility checker, UI pages.
    Refactored to HOLD a DeployContract as one of its fields; all its
    sim2sim-derived fields (obs_layout, command_fields, joint_names,
    robot config) become derived views over deploy_contract.

  design_decisions:
    d1_contract_scope:
      question: Should DeployContract grow to cover all IL metadata?
      decision: "A: keep DeployContract single-purpose (sim2sim only)"
      rationale: >
        DeployContract and SkillManifest serve different concerns.
        Mixing orchestration metadata (preconditions, transitions,
        command interface) into DeployContract would couple the
        runtime playback layer to the skill orchestration layer.

    d2_preview_viewer:
      question: How does PolicyPreviewRunner get a viewer-bound PolicyRunner?
      decision: "A: add optional viewer=, command_provider= args to PolicyRunner.run_episode"
      rationale: >
        vis_check_runner already has _run_policy_in_viewer doing exactly this
        via PolicyRunner. Promote that pattern into run_episode itself so
        policy_preview_runner, vis_check_runner, and any future viewer
        consumer share one implementation.

    d3_legacy_bundles:
      question: What about old bundles without deploy_contract on disk?
      decision: Lazy upgrade at load time via upgrade_v2_to_v1 → sim2sim_compiler.compile
      rationale: >
        No data migration script needed. bundle_loader checks for
        deploy_contract in manifest; if missing, calls sim2sim_compiler
        to synthesize it in memory. New bundles (post-S3) carry
        deploy_contract on disk and skip the upgrade.

# ----------------------------------------------------------------------------
# Staged construction plan
# ----------------------------------------------------------------------------
plan:
  strategy: >
    Each stage is independently mergeable and reversible. Stage output is
    verified by running the existing sim2sim test suite before moving on.
    Target test: tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py
    must pass after every stage.

  stages:

    # ──────────────────────────────────────────────────────────────────
    S1:
      status: completed
      completed: 2026-04-11
      title: Create sim2sim_compiler module (pure-move, zero behavior change)
      actual_outcome:
        sim2sim_compiler_lines: 1096
        il_manifest_compat_lines: 349  # down from 1277 (73% reduction)
        tests_passing: "22/22 in test_il_deploy_contract_assembly.py; 128/129 across tests/unit/policy"
        pre_existing_failure: |
          tests/unit/policy/test_height_scan_ray_cast.py::test_height_scan_does_not_self_hit_robot
          fails because HEAD's obs_builder._get_height_scan uses the old
          ``dist - target_offset`` formula (~19.95) and the test asserts that,
          while the working tree uses the corrected Isaac Lab formula
          ``base_z - target_offset - hit_z`` (~-0.055) from the earlier
          height_scan fix session. This failure predates S1 and is orthogonal
          to sim2sim centralization — to be cleaned up in S7 regression pass.
        monkeypatch_note: |
          The upgrade_v2_to_v1 body in il_manifest_compat deliberately calls
          the underscore-prefixed aliases (_read_il_env_yaml, _load_mjcf_joint_names,
          _assemble_il_deploy_contract, ...) rather than the directly-imported
          sim2sim_compiler functions. This is required so that
          test_upgrade_v2_to_v1_writes_deploy_contract can monkeypatch the
          module attributes and intercept the calls. New code importing
          directly from sim2sim_compiler bypasses this indirection.
      scope:
        - Create src/system/policy/sim2sim_compiler.py
        - Promote il_manifest_compat._extract_* helpers to public API in the new module
        - Rewrite il_manifest_compat.upgrade_v2_to_v1 as a thin wrapper over sim2sim_compiler
        - Preserve the existing _IsaacLabEnvYamlLoader (stays in skill/isaac_lab_manifest_parser for now)
      touched_files:
        - src/system/policy/sim2sim_compiler.py           # new, ~400 lines
        - src/system/policy/il_manifest_compat.py         # shrink to ~150 lines wrapper
      risk: zero — pure code motion; all public APIs unchanged
      verify:
        - python -m py_compile on all touched files
        - pytest tests/unit/policy/test_il_deploy_contract_assembly.py
        - pytest tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py
      exit_criteria:
        - il_manifest_compat has NO private _extract_* helpers; all delegate
        - sim2sim_compiler.compile(env_yaml, manifest_raw, mjcf_path) returns DeployContract
        - Existing tests pass unchanged

    # ──────────────────────────────────────────────────────────────────
    S2:
      status: not_started
      title: Rewrite isaac_lab_manifest_parser as thin wrapper over sim2sim_compiler
      scope:
        - parse_isaac_lab_env_yaml internally calls sim2sim_compiler.compile
        - Build SkillManifest via new SkillManifest.from_deploy_contract constructor
        - Add deploy_contract field to SkillManifest dataclass
        - 42 existing SkillManifest consumers see zero API change
      touched_files:
        - src/system/skill/isaac_lab_manifest_parser.py   # rewrite ~200 lines
        - src/system/skill/skill_manifest.py              # add deploy_contract field
      risk: low
      verify:
        - All 42 SkillManifest consumers still import cleanly
        - Training preview and checkpoint import still produce valid SkillManifest
        - New test: round-trip env.yaml → DeployContract → SkillManifest matches legacy output

    # ──────────────────────────────────────────────────────────────────
    S3:
      status: not_started
      title: checkpoint_registry writes deploy_contract to disk on import
      scope:
        - import_isaac_lab_bundle writes deploy_contract into manifest.yaml at import time
        - bundle_loader detects deploy_contract in manifest, skips upgrade path
        - il_manifest_compat.upgrade_v2_to_v1 becomes lazy fallback for legacy bundles only
      touched_files:
        - src/system/service/checkpoint_registry.py
        - src/system/policy/bundle_loader.py
        - src/system/policy/il_manifest_compat.py
      risk: medium — changes bundle-on-disk format
      verify:
        - New bundles round-trip (import → export → reload) cleanly
        - Legacy bundles (no deploy_contract on disk) still work via lazy upgrade
        - Add test that imports a fresh bundle and asserts deploy_contract is on disk

    # ──────────────────────────────────────────────────────────────────
    S4:
      status: not_started
      title: policy_preview_runner migration to PolicyRunner
      scope:
        - Add viewer= and command_provider= args to PolicyRunner.run_episode
        - Extract _run_policy_in_viewer pattern from vis_check_runner
        - Rewrite policy_preview_runner to call PolicyRunner.load() + run_episode(viewer=...)
        - Delete hand-rolled ObsAssembler/compute_reorder_indices/hardcoded PD in preview runner
      touched_files:
        - src/system/policy/policy_runner.py
        - bin/pages/training/policy_preview_runner.py
        - src/system/training/vis_check_runner.py  # share extracted helper
      risk: medium — most user-visible change
      verify:
        - Training preview behaves identically to Mission playback on a known-good bundle
        - height_scan bundle previews correctly (validates end-to-end S1+S3+S4 chain)

    # ──────────────────────────────────────────────────────────────────
    S5:
      status: not_started
      title: reactive_loco_node migration
      scope:
        - reactive_loco_node.py consumes DeployContract directly (or via SkillManifest.deploy_contract)
        - Remove direct parse_isaac_lab_env_yaml call
      touched_files:
        - src/system/nodes/sys_nodes/reactive_loco_node.py
      risk: low

    # ──────────────────────────────────────────────────────────────────
    S6:
      status: not_started
      title: Deprecate obs_assembler.py
      scope:
        - Grep all consumers of obs_assembler.ObsAssembler
        - Migrate each to obs_builder.ObsBuilder
        - Leave shim file with DeprecationWarning, schedule removal next version
      touched_files:
        - src/system/policy/obs_assembler.py
        - all files importing it
      risk: medium — wide grep-and-replace

    # ──────────────────────────────────────────────────────────────────
    S7:
      status: not_started
      title: Regression test coverage
      scope:
        - Extend test_isaac_bundle_on_mujoco.py to cover PolicyPreviewRunner path
        - Add a rough-terrain / custom height_scan grid fixture and assert
          grid_params round-trips correctly through sim2sim_compiler
        - Add a test pinning PolicyPreviewRunner and vis_check_runner to the same
          PolicyRunner instance (detects future drift)
      touched_files:
        - tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py
        - tests/unit/policy/test_sim2sim_compiler.py  # new
      risk: zero

# ----------------------------------------------------------------------------
# Module responsibility matrix (post-refactor end state)
# ----------------------------------------------------------------------------
end_state:
  sim2sim_compiler.py:
    role: "THE Isaac Lab → DeployContract compiler"
    owns:
      - env.yaml parsing
      - joint order recovery
      - obs/action/command/PD/default_pos/height_scan extraction
      - DeployContract assembly
    does_not_own:
      - bundle loading (stays in bundle_loader)
      - runtime inference (stays in policy_runner)
      - skill orchestration (stays in skill_manifest)

  il_manifest_compat.py:
    role: "Legacy v1/v2 manifest shim"
    owns:
      - v1 → v2 field remapping
      - Lazy deploy_contract synthesis for legacy bundles (calls sim2sim_compiler)
    does_not_own:
      - env.yaml parsing (delegates to sim2sim_compiler)

  isaac_lab_manifest_parser.py:
    role: "SkillManifest constructor for IL bundles"
    owns:
      - SkillManifest-specific field mapping (precondition/postcondition/command_interface)
    does_not_own:
      - env.yaml parsing (delegates to sim2sim_compiler)
      - deploy_contract construction (reads from sim2sim_compiler output)

  deploy_contract.py:
    role: "Single sim2sim intermediate representation"
    scope: "Runtime playback only — no orchestration metadata"

  skill_manifest.py:
    role: "Domain object for skill orchestration"
    holds: deploy_contract as a field
    derives_from_contract:
      - joint_names
      - obs_layout
      - action_space
      - robot config

