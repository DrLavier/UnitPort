# =============================================================================
# RSI-AMP_STAGES.yaml — UnitPort 分阶段 AMP-PPO 训练方案
# -----------------------------------------------------------------------------
# 基于 RSI-AMP.yaml 的理论设计 + 实际 1000-iter 训练失败诊断结果。
# 本文件定义 4 个训练 Stage 的完整参数、切换条件、以及诊断检查点。
#
# 适用目标：Go2 四足，AMP 步态模仿，sim2sim MuJoCo 部署。
# 作者：claude-opus-4-6 (with DrLavier)
# 日期：2026-04-12
# =============================================================================

meta:
  name: RSI-AMP Staged Training Plan
  version: "1.0"
  date: "2026-04-12"
  robot: unitree_go2
  total_estimated_iters: 8000
  reference_motion_source: "pack:MetalHead:mocap_motions_bak"

# =============================================================================
# 诊断摘要：1000-iter 训练失败的 6 个致命原因
# =============================================================================
diagnosis:
  symptoms:
    - 站立姿态扭曲（关节振荡）
    - 行走时仅前腿运动
    - 就地摔倒

  root_causes:
    - id: RC1
      severity: fatal
      title: 冷启动 AMP + DR 同时开启
      detail: >
        随机策略 + 未训练判别器 + 全量域随机化 = 策略无法收敛。
        应先纯 PPO 建立基础站立/行走能力。

    - id: RC2
      severity: fatal
      title: Lerp schedule 与 max_iterations 不匹配
      detail: >
        lerp_schedule.over_iters=2000 但 max_iterations=1000，
        schedule 只跑了一半，lerp 卡在 0.525 而非到达目标 0.3。

    - id: RC3
      severity: fatal
      title: disc_lr=1e-5 过低
      detail: >
        判别器学习率仅为推荐值 1e-4 的 1/10，
        导致 style reward 退化为随机噪声。

    - id: RC4
      severity: fatal
      title: damping=0.5 严重不足
      detail: >
        Go2 PD 控制需要 Kd=1.5~4.0，0.5 的阻尼 + Kp=183 =
        欠阻尼振荡器，直接导致姿态扭曲。

    - id: RC5
      severity: fatal
      title: amp_reward_coef=0.4 过低
      detail: >
        style reward 量级被压缩到 task reward 的 1/5，
        AMP 信号强度不足。推荐值 2.0。

    - id: RC6
      severity: fatal
      title: 域随机化 iter 0 就全量开启
      detail: >
        joint_pos_noise=0.25rad(14°), push_force=[50,150],
        mass_offset=[-1.5,1.5]kg，对未成熟策略是灾难性的。

# =============================================================================
# 全局基线参数（所有 Stage 共享，Stage 内覆盖优先）
# =============================================================================
global_baseline:
  # ── Robot / Actor ──
  asset_id: unitree_go2
  init_pos_z: 0.34
  stiffness: 183.0
  damping: 3.0                    # 修复：0.5 → 3.0
  effort_limit: 30.0
  velocity_limit: 30.0
  action_scale: 0.25
  action_use_default_offset: true
  action_joint_names_expr: ".*"

  # ── Scene ──
  scene_id: flat_ground
  scene_type: flat
  gravity_z: -9.81
  sim_dt: 0.005
  friction_static: 1.0
  friction_dynamic: 0.8

  # ── Observation ──
  obs_terms:
    base_lin_vel: 1.0
    base_ang_vel: 1.0
    projected_gravity: 1.0
    velocity_command: 1.0
    joint_pos: 1.0
    joint_vel: 1.0
    last_action: 1.0
  enable_corruption: true
  corruption_noise_std: 0.05

  # ── Terminations ──
  termination_conditions:
    base_height: 0.20
    illegal_contact: 1.0

  # ── PPO 基线超参 ──
  num_steps_per_env: 24            # 修复：64 → 24
  num_learning_epochs: 5           # 修复：10 → 5
  num_minibatches: 4               # 修复：8 → 4
  learning_rate: 3e-4
  discount_factor: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  entropy_coef: 0.005              # 修复：0.01 → 0.005
  value_loss_coef: 1.0
  max_grad_norm: 1.0
  schedule: adaptive
  desired_kl: 0.01
  save_interval: 100
  seed: 42
  headless: true

  # ── Reference Motion (全局配置，AMP 阶段启用) ──
  reference_motion:
    motion_source: "pack:MetalHead:mocap_motions_bak"
    phase_mode: loop
    motion_fps: 48.0
    random_start_phase: true
    format_id: amp_legged_gym
    consumer_mode: amp
    amp_obs_fields: "joint_pos,joint_vel,base_lin_vel_local,base_ang_vel_local,toe_pos_local,root_height"

  # ── Network ──
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu

# =============================================================================
# Stage 定义
# =============================================================================
stages:

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 0: PPO Warmup — 建立站立 + 慢速行走基线
  # ───────────────────────────────────────────────────────────────────────────
  - id: "0_ppo_warmup"
    display_name: "PPO 热身"
    purpose: >
      纯 PPO 训练，验证 PD 参数、action scale、reward 权重。
      目标：机器人能稳定站立并响应低速行走指令。
    iterations: 2000

    # ── 训练模式 ──
    training_mode: PPO              # 无 AMP 判别器
    domain_rand_enabled: false      # 无域随机化

    # ── 指令范围（保守） ──
    commands:
      gain_lin_forward: 1.0
      gain_lin_backward: 0.5
      gain_lin_lateral: 0.3
      gain_yaw: 0.5
      resampling_time_range: [10.0, 10.0]
      zero_command_probability: 0.2

    # ── Reward（纯任务奖励） ──
    reward_terms:
      track_lin_vel_xy: 1.5
      track_ang_vel_z: 0.5
      alive_reward: 0.5
      flat_orientation: -1.0
      base_height: -2.0
      action_rate_penalty: -0.01
      joint_accel_penalty: -2.5e-7
      lin_vel_z_penalty: -0.5
      ang_vel_xy_penalty: -0.05

    # ── 通过条件 ──
    advance_criteria:
      auto:
        min_iterations: 1500
        min_mean_episode_length: 800    # out of 1000 max
        min_mean_reward: 1.5
      manual: true                      # 允许用户手动跳过

    # ── 诊断检查点 ──
    diagnostics:
      - check: "mean_episode_length < 200 at iter 500"
        cause: "PD 参数不合适或 termination 过严"
        fix: "检查 damping、stiffness、base_height termination 阈值"
      - check: "reward 持续为负"
        cause: "penalty 项权重过大"
        fix: "降低 flat_orientation / base_height penalty"

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 1: AMP On — 开启判别器，任务奖励主导
  # ───────────────────────────────────────────────────────────────────────────
  - id: "1_amp_on"
    display_name: "AMP 启动"
    purpose: >
      开启 AMP 判别器 + style reward，但保持 task-heavy 混合比。
      判别器从随机初始化开始学习区分 expert / policy transition。
    iterations: 2000
    resume_from: "0_ppo_warmup"     # 从 Stage 0 checkpoint 继续

    # ── 训练模式 ──
    training_mode: AMP_PPO
    domain_rand_enabled: false      # 仍然不开 DR

    # ── AMP 参数 ──
    amp_reward_coef: 2.0            # 修复：0.4 → 2.0
    task_reward_lerp: 0.75          # 75% task，25% style（任务主导）
    disc_grad_penalty: 5.0          # 从 10.0 降低，high-dynamic mocap 适用
    disc_label_smoothing: 0.9       # 修复：0.85 → 0.9
    amp_replay_buffer_size: 200000
    num_preload_transitions: 200000
    disc_lr: 1e-4                   # 修复：1e-5 → 1e-4
    disc_hidden_dims: [1024, 512]
    init_noise_std: 1.0

    # ── Lerp Schedule ──
    lerp_schedule:
      start: 0.75                   # 开始：75% task
      end: 0.5                      # 结束：50/50 blend
      over_iters: 2000              # 与 Stage iterations 匹配

    # ── 指令范围（扩大） ──
    commands:
      gain_lin_forward: 1.5
      gain_lin_backward: 1.0
      gain_lin_lateral: 0.5
      gain_yaw: 1.0
      resampling_time_range: [10.0, 10.0]
      zero_command_probability: 0.1

    # ── Reward（+AMP style reward 混合） ──
    reward_terms:
      track_lin_vel_xy: 1.5
      track_ang_vel_z: 0.75
      alive_reward: 0.15
      flat_orientation: -0.5
      base_height: -1.0
      action_rate_penalty: -0.05
      joint_accel_penalty: -2.5e-7
      feet_air_time: 0.25
      lin_vel_z_penalty: -0.5
      ang_vel_xy_penalty: -0.05
      joint_torque_penalty: -0.0002

    advance_criteria:
      auto:
        min_iterations: 1500
        min_mean_episode_length: 900
        disc_accuracy_range: [0.55, 0.85]  # 判别器不能太强也不能太弱
      manual: true

    diagnostics:
      - check: "disc_loss < 0.1 (collapse to 0)"
        cause: "判别器过强，policy 完全被识别"
        fix: "增大 grad_penalty 到 10.0，降低 disc_lr"
      - check: "disc_loss > 0.9 (collapse to 1)"
        cause: "replay buffer 空或 policy 已 mode collapse"
        fix: "检查 motion data 加载，增大 entropy_coef"
      - check: "style_reward 持续为 0"
        cause: "disc_lr 太低或 normalizer 故障"
        fix: "检查 AMP/task_reward_lerp TensorBoard 曲线"

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 2: Style Anneal — 风格逐渐主导，步态质量提升
  # ───────────────────────────────────────────────────────────────────────────
  - id: "2_style_anneal"
    display_name: "风格退火"
    purpose: >
      逐步将 reward blend 从 task-heavy 切换到 style-heavy，
      让策略从 "能走" 进化到 "走得像参考动作"。
    iterations: 2000
    resume_from: "1_amp_on"

    training_mode: AMP_PPO
    domain_rand_enabled: false

    # ── AMP 参数（继承 Stage 1，仅覆盖 lerp） ──
    amp_reward_coef: 2.0
    disc_lr: 5e-5                   # 降低：判别器已稳定，减缓学习
    disc_grad_penalty: 5.0
    disc_label_smoothing: 0.9

    lerp_schedule:
      start: 0.5                    # 从 Stage 1 结束点开始
      end: 0.25                     # 结束：25% task, 75% style
      over_iters: 2000

    # ── 指令范围（全速域） ──
    commands:
      gain_lin_forward: 2.0
      gain_lin_backward: 1.0
      gain_lin_lateral: 0.5
      gain_yaw: 1.5
      resampling_time_range: [10.0, 10.0]
      zero_command_probability: 0.1

    reward_terms:
      track_lin_vel_xy: 1.0         # 降低 task 权重
      track_ang_vel_z: 0.5
      alive_reward: 0.1
      flat_orientation: -0.3
      base_height: -0.5
      action_rate_penalty: -0.07
      joint_accel_penalty: -2.5e-7
      feet_air_time: 0.25
      lin_vel_z_penalty: -0.3
      ang_vel_xy_penalty: -0.03
      joint_torque_penalty: -0.0002
      undesired_contacts: -0.5

    advance_criteria:
      auto:
        min_iterations: 1500
        visual_check_required: true   # 需要用户确认步态质量
        min_mean_style_reward: 0.5
      manual: true

    diagnostics:
      - check: "步态退化（开始摔倒）"
        cause: "style anneal 太快，task reward 不够维持平衡"
        fix: "调高 lerp end 值（如 0.35），增加 alive_reward"
      - check: "步态看起来像参考但不跟踪速度指令"
        cause: "style reward 压制了 velocity tracking"
        fix: "增大 track_lin_vel_xy 权重到 1.5"

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 3: DR + Robustness — 域随机化，鲁棒性训练
  # ───────────────────────────────────────────────────────────────────────────
  - id: "3_dr_robustness"
    display_name: "域随机化"
    purpose: >
      步态已锁定，开启域随机化提升鲁棒性。
      渐进式增加扰动强度，确保 sim2sim 泛化。
    iterations: 2000
    resume_from: "2_style_anneal"

    training_mode: AMP_PPO
    domain_rand_enabled: true

    # ── AMP（锁定） ──
    amp_reward_coef: 2.0
    task_reward_lerp: 0.25          # 固定在 style-heavy
    disc_lr: 5e-5
    lerp_schedule: none             # 不再退火

    # ── 域随机化（渐进式） ──
    domain_rand:
      rand_schedule: linear
      rand_schedule_start_step: 0       # 相对于本 Stage 的 step
      rand_schedule_end_step: 300000    # ~1500 iters 达到满强度

      # 摩擦
      enable_friction_rand: true
      friction_mode: reset
      static_friction_range: [0.6, 1.4]   # 保守范围
      dynamic_friction_range: [0.6, 1.4]

      # 质量
      enable_mass_rand: true
      mass_mode: reset
      mass_target_body: "(base|trunk)"
      mass_offset_range: [-0.8, 0.8]      # 修复：[-1.5,1.5] → [-0.8,0.8]

      # 外力推动
      enable_external_push: true
      push_mode: interval
      push_interval_range_s: [10.0, 10.0]
      push_velocity_x_range: [-0.3, 0.3]  # 修复：[-0.5,0.5] → [-0.3,0.3]
      push_velocity_y_range: [-0.3, 0.3]

      # 初始姿态
      enable_init_pose_rand: true
      init_pose_mode: reset
      init_pos_x_range: [-0.2, 0.2]
      init_pos_y_range: [-0.2, 0.2]
      init_yaw_range: [-1.0, 1.0]         # 修复：[-3.14,3.14] → [-1.0,1.0]

      # 关节噪声
      enable_joint_noise: true
      joint_noise_mode: reset
      joint_pos_noise: 0.05               # 修复：0.25 → 0.05 (≈3°)
      joint_vel_noise: 0.05

      # 电机
      motor_strength_range: [0.9, 1.1]
      joint_damping_range: [0.95, 1.05]
      obs_noise_std: 0.01

    reward_terms:
      track_lin_vel_xy: 1.0
      track_ang_vel_z: 0.5
      alive_reward: 0.15
      flat_orientation: -0.3
      base_height: -0.5
      action_rate_penalty: -0.07
      joint_accel_penalty: -2.5e-7
      feet_air_time: 0.25
      lin_vel_z_penalty: -0.3
      ang_vel_xy_penalty: -0.03
      joint_torque_penalty: -0.0002
      undesired_contacts: -0.5

    advance_criteria:
      auto:
        min_iterations: 1500
        min_mean_episode_length: 800    # DR 下允许略低
        survives_push: true
      manual: true

    diagnostics:
      - check: "开启 DR 后 episode length 骤降"
        cause: "DR 强度过大"
        fix: "缩小 mass/friction/push 范围，延长 rand_schedule_end_step"
      - check: "MuJoCo sim2sim 时表现差"
        cause: "joint order 不匹配或 PD gains 不一致"
        fix: "检查 joint name list 两侧是否一致，匹配 Kp/Kd"

# =============================================================================
# Stage 切换机制设计要求
# =============================================================================
stage_transition:
  modes:
    - id: auto
      description: >
        基于 advance_criteria 自动切换。Runner 每 N iters 评估一次：
        - min_iterations 是否满足
        - mean_episode_length / mean_reward / disc_accuracy 是否达标
        全部满足则自动保存 checkpoint 并进入下一 Stage。
      eval_interval: 50             # 每 50 iter 评估一次

    - id: manual
      description: >
        用户在 Training Ground UI 中手动点击 "Advance Stage" 按钮。
        当前训练暂停 → 保存 checkpoint → 加载下一 Stage 配置 →
        从 checkpoint 恢复训练。

    - id: hybrid
      description: >
        默认 auto，但 visual_check_required=true 的 Stage
        会在满足数值条件后暂停等待用户确认。

  checkpoint_strategy:
    format: "stage_{stage_id}_iter_{iter}.pt"
    auto_save_on_advance: true
    keep_best_per_stage: true       # 保留每个 Stage 的 best checkpoint

# =============================================================================
# 与现有 Canvas Node 的映射关系
# =============================================================================
canvas_mapping:
  note: >
    当前 Canvas 缺少 Stage 编排能力。需要新增 TrainingPipelineNode
    或扩展 ILPPOTrainerNode。详见 Stage Node 设计文档。

  current_limitations:
    - MultiGatedRewardNode 仅支持 2 个 reward stage，无法控制 AMP/DR/command 切换
    - ILPPOTrainerNode 无 stage 概念，所有参数一次性配置
    - 无 stage 间 checkpoint 自动传递机制

  required_capabilities:
    - N 个 Stage 的参数覆盖（reward、AMP、DR、command）
    - 基于 iter/score 的自动切换 + 手动切换
    - Stage 间 checkpoint 自动链接
    - TensorBoard 中 Stage 边界标记
