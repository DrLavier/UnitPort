# ---------------------------------------------------------------------------
# 13. Future TODOs (deferred work tracked across phases)
# ---------------------------------------------------------------------------
# This is the canonical place to record work that surfaced during a phase
# but was intentionally deferred. Each entry MUST carry:
#   - id           : stable token (e.g. P4-T1)
#   - origin_phase : the phase where the gap was discovered
#   - title        : one-line summary
#   - context      : why it was deferred + what it unblocks
#   - acceptance   : how we'll know it's done
#   - blocking     : list of phase ids that depend on it (or [] if none)
#
# When you start working on a TODO, move it from this section into the
# active phase's deliverables list and add a test gate. Resolved TODOs
# stay here with status: resolved + a pointer to the implementing commit.
future_todos:
  - id: P4-T1
    status: resolved
    resolved_on: 2026-04-08
    resolved_by: |
      tests/fixtures/synthetic_bundle.py + tests/conftest.py expose
      synthetic_isaac_go2_bundle (and a height_scan variant) as
      session-scoped fixtures. The fixture builder generates a real
      Linear(45→12) ONNX policy via torch + a v2 SkillManifest yaml
      so PolicyRunner.load can succeed end-to-end against MjSimEnv
      built from menagerie go2. BehaviorNode._load_skill_manifest
      gained a direct-path fallback for bundles not registered in
      CheckpointRegistry. Test gates:
        - tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py
            ::test_p4t1_synthetic_bundle_loads_and_runs_via_policy_runner
            ::test_p4t1_height_scan_variant_emits_obs_remap_warning
    origin_phase: P4
    title: Real Isaac bundle end-to-end fixture test
    context: |
      P4's sim2sim test (tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py)
      uses unittest.mock to inject a fake SkillManifest because no real
      Isaac-trained ONNX bundle ships with the repo. The current test
      validates the contract (matchers run, warnings flow into
      diagnostics) but never actually loads a real Isaac policy through
      PolicyRunner against MjSimEnv.
    deferred_because: |
      A real fixture would need a small (<5 MB) Isaac-trained bundle
      checked into the repo with manifest.yaml + policy.onnx + source.json,
      AND the bundle has to actually be compatible with the menagerie go2
      MJCF (joint order, action scale). Producing such a fixture is its
      own piece of work and would have blocked P4 acceptance for no
      additional contract coverage.
    acceptance: |
      tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py grows a new
      test that:
        1. loads tests/fixtures/bundles/isaac_go2_walk_minimal/ via
           CheckpointRegistry
        2. drives BehaviorNode → PolicyRunner → MjSimEnv for ≥100 control
           steps
        3. asserts the run completes with steps_run > 0
        4. asserts diagnostics.obs_remap_warnings names every Isaac-only
           sensor declared in the fixture's manifest
    blocking: []   # nothing else waits on this; it's an additive test gain

  - id: P4-T2
    status: resolved
    resolved_on: 2026-04-08
    resolved_by: |
      BehaviorNode._run_embodiment_matching now returns
      (warnings, fatal_reason); when match_actor_to_manifest emits
      CompatStatus.FAIL the caller short-circuits with
      ``embodiment_match_failed: <codes>`` BEFORE PolicyRunner.load
      runs. Field matcher FAIL is intentionally NOT fatal (kept as
      WARN for stress-test runs). Test gate:
        - tests/integration/sim2sim/test_isaac_bundle_on_mujoco.py
            ::test_behavior_node_short_circuits_on_actor_matcher_fail
          (asserts PolicyRunner.load is never called when actor
           action_dim mismatches the manifest)
    origin_phase: P4
    title: Promote actor-matcher FAIL into a hard pre-flight stop
    context: |
      Today _run_embodiment_matching collects FAIL-level issues from
      match_actor_to_manifest into the warnings list but does NOT block
      PolicyRunner.load. The bundle-level CompatibilityChecker re-runs
      a similar check and raises IncompatibleWeightError, so the user
      still gets the failure — but the redundant load wastes time.
    deferred_because: |
      Wiring this cleanly means deciding whether the BehaviorNode
      should also short-circuit field-matcher FAILs (currently they
      can only be WARN), and whether the executor should treat a P4
      pre-flight FAIL differently from a runtime FAIL in
      mission_runtime_diagnostics. Both are policy decisions worth
      thinking about separately.
    acceptance: |
      BehaviorNode short-circuits with a structured failure result
      whose termination_reason is "embodiment_match_failed" before
      ever calling PolicyRunner.load when match_actor_to_manifest
      returns CompatStatus.FAIL. A new test asserts no PolicyRunner
      load attempt happens in that case.
    blocking: []

  - id: P5-T1
    status: resolved
    resolved_on: 2026-04-08
    resolved_by: |
      MjField gained a ``heightfield`` block that compose() consumes
      via spec.add_hfield + an mjGEOM_HFIELD geom. shared/fields/
      rough_terrain.yaml ships a 32x32 procedural noise heightfield
      seeded for CI reproducibility. Test gates:
        - tests/integration/runtime/test_default_fields_smoke.py
            ::test_rough_terrain_field_registers_a_heightfield
        - tests/integration/runtime/test_default_fields_smoke.py
            ::test_shipped_field_runs_100_steps_with_go2[rough_terrain]
    origin_phase: P5
    title: rough_terrain field with real heightfield data
    context: |
      The yaml lists rough_terrain among the shipped defaults but P5
      ships only flat_ground / stair_climb / prop_obstacle_field.
      rough_terrain needs a binary heightfield (.png or .hfield file)
      bundled with the field yaml so MuJoCo can load it via
      ``<asset><hfield .../></asset>`` and ``<geom type="hfield".../>``.
    deferred_because: |
      mjSpec composition can add geoms easily but heightfield assets
      need to be registered as named assets BEFORE the geom can
      reference them; that requires a different mjSpec code path
      (spec.add_hfield with a numpy buffer). Worth doing as its own
      slice rather than rushing it into P5 v1.
    acceptance: |
      shared/fields/rough_terrain.yaml exists and references a small
      bundled heightfield (e.g. shared/fields/assets/rough_terrain.hf
      or a procedurally generated noise texture). load_field +
      MjField.compose produce an MjSimEnv whose mj_model.nhfield > 0
      and a go2 idle run survives ≥100 steps. Robustness Matrix lists
      it as a stress test.
    blocking: []

  - id: P5-T2
    status: resolved
    resolved_on: 2026-04-08
    resolved_by: |
      MjField.compose() runs through mjSpec when self.lighting is
      non-empty (the fast-path skip is now gated on no props AND no
      lighting AND no heightfield). _apply_lighting writes
      visual.headlight.{ambient,diffuse,specular} per the field yaml.
      shared/fields/low_light.yaml ships a 4x dimming preset. Test:
        - tests/integration/runtime/test_default_fields_smoke.py
            ::test_low_light_field_dims_headlight_in_compiled_model
    origin_phase: P5
    title: low_light field (lighting stress for vision policies)
    context: |
      Listed among the shipped defaults in §7 but deferred for P5 v1
      because it needs lighting XML manipulation (set_attr on existing
      <light> elements via mjSpec) rather than just adding new geoms,
      and because no P4 obs adapter currently consumes camera obs that
      would actually be sensitive to lighting. Useful when vision
      bundles land.
    deferred_because: |
      Without a vision-policy bundle to validate, the field would be
      visually different but indistinguishable from flat_ground at the
      EpisodeStats level. Better to ship it together with the first
      vision-aware obs_adapter sensor.
    acceptance: |
      shared/fields/low_light.yaml exists; MjField.compose tweaks the
      ambient/headlight RGB values; an integration test asserts the
      composed mj_model carries different light parameters than
      flat_ground. Smoke test does NOT need to validate visual output.
    blocking: []

  - id: P5-T3
    status: resolved
    resolved_on: 2026-04-08
    resolved_by: |
      MjField._add_prop_geom now switches over a
      ``_GEOM_TYPE_MAP`` covering box / sphere / cylinder / capsule /
      plane with per-type default sizes and 3-component padding.
      shared/fields/mixed_props_arena.yaml exercises every primitive.
      Test gate:
        - tests/integration/runtime/test_default_fields_smoke.py
            ::test_mixed_props_arena_adds_4_non_box_geoms
            ::test_shipped_field_runs_100_steps_with_go2[mixed_props_arena]
    origin_phase: P5
    title: cylinder/sphere/plane prop types in MjField composition
    context: |
      MjField._add_prop_geom only handles ``type: box`` in P5 v1.
      Cylinder / sphere / plane / capsule are silently skipped — the
      yaml schema accepts them but compose() drops them.
    deferred_because: |
      P5's three shipped fields only need boxes. Adding the other
      primitives is mechanical (one extra mjtGeom branch each) but
      gives no test coverage value until a field actually uses them.
    acceptance: |
      _add_prop_geom dispatches box / cylinder / sphere / plane /
      capsule via a small switch table. A new field yaml under
      shared/fields/ uses at least one non-box prop and the smoke
      suite includes it in the parametrize list.
    blocking: []

  - id: P5-T4
    status: resolved
    resolved_on: 2026-04-08
    resolved_by: |
      project_session gained get_active_project_root(); StartNode's
      execute() now resolves the field via load_field(field_id,
      project_root=...) so a project-local field override is picked
      over the shared default. v1.4 update: the original MjFieldNode
      _resolve_field path was removed when MjFieldNode itself was
      deleted; the same logic now lives directly in StartNode.execute.
      Test gates:
        - tests/unit/nodes/test_start_node_refactor.py
            ::test_start_node_field_id_drives_sim_env_field_choice
            ::test_start_node_legacy_default_field_id_param_still_loads
    origin_phase: P5
    title: project-local field discovery via ProjectStore
    context: |
      field_loader currently accepts a project_root Path argument but
      no callers thread one in — StartNode/MjFieldNode only know
      "shared". Real project-local fields under
      ``projects/<slug>/scenarios/fields/`` are discoverable by the
      loader API but invisible to the canvas at runtime.
    deferred_because: |
      Wiring requires deciding how MjFieldNode learns about the
      current project (a ProjectStore singleton lookup? a context
      param threaded from runtime_engine? a parameter on StartNode?).
      That decision touches the broader Project Workspace contract,
      which is owned by ProjectStore — better to pull on that thread
      deliberately than rushing it into P5.
    acceptance: |
      MjFieldNode.execute() resolves the active project_root via
      ProjectStore (or equivalent) and passes it to load_field, so
      a project-local stair_climb.yaml override is picked over the
      shared default. A new test confirms the precedence.
    blocking: [P6-T3]   # Field Editor needs project-local discovery

