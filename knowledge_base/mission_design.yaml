      drag) is a still-pending UI integration step — see P6-T5b.
    origin_phase: P6
    title: Surface region warnings in the Canvas badge layer
    context: |
      The region_validator emits warnings into CanvasToIR's
      Diagnostic list (W codes region.multi_start / region.inversion
      / region.output_feedback). These warnings reach the user
      indirectly via the Console / log; the offending nodes don't
      get a visual badge on the canvas itself.
    deferred_because: |
      Canvas badge rendering already exists for compatibility audit
