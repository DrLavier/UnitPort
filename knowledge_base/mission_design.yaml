# ---------------------------------------------------------------------------
# 1. Problem statement
# ---------------------------------------------------------------------------
problem_statement: |
  Mission layer today can author DAGs (Canvas → IR → NodeExecutor), but the
  RUNTIME side of Mission is a vacuum:
    - runtime/simulation/mujoco/ contains only read-only menagerie MJCF assets.
    - BehaviorNode has no live SimEnvContext to inject into PolicyRunner.
    - BUG-1 (behavior_node.py:202): without sim_env, BehaviorNode fails fast
      with "sim_env_required"; the only working path is neutral_replay on a
      hardcoded flat ground.
    - There is no Mission-side concept of a SCENE/FIELD that is independent of
      the training environment, so users cannot test bundle robustness against
      novel terrain, props, lighting, or sensor noise.
    - Isaac Lab → MuJoCo handoff is silently lossy: Isaac-only obs (height_scan
      etc.) are sidestepped by neutral_replay rather than properly remapped.

  Goal: turn Mission into a true sim2real validation harness for bundles
  produced by the Training workspace (and by external sources — HF, VLA, etc.),
  with a clean separation between mission LOGIC and mission RUNTIME.

# ---------------------------------------------------------------------------
# 2. Design principles
# ---------------------------------------------------------------------------
principles:
  - id: P1
    name: Logic / Runtime separation
    statement: |
      Mission has two orthogonal layers:
        - LOGIC layer  : Canvas DAG + Python behavior scripts (already exists)
        - RUNTIME layer: MuJoCo physical world built from ACTOR ⊕ FIELD,
                         consumed by BUNDLE via SkillManifest contracts.
      The two layers communicate ONLY through node ports — no hidden globals.

  - id: P2
    name: Three-element runtime model
    statement: |
      Mission runtime is composed of three first-class concepts:
        - ACTOR : an MJCF embodiment (joints, actuators, on-body sensors).
                  Provides the action surface that bundles drive.
        - FIELD : a free-form scene (terrain, props, lighting, off-body
                  sensors). Authored independently of any training env.
        - BUNDLE: a trained policy + SkillManifest. Consumes actor's action
                  contract and field's sensor contract.
      Binding: ACTOR ⊕ FIELD = SimEnvContext, BUNDLE runs on top.

  - id: P3
    name: Field is NOT a copy of the training scene
    statement: |
      The whole point of Mission validation is to expose bundles to scenes
      they were NOT trained on (different terrain, lighting, obstacles,
      sensor noise) so robustness can be measured. Field authoring must be
      free-form, not derived from training scene metadata.

  - id: P4
    name: SkillManifest is the contract boundary
    statement: |
      Bundle ↔ Actor/Field compatibility is mediated by SkillManifest fields
      (action_space_type, required_joints, required_sensors,
      precondition_posture, target_robot_family). Mismatches must surface as
      WARN/FAIL diagnostics, not silent runtime errors.

  - id: P5
    name: Mission canvas follows task-authoring intuition
    statement: |
      Mission canvases are designed for users who think about a task in
      three steps:
        [INITIAL SETUP] → [LOGIC EXECUTION] → [OUTPUT HANDLING]
      This is a USER-FACING THINKING FRAMEWORK, not a literal canvas
      partition (v1.4 correction). The canvas is a single unified
      surface; nodes can be placed anywhere. The framework manifests
      as:
        - per-node region metadata (BaseNode.get_region())
        - a soft validator (region_validator.RegionValidator) that
          emits WARN diagnostics when wiring contradicts the mental
          model (e.g. an Output node feeding back into a Logic node)
      The validator NEVER blocks compilation. v1.0/P6-T2 painted three
      visual lane backgrounds — that was a misinterpretation and is
      reverted in v1.4.

  - id: P6
    name: Single sim_env per mission canvas (closes Q1)
    statement: |
      A mission canvas owns exactly ONE SimEnvContext, rooted at StartNode.
      Parallel-world A/B testing of multiple bundles is delegated to the
      Robustness Matrix tool (P5 phase), which iterates the same canvas N
      times with different field/bundle bindings. Canvas-internal parallel
      sim_envs are explicitly out of scope for v1.

  - id: P7
    name: Scene mutation = rebuild, never in-place (closes Q3)
    statement: |
      MuJoCo does not support runtime hot-swap of geoms/joints. v1.4
      collapses scene mutation to "edit StartNode parameters →
      re-execute the canvas → MjSimEnv is rebuilt fresh from
      MjActor.from_menagerie(robot_type) ⊕ load_field(field_id)".
      There are no separate ActorNode / FieldNode override nodes in
      v1.4 — see schema_version revision_notes for the rationale.

  - id: P8
    name: Region enforcement is soft (closes Q4)
    statement: |
      Region membership is declared per-node-category and validated by
      MissionPlanner as a WARNING, never a hard reject. Rationale: BUG-1
      remediation requires that legacy canvases (which predate the region
      taxonomy) keep opening and running. Hard rejection would regress that
      goal. Hard errors are reserved for unrecoverable conditions (no
      StartNode at all, sim_env edge missing AND no auto-injection possible).

# ---------------------------------------------------------------------------
# 3. Mission canvas structure (the three regions)
# ---------------------------------------------------------------------------
canvas_structure:
  region_1_initial_setup:
    purpose: |
      Establish the world before any logic runs. v1.4: this region
      contains EXACTLY ONE node — StartNode. Actor selection (robot
      brand+model) and field selection are parameters on the StartNode
      itself, not separate setup nodes.
    nodes:
      - StartNode (v1.4 — sole Region 1 node):
          location: src/system/nodes/sys_nodes/workflow_boundary_nodes.py
          role: |
            Single entry point of every mission. Constructs the
            SimEnvContext from its own parameters and exposes it on a
            ``sim_env`` output port. A brand-new mission with zero
            parameter changes runs go2 on flat_ground.
          owns:
            - SimEnvContext lifecycle (init / teardown)
            - actor selection (= robot_brand + robot_type, also fed
              into RobotContext as the SDK target identifier)
            - field selection (= field_id, resolved through
              field_loader's project-local + shared lookup)
          ports:
            outputs: [flow_out, sim_env, actor, field]
          parameters:
            - robot_brand        : str   (e.g. "unitree" — also the SDK target brand)
            - robot_type         : str   (e.g. "go2" — IS the actor id;
                                          fed into MjActor.from_menagerie)
            - field_id           : str   (defaults to "flat_ground";
                                          resolved through field_loader)
            - render_enabled     : bool
            - max_episode_steps  : int
          notes: |
            v1.4 explicitly removes the parallel ``default_actor_id``
            parameter — robot_type IS the actor id, single source of
            truth. The legacy ``default_field_id`` key is still
            tolerated on canvas load (backward-compat for canvases
            saved before v1.4) but new canvases emit ``field_id``.

            There is NO separate MjActorNode or MjFieldNode in v1.4.
            Scene mutation = edit StartNode parameters → re-execute.

  region_2_logic_execution:
    purpose: |
      Run the actual mission logic over the prepared sim_env. This is where
      bundles execute, where state machines tick, where user scripts run.
    nodes:
      - BehaviorNode (refactored — see Phase P3 for atomicity reasoning):
          role: load a bundle and run it inside the upstream sim_env
          ports:
            inputs:  [sim_env, checkpoint]
            outputs: [result, sim_env]   # threads sim_env through for chaining
          changes_from_today:
            - REMOVE BUG-1 fail-fast; sim_env is guaranteed by StartNode
            - REMOVE neutral_replay as the PRIMARY path (kept inside
              vis_check_runner for Training Ground export review only)
            - ADD SkillManifest compatibility check before run
            - ADD obs/action remap layer (Isaac → MuJoCo) via obs_adapter
          backward_compat:
            - Must preserve the three legacy `checkpoint` input shapes that
              behavior_node.py:79-97 currently accepts (dict from
              CheckpointNode, CheckpointBundle instance, parameter-only
              policy_id). Refactor adds sim_env as a NEW required input,
              not as a replacement of these.
      - CheckpointNode:
          role: unchanged — resolves policy_id → bundle_path
      - ScriptNode / StateMachineNode:
          role: existing logic-layer nodes, unchanged
      - TransitionNode (future, per Construction Directive):
          role: insert posture transitions between bundles

  region_3_output_handling:
    purpose: |
      Collect results, compute metrics, log artifacts, decide pass/fail.
      Closes the SimEnvContext.
    nodes:
      - MetricsNode:
          role: accumulate per-episode metrics (survival steps, command
            tracking error, energy, contact events)
      - RobustnessReportNode:
          role: aggregate metrics across multiple field variations into a
            "Bundle Robustness Matrix"
      - EndNode:
          role: explicit teardown; releases sim_env, flushes logs

# ---------------------------------------------------------------------------
# 4. Runtime layer architecture
# ---------------------------------------------------------------------------
runtime_layer:
  location: src/system/runtime/simulation/mujoco/
  new_modules:
    - file: mj_actor.py
      class: MjActor
      responsibility: |
        Load an MJCF embodiment, expose joints/actuators/on-body sensors,
        provide joint_map / action_scale / obs_extractors derived from
        SkillManifest.target_robot_family.
      key_methods:
        - load(mjcf_path) -> MjActor
        - apply_action(action: np.ndarray) -> None
        - read_joint_state() -> dict
        - read_onbody_sensors() -> dict
        - remap_to_manifest(skill_manifest) -> ActionRemap
    - file: mj_field.py
      class: MjField
      responsibility: |
        Compose a scene around an actor: terrain, props, lighting, off-body
        sensors. Built via mjSpec or <include> templating.

        REUSE: off-body sensor wiring DELEGATES to the existing
        src/system/sim/sensor_manager.py SensorManager. MjField does not
        re-implement sensor activation/readout — it only declares which
        sensors the field exposes, then hands the list to
        SimEnvContext.configure_sensors() (which routes through SensorManager).
      key_methods:
        - compose(base_actor: MjActor, field_spec: dict) -> mjModel
        - declare_offbody_sensors(spec) -> List[str]   # names only
        - randomize(rand_cfg) -> None
    - file: mj_sim_env.py
      class: MjSimEnv
      extends: src/system/policy/sim_env_context.SimEnvContext
      responsibility: |
        Concrete subclass of the existing SimEnvContext dataclass. The base
        class is NOT a stub — it already carries mj_model/mj_data fields,
        sensor_manager hooks (Phase 6), and overlay_info, with sim_step/
        reset/render raising NotImplementedError. MjSimEnv MUST:
          - subclass (not replace) SimEnvContext
          - keep all existing dataclass fields and Phase 6 sensor_manager hooks
          - implement sim_step / reset / render / is_terminated concretely
          - REUSE the working sim_env construction logic currently buried in
            src/system/training/vis_check_runner.py — specifically the
            ``SimEnvContext(...)`` construction site (~line 700) and the
            ``_run_export_bundle_episode_nonblocking`` function (~line 825),
            which together already monkey-patch a functional SimEnvContext
            including Isaac→MuJoCo joint adapters. Phase P1 promotes this
            code into mj_sim_env.py rather than rewriting from scratch.
            (Line numbers cited as anchors only — refer by symbol name to
            survive drift.)
      key_methods:
        - __init__(actor: MjActor, field: MjField)
        - sim_step() / reset() / render()
        - configure_sensors(spec) -> None   # delegates to existing base method
        - get_obs() / apply_action()
        - is_terminated() -> bool

  reused_modules:
    - src/system/policy/policy_runner.py    # already consumes SimEnvContext
    - src/system/policy/inference_engine.py # ONNX/JIT engines, no change
    - src/system/policy/compatibility_checker.py # to be EXTENDED in Phase 4
    - src/system/policy/sim_env_context.py  # base class, NOT replaced
    - src/system/sim/sensor_manager.py      # off-body sensor routing
    - src/system/sim/pd_controller.py       # PD control already in tree
    - src/system/service/checkpoint_registry.py  # bundle discovery, no change
    - src/system/training/vis_check_runner.py    # source of working sim_env
                                                 # construction (P1 cannibalize)

  module_disposition:
    - paths:
        - src/system/binding/executors/mujoco_executor.py
        - src/system/binding/executors/go2_mujoco_executor.py
        - src/system/binding/executors/spot_mujoco_executor.py
      audit_completed_on: 2026-04-08
      decision: |
        ALL THREE → (b) BINDING-LAYER CONCERN, leave untouched.

        Audit findings:
          - mujoco_executor.MujocoOperationExecutor is an OperationExecutor
            base class that dispatches BindingOutput operations
            (velocity_move, etc.) to adapter methods. It does not own
            mj_model/mj_data and does not call mj_step.
          - go2_mujoco_executor.Go2MujocoExecutor / spot variant override
            _execute_velocity_move() to forward to adapter.velocity_move_mujoco().
            They are operation-dispatch glue, not physics runtime.
          - There is ZERO overlap with MjSimEnv responsibilities (physics
            step loop, obs vector assembly, ctrl write, sensor readout).
            MjSimEnv operates at a lower level than these executors —
            different concerns, no migration needed.
        Conclusion: keep them in the binding layer untouched. MjSimEnv lives
        in src/system/runtime/simulation/mujoco/ as an independent concept.

# ---------------------------------------------------------------------------
# 5. BUG-1 resolution (per user directive)
# ---------------------------------------------------------------------------
bug1_resolution:
  current_behavior: |
    behavior_node.py:202 — if no sim_env was injected, BehaviorNode returns
    {status: failed, termination_reason: sim_env_required}. The only working
    path is _run_export_bundle_episode_nonblocking with neutral_replay=True
    on a hardcoded flat ground.
  resolution: |
    sim_env ownership moves into the StartNode (region 1). Every mission
    canvas has exactly one StartNode at its root, which constructs a default
    SimEnvContext (default actor + flat ground field) at execution time.
    Downstream BehaviorNodes receive sim_env via the canvas edge from
    StartNode (directly or threaded through ActorNode/FieldNode/etc.).
  guarantees:
    - Every BehaviorNode runs against a live MjSimEnv, never neutral_replay.
    - Brand-new missions work with zero configuration (default flat field).
    - Field/Actor customization is additive: replace defaults via optional
      override nodes, never re-construct the sim_env.
    - sim_env lifecycle is single-rooted, simplifying teardown in region 3.
  engine_changes:
    # v1.2 correction: runtime_engine.py is NOT touched. The auto-
    # injection lives in node_executor at runtime, NOT at compile
    # time, and the validator cannot synthesize a StartNode that
    # doesn't exist (see §11 coverage_gap). The shim only borrows
    # sim_env from a Region 1 node that the canvas already contains.
    - node_executor.py: thread ``sim_env`` port values through DFS so
      BehaviorNode receives them as ``inputs["sim_env"]``. This
      SUPPLEMENTS (takes priority over) the legacy bridge-based
      injection — see §5a for the resolution_priority order. The
      bridge survives as a tertiary fallback for non-canvas callers.
    - contracts.py: extend RuntimeResult.behavior_diagnostics with
      {field_id, actor_id, obs_remap_warnings, sim_env_source}.

# ---------------------------------------------------------------------------
# 5a. sim_env injection: bridge → port migration
# ---------------------------------------------------------------------------
sim_env_injection_migration:
  scope_clarification: |
    IMPORTANT (v1.2): two unrelated mechanisms in node_executor.py both
    historically got called "the bridge". They are NOT the same thing
    and only ONE of them is the sim_env bridge:

      (a) ``_SIM_ENV_AWARE_TYPES`` + ``set_parameter("sim_env", X)``
          at the registry-dispatch site. THIS is the sim_env bridge.
          P3 softens it to a fallback (only fires when inputs has no
          sim_env from the canvas port).

      (b) ``_behavior_invoker`` / ``_behavior_bridge`` fields owned by
          NodeExecutor. THESE belong to the legacy ``behavior_call``
          subgraph dispatch (BehaviorSubgraphInvoker) — they have
          NOTHING to do with MjSimEnv or BehaviorNode (the new
          checkpoint-runner). P3 LEAVES THEM UNTOUCHED.

  current_state: |
    Pre-P3, sim_env reached BehaviorNode via mechanism (a) above:
      - ``_SIM_ENV_AWARE_TYPES = frozenset({"behavior"})`` flag
      - ``_execute_node()`` reads ``context["scenario"]["sim_env"]``
        and injects via ``logic_node.set_parameter("sim_env", X)``
      - sim_env never appears as a port on any canvas edge
  target_state: |
    sim_env becomes a first-class port value produced by StartNode
    (and optionally rewritten by MjActorNode/MjFieldNode), threaded
    through canvas data edges by node_executor's DFS, and consumed by
    BehaviorNode via ``inputs["sim_env"]``. The legacy parameter-bridge
    path remains as a tertiary fallback for non-canvas callers (tests
    and scripted runs that hand sim_env via
    ``context["scenario"]["sim_env"]``); see resolution_priority.
  resolution_priority: |
    Implemented in NodeExecutor._resolve_sim_env_for_behavior():
      1. ``inputs["sim_env"]``         — canvas port edge (PRIMARY)
      2. upstream ``results[*].sim_env`` — auto-injection backward-compat
         shim for legacy canvases that have a StartNode but no explicit
         sim_env edge (emits a WARNING)
      3. ``context["scenario"]["sim_env"]`` / ``context["sim_env"]``
                                       — legacy parameter-bridge path,
         survives for tests / scripted callers that pre-inject sim_env
         instead of wiring a canvas
    The chosen source is recorded as ``sim_env_source`` in
    ``RuntimeResult.diagnostics[MISSION_RUNTIME_DIAGNOSTICS][node_id]``,
    one of: ``"port" | "auto_injected" | "bridge" | ""``.
  what_p3_actually_changed:
    - NodeExecutor gains _resolve_sim_env_for_behavior /
      _record_behavior_runtime_diagnostics / _inject_sim_env_into_inputs
      helpers, called right after _collect_inputs at every node-visit
      site (3 sites: flow-aware DFS, loop re-evaluation, topological).
    - The legacy ``set_parameter("sim_env", X)`` block at the registry
      dispatch site is GUARDED by ``"sim_env" not in inputs`` so it
      becomes a no-op when the canvas port already supplied a value.
    - ``_behavior_invoker`` / ``_behavior_bridge`` are UNCHANGED — they
      remain available for ``behavior_call`` subgraph dispatch.
    - vis_check_runner still owns its own SimEnvContext construction
      for Training Ground export review; it does not go through any
      bridge in node_executor.

# ---------------------------------------------------------------------------
# 6. Isaac → MuJoCo embodiment matching
# ---------------------------------------------------------------------------
embodiment_matching:
  problem: |
    Isaac Lab training often uses obs that MuJoCo cannot reproduce (height
    scan, lidar with Isaac sensor model). Joint orderings and action scaling
    also differ across simulators. Today's neutral_replay sidesteps this by
    refusing to compute those obs at all, but that masks real sim2sim drift.
  approach:
    - SkillManifest.required_sensors is the source of truth.
    - MjActor.remap_to_manifest() builds an ActionRemap (joint perm + scale).
    - New module: src/system/policy/obs_adapter.py
        responsibility: |
          For each manifest-required obs, declare a MuJoCo-side producer or a
          documented degradation strategy. Examples:
            - height_scan      → sample mj_data terrain heightfield (if field
                                 has one) OR substitute zero vector + WARN
            - imu              → direct from on-body IMU site
            - joint_pos/vel    → direct from mj_data.qpos/qvel via joint_map
            - lidar            → ray-cast against scene geoms
        contract: |
          obs_adapter never silently fakes data — every degradation emits a
          warning into RuntimeResult.behavior_diagnostics.obs_remap_warnings.
    - compatibility_checker.py extension:
        match_actor_to_manifest(actor, manifest) -> CompatibilityReport
        match_field_to_manifest(field, manifest) -> CompatibilityReport

# ---------------------------------------------------------------------------
# 7. Field asset library
# ---------------------------------------------------------------------------
field_library:
  storage:
    project_local: projects/<slug>/scenarios/fields/<field_id>.yaml
    shared_global: shared/fields/<field_id>.yaml
    rationale:    aligns with project_design.yaml local/shared model
  field_yaml_schema:
    required:
      - field_id          : str
      - base_terrain      : enum [flat, heightfield, stairs, slope, rough]
      - props             : list  [{type, pose, scale}]
      - lighting          : dict
      - offbody_sensors   : list  [{type, mount, params}]
    optional:
      - randomization     : dict  [terrain_noise, prop_jitter, sensor_noise]
      - viz_thumbnail     : str   (path)
  shipped_defaults:
    - flat_ground         : standard infinite plane (StartNode default)
    - rough_terrain       : heightfield with mild noise
    - stair_climb         : 5-step staircase
    - prop_obstacle_field : randomly placed boxes
    - low_light           : flat ground + reduced lighting (vision stress)

# ---------------------------------------------------------------------------
# 8. Phased implementation plan
# ---------------------------------------------------------------------------
phases:
  - id: P0
    name: Schema landing
    deliverables:
      - this file (knowledge_base/mission_design.yaml)
      - cross-reference from PROJECT_KNOWLEDGE.md
    blocking: false

  - id: P1
    name: MuJoCo runtime skeleton
    deliverables:
      - src/system/runtime/simulation/mujoco/mj_actor.py (NEW)
      - src/system/runtime/simulation/mujoco/mj_field.py (NEW)
      - src/system/runtime/simulation/mujoco/mj_sim_env.py (NEW)
        ↳ subclasses existing SimEnvContext, does NOT replace it
        ↳ extracts working logic from
          src/system/training/vis_check_runner.py — refer by symbol
          name (_run_export_bundle_episode_nonblocking and the
          surrounding SimEnvContext construction site) to survive
          line-number drift
      - module_disposition decision for the binding/executors/
        mujoco_executor trio (mujoco_executor.py +
        go2_mujoco_executor.py + spot_mujoco_executor.py); audit
        outcome recorded under §4 module_disposition before P1
        acceptance, not after
    acceptance: |
      A pytest unit test under tests/unit/runtime/test_mj_sim_env.py:
        - constructs MjSimEnv(actor=go2 from menagerie, field=flat_ground)
        - runs 100 sim steps under PolicyRunner against the same exported
          bundle that vis_check_runner.test_* fixtures already use
        - asserts joint state advances and no NotImplementedError fires
      No behavior_node.py changes in this phase.
    blocks: [P2, P3]

  - id: P2
    name: Mission node trio (additive only)
    deliverables:
      - src/system/nodes/sys_nodes/workflow_boundary_nodes.py:
        StartNode REFACTOR (not new file). Adds sim_env / actor / field
        output ports + default flat_ground field + default actor resolution.
        PRESERVES existing robot_brand/robot_type parameters and behavior.
      - src/system/nodes/sys_nodes/mj_actor_node.py  (NEW)
      - src/system/nodes/sys_nodes/mj_field_node.py  (NEW)
      - bin/nodes/node_ui_rows.py + bin/pages/canvas/graph_scene.py palette
        registration for the new nodes
      - NO changes to behavior_node.py in this phase (see P3)
    acceptance: |
      - StartNode legacy canvases still load and run unchanged
      - Drag StartNode → ActorNode → FieldNode chain in canvas, observe
        sim_env port carries an MjSimEnv instance at execution time
        (asserted via a node-level test, BehaviorNode not yet involved)
    depends_on: [P1]

  - id: P3
    name: Engine sim_env port injection + BehaviorNode refactor (atomic)
    rationale: |
      BehaviorNode refactor and engine port-threading MUST land in the same
      phase. Splitting them leaves BehaviorNode in a half-broken state with
      no sim_env source on either path.
    deliverables:
      - src/system/engine/node_executor.py:
          - thread sim_env port values through DFS into inputs["sim_env"]
            via _resolve_sim_env_for_behavior /
            _inject_sim_env_into_inputs helpers (called at all 3
            visit sites: flow-aware DFS, loop re-eval, topological)
          - SOFTEN _SIM_ENV_AWARE_TYPES dispatch with a
            ``"sim_env" not in inputs`` guard so the legacy parameter
            injection becomes a no-op when the canvas port already
            supplied a value (still active for context-bridge tests)
          - LEAVE _behavior_invoker / _behavior_bridge UNCHANGED —
            v1.2 §5a clarification: those fields belong to the
            ``behavior_call`` subgraph dispatch and have nothing to
            do with MjSimEnv. The "bridge" referenced by P3 is
            ONLY the _SIM_ENV_AWARE_TYPES + set_parameter path.
          - record per-visit diagnostics into
            _mission_runtime_diagnostics for RuntimeEngine to forward
      - src/system/engine/contracts.py:
          - extend behavior_diagnostics with
            {field_id, actor_id, obs_remap_warnings, sim_env_source}
            via the new MISSION_RUNTIME_DIAGNOSTICS DiagnosticsKey
      - src/system/nodes/sys_nodes/behavior_node.py (REFACTOR):
          - add sim_env as required input port (also threaded through
            on output for downstream consumers)
          - remove BUG-1 fail-fast guard
          - move PolicyRunner to the PRIMARY path; neutral_replay
            survives as a fallback when sim_env is missing but a
            bundle is on disk (legacy / out-of-engine callers only)
          - keep all three legacy ``checkpoint`` input shapes
            (dict / CheckpointBundle / parameter-only policy_id)
      - src/system/engine/runtime_engine.py:
          - collect ``executor._mission_runtime_diagnostics`` after
            execute() and forward into RuntimeResult.success/failed
          - NO StartNode auto-inject logic — handled at runtime
            inside node_executor (see v1.2 revision_notes + §11
            auto_injection_rule)
      - src/system/mission/mission_planner.py:
          - NO changes — the auto-injection lives in node_executor
            at runtime, NOT here. v1.2 explicitly moved this off the
            compile-time path so the on-disk canvas.json is never
            mutated by a synthetic edge.
    acceptance: |
      - Mission run on a legacy canvas (no explicit sim_env edge) succeeds
        via auto-injection
      - Mission run on a new canvas with explicit Actor/Field nodes succeeds
      - RuntimeResult.behavior_diagnostics contains field_id / actor_id /
        sim_env_source / obs_remap_warnings
      - Regression test: bridge path is unreachable from a Mission run
    depends_on: [P1, P2]

  - id: P4
    name: Embodiment matching (sim2sim core)
    deliverables:
      - src/system/policy/compatibility_checker.py:
          EXTEND existing module (it already exists). Add
          match_actor_to_manifest(actor, manifest) and
          match_field_to_manifest(field, manifest). Do NOT introduce a
          parallel checker framework.
      - src/system/policy/obs_adapter.py (NEW):
          v1 implementation is a SWITCH over a small fixed set of obs types
          (joint_pos/joint_vel/imu/height_scan/lidar). Registry refactor is
          deferred until ≥8 distinct obs types are needed (closes Q6).
      - hooks in BehaviorNode (already refactored in P3) to call
        match_actor_to_manifest before run
    acceptance: |
      An Isaac-trained go2 bundle runs in MuJoCo on flat ground; obs that
      cannot be reproduced (e.g. height_scan) emit warnings instead of
      crashing; a sim2sim test asserts the warnings list is non-empty.
    depends_on: [P3]

  - id: P5
    name: Field library + robustness matrix
    deliverables:
      - projects/<slug>/scenarios/fields/  +  shared/fields/  scaffolding
      - src/system/runtime/simulation/mujoco/field_loader.py
      - shipped default fields (flat_ground, rough_terrain, stair_climb,
        prop_obstacle_field, low_light)
      - "Bundle Robustness Matrix" tool (reuse vis_check_runner pattern):
        same bundle × N fields → success rate / mean survival steps
    depends_on: [P3, P4]

  - id: P6
    name: Mission UI polish
    deliverables:
      - Canvas palette: Actor / Field / Behavior / Start / End grouped by
        the three regions
      - Inline thumbnail render for FieldNode (QtMujoco)
      - Field Editor sub-page under bin/pages/scenario/
    depends_on: [P5]

# ---------------------------------------------------------------------------
# 9. Open questions (post-revision: Q1/Q3/Q4/Q6 closed)
# ---------------------------------------------------------------------------
open_questions:
  - id: Q2
    text: |
      Where should the default actor/field defaults live — project.yaml
      (per-project) or system.ini (per-installation)? Current draft says
      project.yaml.
  - id: Q5
    text: |
      How does this design interact with the in-flight Construction Directive
      v1.0 (SkillManifest, TransitionValidator, ActionDispatcher)? In
      particular, should TransitionNode insertion happen automatically in the
      logic region, or be explicit? Current draft: explicit for now.

closed_questions:
  - id: Q1
    resolution: |
      One sim_env per canvas. Multi-bundle A/B testing belongs to the
      Robustness Matrix tool (P5), not to canvas-internal parallelism.
      See principle P6.
  - id: Q3
    resolution: |
      Always rebuild. MuJoCo cannot hot-swap geoms/joints in mj_model.
      See principle P7.
  - id: Q4
    resolution: |
      Soft validation: region membership is declared per-node-category and
      MissionPlanner emits WARNINGs, never hard-rejects. Hard errors only
      for unrecoverable conditions. See principle P8.
  - id: Q6
    resolution: |
      Switch first, registry later. v1 obs_adapter.py uses a hard-coded
      switch over ~5 obs types. Refactor to a registry once ≥8 distinct
      obs types are in use.

# ---------------------------------------------------------------------------
# 10. Out of scope (explicit non-goals)
# ---------------------------------------------------------------------------
non_goals:
  - Real-robot dispatch is OUT of scope for this redesign — Mission runtime
    here is MuJoCo-only. Real-robot path stays via service/adapters/.
  - Training-side changes are OUT of scope — bundle producer (sb3_trainer,
    isaac_lab_backend) is unchanged. Only the consumer side moves.
  - New inference engines are OUT of scope — PolicyRunner + ONNX/JIT engines
    are reused as-is.
  - Multi-agent missions are OUT of scope for v1 (one actor per sim_env).
  - Canvas-internal parallel sim_envs are OUT of scope (closes Q1). A/B
    bundle comparison goes through the Robustness Matrix tool in P5.
  - In-place mj_model mutation is OUT of scope (closes Q3). Scene change
    means SimEnvContext rebuild.

# ---------------------------------------------------------------------------
# 11. Backward compatibility (NEW in v1.1)
# ---------------------------------------------------------------------------
backward_compat:
  legacy_start_node:
    file: src/system/nodes/sys_nodes/workflow_boundary_nodes.py
    current_state: |
      StartNode currently only sets RobotContext.robot_type via parameters
      robot_brand / robot_type. It has no output ports beyond flow_out.
    refactor_rules:
      - Preserve robot_brand / robot_type parameters and the
        RobotContext.set_robot_type() side effect.
      - Add new output ports: sim_env, actor, field. Old canvases that do
        not consume these ports must continue to load.
      - Default actor resolves from project.yaml's robot section; default
        field is "flat_ground" from the shipped field library.

  legacy_canvases:
    problem: |
      Existing project canvases predate this redesign. They contain a
      legacy StartNode and one or more BehaviorNodes with no sim_env edge.
      Without intervention, BUG-1 reappears the moment we wire the new
      port-based injection.
    auto_injection_rule: |
      Implemented at RUNTIME (NOT compile-time, despite the v1.1 draft).

      Decision rationale (v1.2 correction): mission_planner.py is a
      25-line thin wrapper around CanvasToIR with no IR-rewrite path.
      Doing the injection there would have required adding a synthetic
      IR edge inserter, complicated IR serialization (does the synthetic
      edge persist? how does the editor display it?), and pulled the
      WARNING emission far from the actual node-visit context. None of
      that buys observable benefit over the runtime equivalent.

      Actual implementation lives in
      NodeExecutor._inject_sim_env_into_inputs(), called once per
      behavior-node visit right after _collect_inputs(). For each
      BehaviorNode that lacks an inbound sim_env edge, the helper scans
      ``results`` for any upstream node whose output dict carries a
      ``sim_env`` key (i.e. a StartNode that already executed earlier
      in the same DFS) and binds that value into ``inputs["sim_env"]``
      before calling _execute_node(). The on-disk canvas.json is never
      mutated; the synthetic binding lives only in the per-visit
      inputs dict.
    user_visible_signal: |
      log_warning emitted from _resolve_sim_env_for_behavior() naming the
      BehaviorNode id and the upstream node id whose sim_env was used,
      with the suggestion "Wire the connection explicitly to silence
      this warning". The chosen source is also recorded as
      ``sim_env_source="auto_injected"`` in the RuntimeResult diagnostics.
    coverage_gap: |
      The auto-injection cannot synthesize a StartNode that doesn't
      exist — it can only borrow sim_env from a Region 1 setup node
      that the canvas already contains. A canvas with literally no
      StartNode and no MjActorNode/MjFieldNode will fall through to
      the legacy ``"bridge"`` source, and if that is also empty, the
      BehaviorNode reports ``no_sim_env_and_no_bundle`` failure
      gracefully (NOT the legacy fail-fast). This is acceptable: a
      canvas without any setup node is malformed by P5 region rules.

  behavior_node_input_shapes:
    file: src/system/nodes/sys_nodes/behavior_node.py
    current_shapes:
      - dict from CheckpointNode (status / bundle / bundle_path / policy_id)
      - CheckpointBundle instance (from src.system.policy.manifest_schema)
      - parameter-only fallback (self.parameters['policy_id'])
    rule: |
      P3 refactor MUST preserve all three shapes. sim_env is added as a
      separate required input, not as a replacement for any of these.

  bridge_pattern:
    file: src/system/engine/node_executor.py
    scope_clarification: |
      "Bridge" here refers ONLY to the _SIM_ENV_AWARE_TYPES +
      set_parameter("sim_env") path. The unrelated
      _behavior_invoker / _behavior_bridge fields belong to the
      ``behavior_call`` subgraph dispatch and are not affected by P3.
    current_state: |
      Pre-P3, _SIM_ENV_AWARE_TYPES at the registry-dispatch site
      injected sim_env from ``context["scenario"]["sim_env"]`` into
      BehaviorNode parameters, bypassing canvas edges entirely.
    rule: |
      P3 SOFTENED rather than removed: the registry-dispatch injection
      is now guarded by ``"sim_env" not in inputs``. When the canvas
      port has supplied a value via _inject_sim_env_into_inputs(), the
      legacy parameter injection becomes a no-op. When the canvas has
      NOT supplied one (e.g. a unit test that hands a sim_env via
      ``context["scenario"]["sim_env"]``), the legacy path still
      delivers it. This is the ``"bridge"`` source label in
      _resolve_sim_env_for_behavior().

