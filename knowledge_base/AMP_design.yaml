    - "0.4.0 (2026-04-09): PHASE_4 CODE-COMPLETE. All four phases are
       implemented and unit-tested:
         phase_1 (robot_assets): 17 tests
         phase_2 (motion pipeline): 32 tests
         phase_3 (AMP backend): 35 tests
         phase_4 (sim2sim + manifest + round-trip): 15 tests
       Total new tests: 99. Full suite 201/201 green, zero regression.
       Outstanding: end-to-end dry run in isaac venv (manual, out of
       scope for unit testing). See implementation_phases.*.status."
  author: claude-opus-4-6 (with DrLavier)
  status: phase_4_code_complete
  related_docs:
    - knowledge_base/PROJECT_KNOWLEDGE.md
    - knowledge_base/Construction_IssacLab.yaml
    - knowledge_base/issaclab_portal.yaml
    - knowledge_base/project_design.yaml
    - CLAUDE.md
  driving_use_case: >
    复刻社区案例 (IsaacGymEnvs anymal Bound → LeggedGym A1 → MuJoCo sim2sim) 在
    UnitPort Isaac Lab Training Ground 中重做：训练 wildcat 四足的 Bound 步态，
    AMP 风格奖励来自一段参考运动 .npy，最终导出 ONNX bundle 在
