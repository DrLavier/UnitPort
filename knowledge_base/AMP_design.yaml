# -----------------------------------------------------------------------------
# 8. 风险与开放问题
# -----------------------------------------------------------------------------
risks:
  - id: rsl_rl_namespace_collision
    severity: high
    detail: "vendored AMP 包用 'rsl_rl' 命名空间会与 isaac venv 中的 rsl-rl-lib 冲突。
             必须改名为 unitport.amp_rl 或 src.system.training.amp.*"
    mitigation: "vendoring 时全局 rename + 写 import shim"

  - id: amp_obs_dim_drift
    severity: high
    detail: "如果 unitree_gym_env.get_amp_observations() 字段顺序与 MotionClip 不一致,
             discriminator 学的就是垃圾, 但训练不会报错"
    mitigation: "joint_alignment.py 在 launcher 启动时强制校验 + dump 到 run.yaml"

  - id: usd_parser_venv_dependency
    severity: medium
    detail: "usd_parser.py 依赖 pxr (Pixar USD Python lib), 仅 isaac venv 内可用。
             从主 venv 触发 RobotAsset 注册时无法 parse usd_path 的 joint_names。"
    decision: pin_path_b
    mitigation: |
      **钉死路径 (b)**: 主 venv 内 mjcf_parser 是 metadata 主源 (mujoco python
      wheel 在主 venv 装得上), urdf_parser 是次源 (纯 xml, 零依赖). usd 文件
      本身仍透传给 launcher 子进程作训练侧资源, 但**主 venv 不 parse 它的
      joint_names**.

      validator 行为分级:
        - 用户提供 mjcf 或 urdf → 主 venv 立即 parse + 完整校验 (joint_names,
          dof_count, link tree)
        - 用户**只**提供 usd → validator 降级为 **warn-only**:
            * 主 venv 接受注册, joint_names 字段留空
            * 在 RobotAssetInspectorPanel 显示黄色警告 "USD-only asset:
              joint metadata will be verified at training launch"
            * launcher 子进程启动时调用 usd_parser 补做完整校验, 失败则
              abort training 并把错误回传给 UI
        - 用户提供 usd + mjcf → mjcf 抽 joint_names, usd 仅作训练资源;
          双源一致性校验照常 (mjcf joint_names ↔ launcher 内 usd parse 结果
          的延迟比对)

      副作用: usd_parser.py 不在主 venv 路径; 它住在 launcher 侧的延迟校验
      hook 里 (il_train_launcher.py 的 precheck 之后, AppLauncher 之前).

  - id: mocap_motion_license
    severity: low
    detail: "AMP_for_hardware 的 datasets/mocap_motions/ 是某狗运动捕捉, 协议待查"
    mitigation: "驱动用例先用用户自备的 wildcat bound 轨迹"

  - id: wildcat_user_responsibility
    severity: low
    detail: "wildcat 的 .usd / .xml 完全由用户准备 (我们不转换)。如果用户拿到的
             URDF 没有对应 USD/MJCF, 在 UnitPort 之外解决。"
    mitigation: "RobotAssetNode 的错误信息要明确指引用户去哪里转换 (链接到
                 Isaac Lab urdf importer 文档 + mujoco compile 命令)"

  - id: ppo_path_regression
    severity: high
    detail: "改 unitree_gym_env / il_train_launcher 都极易回归 PPO 路线"
    mitigation: "每个 phase exit_criteria 必须包含旧 PPO 路径回归测试"

  - id: motion_preview_3d_complexity
    severity: medium
    detail: "PySide6 的 3D widget 选择 (QtQuick3D vs pyqtgraph vs matplotlib)
             各有坑; 用户明确要求 3D 预览, 不能降级到 2D"
    mitigation: |
      preview_renderer.py 输出 UI 中立 dataclass; 面板层先用 pyqtgraph 出 MVP,
      若性能差则迁移到 QtQuick3D, 后端零改动。

  - id: bijection_drift
    severity: high
    detail: "Canvas 节点参数与 TrainingSpec 字段集容易在迭代中漂移 (有人加了 yaml
             字段忘了加 Canvas 控件), 一旦漂移就违反用户的核心约束 #2"
    mitigation: |
      phase_4 必须有自动化 round-trip 测试: 枚举所有 dataclass 字段, 反射到
      Canvas 节点参数, 找不到对应控件就 fail。CI 强制。

resolved_questions:
  - q: "wildcat 的 URDF 用户已有, 还是需要从原始 CAD/Onshape 导出?"
    a: "用户责任. UnitPort 不参与资产生产, 只接收 + 校验. 见
        custom_robot_assets.scope_boundary."
  - q: "AMP reward 与 task reward 的混合系数走配置 or Canvas 节点参数?"
    a: "Canvas 节点参数 (AMPTrainerNode.amp_reward_coef / task_reward_coef),
        因为 Canvas ⇔ Config 全等原则要求 yaml 字段 ↔ Canvas 控件一一对应。"
  - q: "Canvas 端 motion 预览是否需要?"
    a: "**必须做, 且必须是 3D**. mandatory deliverable in phase_2.
        见 ui_panels.motion_preview_panel."
  - q: "Bound 步态的 reference motion 数据来源?"
    a: "用户从社区资料 (IsaacGymEnvs / AMP_for_hardware datasets 等) 自行获取,
        UnitPort 只做导入后的可视化 + 校验, 不内置任何 mocap 数据。"
  - q: "RslRlVecEnvWrapper 是否要 fork?"
    a: "**子类化 (fork)**. 详细论证见 amp_backend.vec_env_wrapper.rationale.
        核心理由: AMP 的 (s, s') 对在 episode 边界的正确取帧是 wrapper 层职责,
        env 层做不到; 不 fork 会污染 PPO 路径并强制升级单元测试到端到端。"

