# -----------------------------------------------------------------------------
# 1. 顶层架构
# -----------------------------------------------------------------------------
architecture:
  layered_view: |
    ┌──────────────────────────────────────────────────────────────────────┐
    │  Canvas (training workspace)                                         │
    │   ▸ ReferenceMotionNode (extended)                                   │
    │   ▸ RobotAssetNode (new)    ▸ AMPTrainerNode (new)                   │
    └──────────────────────────────────────────────────────────────────────┘
                                   │
                                   ▼ TrainingSpec (compiled)
    ┌──────────────────────────────────────────────────────────────────────┐
    │  src/system/training/                                                │
    │   ┌──────────────┐  ┌────────────────┐  ┌──────────────────────┐     │
    │   │ motion/      │  │ robot_assets/  │  │ amp/                 │     │
    │   │  loader.py   │  │  registry.py   │  │  discriminator.py    │     │
    │   │  retarget.py │  │  converters/   │  │  amp_ppo_runner.py   │     │
    │   └──────────────┘  └────────────────┘  └──────────────────────┘     │
    │            │                │                       │                │
    │            └────────────────┼───────────────────────┘                │
    │                             ▼                                        │
    │              il_train_launcher.py (extended)                         │
    │                             │                                        │
    │                             ▼                                        │
    │              rsl_rl AmpOnPolicyRunner  (vendored, in-tree)           │
    └──────────────────────────────────────────────────────────────────────┘
                                   │
                                   ▼ ONNX + manifest (with amp_obs_spec)
    ┌──────────────────────────────────────────────────────────────────────┐
    │  src/system/runtime/simulation/mujoco/                               │
    │   MjSimEnv ← PolicyRunner ← bundle                                   │
    └──────────────────────────────────────────────────────────────────────┘
  guiding_principles:
    - "现有 PPO 路线零回归：所有改动走新模块/新 algorithm 字符串，旧调用栈不动"
    - "训练侧 (Isaac Lab) 与仿真侧 (MuJoCo) 共享同一 RobotAsset 抽象"
    - "Motion 数据格式可插拔：先支持 amp_legged_gym 的 .txt/.json，
       为 .npy / loco-mujoco / AMASS 留 adapter 接口"
    - "AMP 实现优先 vendor in-tree (rsl_rl 改名命名空间避免与官方 rsl_rl 冲突)"
    - "Canvas 节点不改语义 IR：新增节点遵循现有 sys_nodes 约定"
    - "**Canvas ⇔ Config 全等 (bijection)**: Canvas 是用户唯一交互途径,
       任何能在 TrainingSpec.yaml 里写出来的字段, Canvas 上必须有对应可视控件;
       任何 Canvas 上能配出来的状态, 都能完整序列化进 yaml 并 round-trip 回来。
       新增 yaml 字段 ⇒ 必须同步新增 Canvas 控件, 反之亦然。"
    - "**职责边界 — 只接收, 不生产**: URDF/USD/MJCF/motion 数据等全部由用户从
       社区/工具链自行获得; UnitPort 只做接收 + 合法性校验 + 可视化, 不内置
       任何转换器/生成器/retarget 工具。"

# -----------------------------------------------------------------------------
# 2. Reference Motion 流水线
# -----------------------------------------------------------------------------
reference_motion:
  scope_boundary: |
    UnitPort 不生产 motion 数据, 不做 retarget 工具链。用户从社区
    (IsaacGymEnvs / AMP_for_hardware / loco-mujoco / 自录) 获取 .txt/.json/.npy
    后导入。我们的工作量集中在: 接收 → 校验 → 解析 → **形象可视化**。

  architectural_principle: |
    **Additive extension, not parallel duplication.**
    `ReferenceMotionNode` (training_nodes.py:409) 与 `ReferenceMotionConfig`
    (training_config.py:1144) 已是项目内承载 reference motion 的唯一规范点。
    本蓝图 **扩展** 这两个对象, 不新建 sibling 节点 / sibling dataclass:
      - 同一个 Canvas 节点同时服务 PPO+tracking 路线 (旧) 与 AMP 路线 (新)
      - 同一个 dataclass 的旧 7 字段保持不变, 新增字段一律 Optional 默认 None
      - consumer_mode 字段决定下游怎么消费 (tracking / amp / both)
      - AMP 路线下额外的 motion 库代码住 src/system/training/motion/, 但
        入口仍是 ReferenceMotionConfig — 不引入第二个 spec 类型

  goals:
    - "复用并扩展 ReferenceMotionNode 同时支持 tracking 与 AMP 两种消费方式"
    - "为 AMP 提供 (s, s') transition pairs"
    - "为 PPO+tracking 路线零回归 (旧 .npy + tracking_weight 链路不变)"
    - "Canvas 端可视化选源 (motion library + 用户上传)"
    - "**3D 可视化预览 (mandatory)**: 用户导入 motion 后, 必须能在
       ReferenceMotionNode 配套面板看到一个形象的回放 — 知道自己载入的是什么。"

  formats:
    primary:
      - id: amp_legged_gym
        description: "IsaacGymEnvs / legged_gym AMP_for_hardware 的 motion .txt/.json"
        layout: "root_pos(3) + root_rot(4) + joint_pos(N) + foot_pos(3*F) +
                 lin_vel(3) + ang_vel(3) + joint_vel(N) + foot_vel(3*F)"
        reference_impl: custom_mods/archives/AMP_for_hardware/rsl_rl/rsl_rl/datasets/motion_loader.py
        why_first: "复刻案例直接用这个; 字段顺序固定; 已有现成 loader 可 vendor"
      - id: unitport_npy
        description: "现有 motion_library.py 管理的 .npy (joint_pos 时序)"
        why: "已存在; 用于 PPO+tracking 路线 (无 AMP)"
    deferred:
      - id: amass_smpl
        why: "需 retarget 管线; 留 adapter 接口"
      - id: loco_mujoco
        why: "已有 bridge 但 schema 与 amp_legged_gym 不同"
      - id: phc_npz
        why: "humanoid 走 PHC, 本期专注四足"

  extensions_to_existing_code:
    note: "本节列出的是对 *现有* 文件/类的扩展, 不是新建并行体系。"

    reference_motion_node_changes:
      file: src/system/nodes/sys_nodes/training_nodes.py
      target: "class ReferenceMotionNode (L409)"
      additive_params:
        - name: format_id
          type: enum [unitport_npy, amp_legged_gym]
          default: unitport_npy
          why: "区分旧 .npy (tracking 用) 与新 amp_legged_gym .txt/.json (AMP 用)"
        - name: consumer_mode
          type: enum [tracking, amp, both]
          default: tracking
          why: |
            决定下游消费方式:
              tracking: 走 unitree_gym_env._init_reference_motion (旧路径, 零回归)
              amp:      走 amp/data_provider 提供 (s, s') 对给 discriminator
              both:     两条路同时启用 (tracking reward + AMP reward 加权)
        - name: amp_obs_fields
          type: csv_string
          default: ""
          why: "consumer_mode != tracking 时, 选哪些字段进 discriminator obs;
                空字符串 = 用 format 默认全集"
      execute_method_changes: |
        execute() 返回的 reference_motion_config dict 增加上述 3 个 key,
        并复用 ReferenceMotionConfig.from_node_dict 解析。
      backward_compat: |
        旧画布: 三个新参数缺省值即旧行为, 序列化后 yaml 多 3 个 key 但旧 trainer
        读取时通过 .get() 默认拿到 tracking 模式, 完全兼容。

    reference_motion_config_changes:
      file: src/system/training/training_config.py
      target: "@dataclass ReferenceMotionConfig (L1144)"
      additive_fields:
        - "format_id: str = 'unitport_npy'"
        - "consumer_mode: str = 'tracking'"
        - "amp_obs_fields: tuple[str, ...] = ()"
        # amp_reward_coef was originally planned here but centralized to
        # AMPConfig (training_config.py:1582) to avoid a confusing duplicate
        # knob. The authoritative value lives on the trainer node, not the
        # motion node.
      method_changes:
        - "from_node_dict() 增加上述 3 个 key 的 parsing (带默认值)"
        - "to_dict() 增加上述 3 个 key 的输出"
        - "新增 needs_amp_pipeline() -> bool: return consumer_mode in {'amp','both'}"
      backward_compat: "旧 yaml round-trip 不变, 新字段在 .to_dict() 输出时若为
                        默认值不影响 dict equality 测试 (额外 key 但旧消费者忽略)"

  new_modules:
    note: "下列新模块都是 AMP 路径专属基础设施, 由扩展后的 ReferenceMotionConfig
           在 needs_amp_pipeline()=True 时按需启用。"
    - path: src/system/training/motion/__init__.py
      role: "namespace"
    - path: src/system/training/motion/loader.py
      role: |
        统一 MotionLoader 抽象 + AMPLegGymLoader / NpyLoader 实现。
        必须暴露:
          load(path) -> MotionClip
          MotionClip.sample_transitions(n, dt) -> (obs_t, obs_t+1)
          MotionClip.observation_dim
          MotionClip.frame_at(t) -> dict[joint_pos, joint_vel, root_pose, ...]
      lift_from: custom_mods/archives/AMP_for_hardware/rsl_rl/rsl_rl/datasets/motion_loader.py
    - path: src/system/training/motion/clip.py
      role: "MotionClip dataclass + interpolation + slicing"
    - path: src/system/training/motion/validator.py
      role: |
        合法性校验. 加载后必须通过:
          - 文件存在 + 格式匹配 format_id
          - dof 数与 RobotAsset.dof_count 一致
          - joint_names (若 motion 携带元数据) 与 RobotAsset.joint_names 一致
          - frame_dt > 0 且帧数 >= 最小阈值
          - 数值检查 (无 NaN/Inf, root quat 单位化误差 < 1e-3)
        失败则抛 MotionValidationError, 上层 (Canvas / launcher) 展示给用户。
        显式不做 retarget — 不匹配直接拒绝。
    - path: src/system/training/motion/preview_renderer.py
      role: |
        生成 MotionPreviewBundle 给 UI 层消费 (UI 自己渲染):
          - frames: List[FramePose] (root xyz + quat + joint_pos)
          - fps: float
          - duration_s: float
          - skeleton_topology: parent_indices (从 RobotAsset 取)
          - foot_contacts: Optional[List[bool[F]]]
        backend-only: 不依赖 PySide6, 纯数据。
        **同时服务 tracking 与 AMP 两条路线** (不分 format_id, 都走这套预览)。

  data_flow: |
    Canvas ReferenceMotionNode (extended)
        │ params: motion_file/source + format_id + consumer_mode + amp_obs_fields
        ▼
    ReferenceMotionConfig (extended dataclass)
        │ (序列化进 TrainingSpec.yaml — round-trip 与旧版兼容)
        ▼
    ┌────────────────────── consumer_mode 分支 ──────────────────────┐
    │                                                                  │
    ├─ consumer_mode in {tracking, both}:                              │
    │     unitree_gym_env._init_reference_motion(cfg)  [现有, 不动]    │
    │     → tracking reward + reference obs 注入                       │
    │                                                                  │
    └─ consumer_mode in {amp, both}:                                   │
          motion/loader.py:get_loader(format_id).load(file)            │
          → MotionClip                                                  │
          → motion/validator.py 校验 (vs RobotAsset)                    │
          → amp/data_provider.py:build_amp_data(env, clip)              │
          → AmpOnPolicyRunner.amp_data                                  │

  verify:
    - "src/system/training/motion/loader.py 存在且暴露 MotionClip + AMPLegGymLoader"
    - "src/system/training/motion/validator.py 存在并能拒绝 dof 不匹配的 motion"
    - "src/system/training/motion/preview_renderer.py 产出可被 UI 层消费的
       MotionPreviewBundle (不依赖 PySide6)"
    - "**不存在** 任何 src/system/training/motion/spec.py 的
       MotionDatasetSpec 类 (反向断言: 只能扩展 ReferenceMotionConfig)"
    - "**不存在** 任何 MotionSourceNode 类 (反向断言: 只能扩展 ReferenceMotionNode)"
    - "**不存在** 任何 src/system/training/motion/retarget.py (反向断言: 我们不做 retarget)"
    - "ReferenceMotionConfig 增加 3 个 additive 字段 (format_id, consumer_mode,
       amp_obs_fields) 且默认值即旧行为; amp_reward_coef 集中到 AMPConfig"
    - "ReferenceMotionConfig.needs_amp_pipeline() 在 consumer_mode='amp' 时返回 True"
    - "ReferenceMotionNode.parameters 字典出现 3 个新 key + execute() 输出包含它们"
    - "Round-trip 测试: 旧画布 (无新字段) 序列化→反序列化→Canvas 形态完全相同"
    - "Round-trip 测试: 新画布 (consumer_mode='amp') 序列化→反序列化→Canvas
       形态完全相同 (含新字段)"
    - "可加载 custom_mods/archives/AMP_for_hardware/datasets/mocap_motions/*.txt
       并 sample_transitions(1024, dt=0.02) 不报错 (单元测试)"
    - "PPO+tracking 旧路径 (consumer_mode='tracking') 行为完全不变 (端到端回归)"

# -----------------------------------------------------------------------------
# 3. 完全自定义机器人资产接入
# -----------------------------------------------------------------------------
custom_robot_assets:
  scope_boundary: |
    UnitPort **不内置任何资产转换器** (no urdf→usd, no urdf→mjcf, no usd→mjcf)。
    用户负责自行用 isaaclab urdf importer / mujoco compile / Onshape 等工具准备
    好所需格式的文件然后导入。我们的工作量集中在: 接收 → 解析元数据 → 校验
    合法性 → 注册到 registry → 给训练/仿真侧提供统一 metadata 视图。

    后果: 用户可能需要为同一个 wildcat 同时提供一个 .usd (训练侧) 和一个
    .xml/MJCF (sim2sim 侧)。我们通过 RobotAsset.usd_path / mjcf_path 两个槽位
    显式承认这一点, 并校验两边 joint_names 一致 (用户责任, 但我们检测得到)。

  goals:
    - "接收任意用户提供的 URDF / USD / MJCF 文件"
    - "解析其 joint_names / dof_count / foot_links / default_joint_pos 等元数据"
    - "校验合法性 (文件可加载, dof 数自洽)"
    - "训练侧 (Isaac Lab) 与仿真侧 (MuJoCo) 通过 RobotAsset 拿到同一份 metadata"
    - "joint_names / dof_order 唯一真相源 → sim2sim 不漂移"
    - "若同一 asset 同时有 usd 和 mjcf, 校验两边 joint 顺序一致"

  abstraction:
    name: RobotAsset
    location: src/system/training/robot_assets/registry.py
    schema:
      - asset_id: str                # "wildcat", "go2", ... (用户起的 slug)
      - family: str                  # quadruped | biped | wheeled | manipulator
      - usd_path: Optional[Path]     # 用户提供 (训练侧需要)
      - mjcf_path: Optional[Path]    # 用户提供 (sim2sim 侧需要)
      - urdf_path: Optional[Path]    # 可选, 元信息源
      - joint_names: List[str]       # canonical order, 解析自上述文件之一
      - dof_count: int
      - foot_link_names: List[str]
      - default_joint_pos: Dict[str, float]
      - base_link: str
      - mass: float
      - source_meta: Dict[str, Any]  # 哪个文件被作为 metadata 解析源
    invariants:
      - "至少存在 usd_path 或 mjcf_path 之一 (否则训练 + sim2sim 都没法跑)"
      - "若两者并存, joint_names 必须完全一致 (顺序敏感)"

  parsers:
    location: src/system/training/robot_assets/parsers/
    new_modules:
      - path: src/system/training/robot_assets/parsers/urdf_parser.py
        role: "纯 Python 解析 URDF (xml) → joint_names / link tree / default_pos.
               可用 urdfpy 或自写 ElementTree (避免拉重依赖)"
      - path: src/system/training/robot_assets/parsers/mjcf_parser.py
        role: "用 mujoco.MjModel.from_xml_path() 加载 → 抽 joint_names + dof"
      - path: src/system/training/robot_assets/parsers/usd_parser.py
        role: "用 pxr/Usd 抽 joint_names; 仅在 isaac venv 内可用 (lazy import)"
    note: "都是只读 parser, 不修改任何文件; 全部 read-only"

  validator:
    location: src/system/training/robot_assets/validator.py
    checks:
      - "至少一个文件路径存在 + 可被对应 parser 加载"
      - "dof_count > 0 且自洽"
      - "若 usd + mjcf 都存在: parse 两边的 joint_names → 列表完全相等
         (顺序 + 大小写敏感); 不等则抛 RobotAssetMismatch + diff 报告"
      - "若用户在 RobotAssetNode 里手填了 joint_names, 必须与 parser 出的一致"
      - "foot_link_names 在 link 树里全部存在"
    failure_mode: "RobotAssetValidationError, 包含人类可读的 diff;
                   Canvas 端展示给用户, launcher 端拒绝启动"

  registry_api:
    file: src/system/training/robot_assets/registry.py
    functions:
      - "register_asset(spec: RobotAsset) -> None  # 校验后注册"
      - "get_asset(asset_id: str) -> RobotAsset"
      - "list_assets(family: Optional[str]) -> List[RobotAsset]"
      - "resolve_for_training(asset_id) -> Path  # 返回 usd_path, 缺失则报错"
      - "resolve_for_mujoco(asset_id) -> Path    # 返回 mjcf_path, 缺失则报错"

  integration_points:
    training_side:
      - file: src/system/training/il_train_launcher.py
        change: |
          读取 TrainingSpec.robot_asset_id → registry.resolve_for_training()
          → 写入 env_cfg.scene.robot.spawn.usd_path。
          若 resolve 失败 → 立即 abort + 提示"该 asset 缺少 usd_path,
          请在 RobotAssetNode 上传 .usd 文件"。
      - file: src/system/training/training_config.py
        change: "RobotSpec 增加 asset_id 字段 (与现有 mjcf_path 字段并存,
                 mjcf_path 退化为旧路径兼容用)"
    sim_side:
      - file: src/system/runtime/simulation/mujoco/mj_actor.py
        change: |
          MjActor.from_asset(asset_id) — 内部走 registry.resolve_for_mujoco()。
          保留 from_menagerie / from_path (向后兼容)。
      - file: src/system/policy/policy_runner.py
        change: "manifest 加载时通过 asset_id 解析 mjcf, 不再依赖硬编码 menagerie key"

  wildcat_seed:
    description: "驱动用例样例 (用户提供的真实 wildcat 文件)"
    user_provides:
      - "projects/wildcat_amp/resources/robots/wildcat/wildcat.usd"
      - "projects/wildcat_amp/resources/robots/wildcat/wildcat.xml  (MJCF)"
      - "projects/wildcat_amp/resources/robots/wildcat/meshes/*"
    we_generate: "无 (零转换)"

  verify:
    - "src/system/training/robot_assets/registry.py 存在 + RobotAsset dataclass"
    - "src/system/training/robot_assets/parsers/{urdf,mjcf,usd}_parser.py 三件套
       存在且仅做读取, 不写任何文件"
    - "src/system/training/robot_assets/validator.py 在 dof 不匹配 / joint 顺序
       不一致时抛 RobotAssetValidationError 含 diff"
    - "register_asset() 对一个合法 (urdf+usd+mjcf 同骨架) 资产成功注册"
    - "register_asset() 对一个 usd/mjcf joint 顺序不同的资产失败 + 错误信息可读"
    - "MjActor.from_asset('wildcat') 可在 MjSimEnv 内 reset/step 不崩"
    - "il_train_launcher 走 asset_id 路径时 Isaac Lab 场景内出现该机器人"
    - "registry 里**不存在**任何 ensure_converted / convert_* 方法 (反向校验)"
    - "向后兼容: 旧的 from_menagerie('go2') 仍能工作"

# -----------------------------------------------------------------------------
# 4. AMP 训练后端
# -----------------------------------------------------------------------------
amp_backend:
  goals:
    - "在 il_train_launcher 内可选 algorithm='AMP_PPO'"
    - "复用 vendored AMP_for_hardware 的算法实现"
    - "discriminator / replay buffer / amp_normalizer 全链路接通"
    - "训练产物兼容现有 bundle_exporter (只导 actor, 不导 disc)"

  vendoring_strategy:
    decision: in_tree_namespace
    rationale: |
      custom_mods/archives/AMP_for_hardware/rsl_rl 与官方 rsl_rl-lib 包名冲突。
      解决方案：把它移植进 src/system/training/amp/ 并改命名空间为
      `unitport.amp_rl`，独立 import 路径，杜绝两个 rsl_rl 共存的混乱。
    target_layout:
      - src/system/training/amp/__init__.py
      - src/system/training/amp/algorithms/amp_ppo.py            # from amp_ppo.py
      - src/system/training/amp/algorithms/discriminator.py      # from amp_discriminator.py
      - src/system/training/amp/runners/amp_on_policy_runner.py  # 改 import
      - src/system/training/amp/storage/replay_buffer.py
      - src/system/training/amp/utils/normalizer.py
      - src/system/training/amp/data_provider.py                 # 桥接 motion/loader.py
      - src/system/training/amp/joint_alignment.py               # 见 amp_obs_dim_drift mitigation
      - src/system/training/amp/wrappers/amp_rsl_rl_vec_env_wrapper.py # 见 §4.vec_env_wrapper
    licensing:
      note: "AMP_for_hardware 是 BSD-3 (NVIDIA + ETH Zurich), 保留 SPDX 头"

  data_provider:
    file: src/system/training/amp/data_provider.py
    role: |
      把 motion/loader.py:MotionClip 适配成 AmpOnPolicyRunner 期望的 amp_data 接口:
        - .observation_dim
        - .feed_forward_generator(num_mini_batches, mini_batch_size)
        - .preload_transitions(num)
      隔离层意义：换 motion 格式不需要改 AMP runner。

  joint_alignment:
    file: src/system/training/amp/joint_alignment.py
    role: |
      启动时对齐两个 amp_obs 字段顺序源:
        (a) unitree_gym_env.get_amp_observations() 实际返回的字段顺序
        (b) MotionClip.observation 期望的字段顺序 (来自 motion file 元数据)
      不一致 → 直接 abort 训练 + 把 diff 报告 dump 到 run.yaml.
      这是 amp_obs_dim_drift 风险的硬性 mitigation: 不允许 disc 学到字段错位的
      transition (那种错误训练不会报错, 只会悄悄崩坏).
    api:
      - "verify_alignment(env_fields: list[str], clip_fields: list[str]) -> None
         (raises AmpObsAlignmentError on mismatch)"
      - "dump_alignment_report(run_dir: Path, env_fields, clip_fields) -> None"
    called_from:
      - "il_train_launcher.py 的 AMP 分支, 在 build_amp_data 之后 / runner 创建之前"
    why_in_amp_pkg_not_motion_pkg: |
      它桥接 env (unitree_gym_env) 与 amp pipeline (data_provider), 两端都是
      AMP 路径专属; 放 motion/ 会让 motion 模块反向依赖 unitree_gym_env.

  env_side_changes:
    file: src/system/training/unitree_gym_env.py
    additions:
      - "属性 self.num_amp_obs (= MotionClip.observation_dim)"
      - "方法 get_amp_observations() -> Tensor[N_envs, num_amp_obs]
         字段顺序必须与 MotionClip 一致 (joint_alignment.py 保证)"
      - "属性 self.include_history_steps (AmpOnPolicyRunner 需要)"
      - "reset_idx 时记录 amp_obs 用于 (s, s') 对"
    backward_compat: "AMP 字段在 algorithm != 'AMP_PPO' 时全部 lazy / no-op"

  vec_env_wrapper:
    decision: subclass
    file: src/system/training/amp/wrappers/amp_rsl_rl_vec_env_wrapper.py
    rationale: |
      AMPOnPolicyRunner 比 OnPolicyRunner 多需要 3 件事:
        (1) env.num_amp_obs 属性
        (2) env.get_amp_observations() 方法
        (3) episode 边界上 (s, s') 对的 amp_obs 缓存 — s_{t+1} 必须是
            **reset 之前** 的最后一帧, 否则 disc 学到的是 "动态 → 静止站立"
            的伪造 transition, 训练会悄悄崩坏 (无报错)。
      第 (3) 条是 wrapper 层职责 (它能看到 step() 返回的 dones), 不是 env
      职责。如果不 fork:
        - 必须把边界缓存逻辑硬塞进 unitree_gym_env, 污染 PPO 路径
        - AmpOnPolicyRunner 必须改去戳 env.unwrapped, 与 Isaac Lab 升级耦合
        - 单元测试必须升级到端到端 (不能 mock inner env)
    design:
      replacement_semantics: |
        **替换, 不是嵌套.** AmpRslRlVecEnvWrapper 在 launcher 内**取代** (而非
        包裹) 原本的 RslRlVecEnvWrapper 调用. 即:
          AMP 路径:  env = AmpRslRlVecEnvWrapper(gym_env, ...)
          PPO 路径:  env = RslRlVecEnvWrapper(gym_env, ...)
        二者**互斥**. 永远不会出现 AmpRslRlVecEnvWrapper(RslRlVecEnvWrapper(...))
        这种双层结构 — 那既会破坏 inner env 的 attribute 透传, 又会让
        episode 边界帧捕获逻辑看到错误的 step 返回值.
      base_class: "isaaclab_rl.rsl_rl.RslRlVecEnvWrapper"
      added_properties:
        - "num_amp_obs: int  (= MotionClip.observation_dim)"
        - "include_history_steps: Optional[int]"
      added_methods:
        - "get_amp_observations() -> Tensor[N, num_amp_obs]"
      overridden_methods:
        - method: "step(actions)"
          behavior: |
            1) cached_amp_obs = inner.get_amp_observations()  # pre-step
            2) result = super().step(actions)
            3) post_amp_obs = inner.get_amp_observations()    # post-step
            4) for env_i where dones[i]: 真实的 s_{t+1} = cached_amp_obs[i]
                                          (因为 inner 已经 auto-reset 过)
            5) 把 (cached_amp_obs, fixed_post_amp_obs) 对挂到 infos['amp']
      size_estimate: "80–120 行"
    no_regression: "PPO 路径继续使用原版 RslRlVecEnvWrapper, AMP 路径才走子类"

  launcher_integration:
    file: src/system/training/il_train_launcher.py
    insertion_point: "L327-342 — 现 RslRlVecEnvWrapper(L329) + OnPolicyRunner(L342) 创建块.
                      把这两行分别替换为下面 if/else 的对应分支."
    pseudocode: |
      if agent_cfg.algorithm_class_name == "AMPPPO":
          from src.system.training.amp.wrappers.amp_rsl_rl_vec_env_wrapper \
              import AmpRslRlVecEnvWrapper
          from src.system.training.amp.runners.amp_on_policy_runner \
              import AMPOnPolicyRunner
          from src.system.training.amp.data_provider import build_amp_data

          env = AmpRslRlVecEnvWrapper(env, clip_actions=clip_actions)
          amp_data = build_amp_data(env, motion_spec=spec.motion_dataset, device=device)
          runner = AMPOnPolicyRunner(env, agent_dict, amp_data=amp_data,
                                     log_dir=log_dir, device=device)
          print("[UnitPort] AMP_PPO runner active", flush=True)
      else:
          env = RslRlVecEnvWrapper(env, clip_actions=clip_actions)
          runner = OnPolicyRunner(env, agent_dict, log_dir=log_dir, device=device)
    no_regression:
      - "agent_cfg.algorithm_class_name 缺省仍为 PPO → 走原 OnPolicyRunner 分支"
      - "TRAINING_LOOP_DONE sentinel 与 watchdog 复用"
      - "checkpoint resume 路径不变 (AmpOnPolicyRunner.load 也接受 .pt)"

  config_surface:
    file: src/system/training/training_config.py
    changes:
      - "AlgorithmConfig.algorithm 枚举增加 'AMP_PPO'"
      - "新 dataclass AMPConfig: { disc_hidden_dims, disc_grad_penalty,
         amp_replay_buffer_size, num_preload_transitions, amp_reward_coef,
         task_reward_coef, disc_lr }"
      - "TrainingJobSpec.amp: Optional[AMPConfig]"
      - "**不新建** TrainingJobSpec.motion_dataset 字段 — motion 数据通过
         扩展后的 ReferenceMotionConfig (consumer_mode='amp') 进入 spec"
      - "ReferenceMotionConfig 扩展见 §3.extensions_to_existing_code"

  bundle_export:
    file: src/system/training/bundle_exporter.py
    changes:
      - "manifest.yaml 增加 amp_obs_spec (字段名 + dim) — 供分析工具使用; 推理不需要"
      - "导出仍只是 actor.onnx; discriminator 不进 bundle"

  verify:
    - "src/system/training/amp/ 目录存在, 含 amp_ppo.py + discriminator.py + runner"
    - "import src.system.training.amp.runners.amp_on_policy_runner 不报错
       (与官方 rsl_rl 共存无 import collision)"
    - "TrainingSpec.algorithm='AMP_PPO' 时 launcher 走 AMP 分支
       (打印一行 [UnitPort] AMP_PPO runner active)"
    - "用 wildcat asset + 一段 mocap_motions/*.txt 跑 50 iter 不崩 + tensorboard
       同时出现 disc_loss / amp_reward / task_reward 三条曲线"
    - "导出 bundle 后 PolicyRunner.load() 在 MjSimEnv 内 rollout 一集成功"
    - "PPO 分支回归: 旧的 GO2 walk 训练命令零改动跑通"
    - "src/system/training/amp/joint_alignment.py 存在 + 在字段错位时
       抛 AmpObsAlignmentError 并 dump 到 run.yaml (单元测试)"
    - "il_train_launcher.py AMP 分支真正调用 verify_alignment(); 故意构造
       一组错位字段时 launcher 在 AppLauncher 启动后立即 abort 而不是
       继续训练"

# -----------------------------------------------------------------------------
# 5. Canvas 节点扩展 (UI 层)
# -----------------------------------------------------------------------------
canvas_nodes:
  bijection_contract: |
    Canvas ⇔ TrainingSpec.yaml 必须双向全等 (本蓝图新增/修改的字段范围内):
      - 本蓝图新增/修改的每个 dataclass 字段, Canvas 上有对应控件 (反之亦然)
      - Canvas → 编译 → yaml → 反编译 → Canvas, 节点状态完全相同
      - 用户唯一交互途径就是 Canvas, 不允许 "只能在 yaml 里手填" 的新字段
    作用域说明: TrainingJobSpec 已有 24+ 字段, 历史上未必全部双向打通; 本蓝图
    bijection_check 只对**本蓝图新增/修改的字段**强制. 全 spec round-trip 列为
    单独的 follow-up 工程, 不在本蓝图范围内.

  registration_convention:
    where_training_nodes_live: src/system/nodes/sys_nodes/training_nodes.py
    how_training_nodes_register: |
      Training 节点 **不进** 全局 REGISTERED_NODES (该注册表在
      src/system/nodes/__init__.py:74). 它们由 Training Ground canvas 在运行时
      自行注册. 见 src/system/nodes/__init__.py:52-56 的明确注释:
        "Training nodes (EnvConfigNode / TrainConfigNode / TrainNode) are
         intentionally NOT imported here. They live in nodes.sys_nodes
         .training_nodes and are registered only by the Training Ground canvas."
      **本蓝图所有新/扩节点 (RobotAssetNode, AMPTrainerNode, 扩展后的
      ReferenceMotionNode) 一律遵守此约定**, 加进 training_nodes.py, 由
      Training Ground canvas 注册. 不向全局注册表登记.

  goals:
    - "扩展 ReferenceMotionNode 同时承载 tracking + AMP 两种消费方式"
    - "新增 RobotAssetNode 承接用户提供的 usd/mjcf 文件"
    - "新增 AMPTrainerNode 作为 PPOTrainer 的 sibling"
    - "保持 training_nodes.py 注册约定"
    - "实现 Canvas ⇔ Config 全等 (新字段范围内)"
    - "为 motion 数据提供形象化 3D 预览面板 (mandatory)"

  extended_node:
    id: ReferenceMotionNode
    status: extend_existing  # NOT new — already at training_nodes.py:409
    file: src/system/nodes/sys_nodes/training_nodes.py
    line: 409
    additive_params:
      - "format_id: enum [unitport_npy, amp_legged_gym] (default unitport_npy)"
      - "consumer_mode: enum [tracking, amp, both] (default tracking)"
      - "amp_obs_fields: csv_string (default '')"
      - "amp_reward_coef: float (default 0.0)"
    ui_companion:
      panel: MotionPreviewPanel  (见 §5.1)
      trigger: "用户在节点上选了 motion_file 并通过 validator 后,
                节点上的 'Preview' 按钮可激活面板"
      coverage: "**对所有 format_id 都生效** — tracking 路线和 AMP 路线
                 共用同一个 3D 预览面板"
    bijection_check: |
      上述 4 个 param ↔ ReferenceMotionConfig 同名字段一一对应; round-trip 测试
      在 phase_2 强制. 旧 7 个字段 (motion_file, motion_source, phase_mode,
      tracking_weight, tracking_sigma, motion_fps, random_start_phase) 与
      其 BC 子集 (10 个 imitation/bc 参数) 不在本蓝图 bijection 范围内 (历史
      字段, follow-up 处理).
    backward_compat: |
      旧画布 (.canvas.json 内无新 key) 加载时, get_parameter() 走默认值,
      consumer_mode='tracking' → 行为完全等价于 v0.2.0 之前.

  new_nodes:
    - id: RobotAssetNode
      status: new
      file: src/system/nodes/sys_nodes/training_nodes.py  (追加到该文件, 不另起文件)
      registers_via: "Training Ground canvas (运行时, 不进全局 REGISTERED_NODES)"
      outputs:
        - robot_asset: RobotAsset
      params:
        - asset_id: str
        - usd_path: file_picker (.usd, optional)
        - mjcf_path: file_picker (.xml, optional)
        - urdf_path: file_picker (.urdf, optional, 仅作 metadata 源)
        - family: enum [quadruped, biped, wheeled, manipulator]
      ui_companion:
        panel: RobotAssetInspectorPanel  (见 §5.1)
      validation: "实时调用 robot_assets/validator.py, 错误以红色 badge
                   显示在节点头部"
      note: "**不**含 auto_convert / convert_to_* 字段; UnitPort 不做格式转换"
      bijection_check: "上述每个 param ↔ RobotAsset dataclass 字段一一对应"

    - id: AMPTrainerNode
      status: new
      file: src/system/nodes/sys_nodes/training_nodes.py  (追加到该文件, 不另起文件)
      registers_via: "Training Ground canvas (运行时, 不进全局 REGISTERED_NODES)"
      sibling_of:
        class: ILPPOTrainerNode
        line: 1986
        rationale: |
          ILPPOTrainerNode 是 layered training 的终端 compile 节点; AMPTrainerNode
          与之共享 99% 的 input/output/parameter 面, 唯一新增 1 个必填 input
          (reference_motion_config) 与一组 AMP 专属超参. 不另起 input/output 模型,
          避免 sibling 关系名不副实.
      role: |
        ILPPOTrainerNode 的 sibling. 与之**完全相同**的输入面 + 完全相同的旧
        参数集 + 额外 7 个 AMP 超参 + 1 个必填新 input (reference_motion_config).
        编译产物里 algorithm 字段 = 'AMP_PPO', 由 il_train_launcher 据此分支到
        AmpOnPolicyRunner.

      # ── inputs: 完全复用 ILPPOTrainerNode 的 6 个 + 1 个新增 ──
      inputs:
        # --- 6 个复用 (与 ILPPOTrainerNode.__init__ 字典精确同名) ---
        - policy                   # 来自 ILPolicyNode
        - total_reward             # 来自 RewardAssemblerNode
        - termination_config       # 来自 TerminationConditionNode
        - domain_rand_config       # 来自 DomainRandNode
        - obs_vector               # 来自 ObsAssemblerNode (其中已含 robot_asset 流)
        - base_asset               # 来自 BaseAssetNode (optional, checkpoint resume)
        # --- 1 个新增 (AMP 必填) ---
        - reference_motion_config  # 来自 ReferenceMotionNode (must consumer_mode ∈ {amp, both})
      input_validation:
        required: [policy, total_reward, termination_config, domain_rand_config,
                   obs_vector, reference_motion_config]
        optional: [base_asset]
      not_a_direct_input:
        - "robot_asset → 经由 EnvAssemblerNode → obs_vector / 场景, 不直连 trainer"
        - "scenario   → 同样经 EnvAssemblerNode 流入, 不直连 trainer"
        - "(纠正 v0.3.0 草案中把 robot_asset/scenario 当作 trainer 直接 input 的张冠李戴)"

      outputs:  # 与 ILPPOTrainerNode 同构
        - trained_policy
        - training_metrics

      # ── parameters: 复用 ILPPOTrainerNode 全部 17 个 hyperparam + AMP 专属 7 个 ──
      params_reused_from_ilppo:
        # 不在此重列, 见 training_nodes.py:2008-2026
        note: "task_name / max_iterations / num_steps_per_env / num_learning_epochs /
               num_minibatches / learning_rate / discount_factor / gae_lambda /
               clip_param / entropy_coef / value_loss_coef / max_grad_norm /
               schedule / desired_kl / save_interval / seed / headless"
      params_amp_specific:
        - amp_reward_coef: float
        - task_reward_coef: float
        - disc_hidden_dims: list[int]
        - disc_grad_penalty: float
        - amp_replay_buffer_size: int
        - num_preload_transitions: int
        - disc_lr: float

      bijection_check: |
        7 个 AMP 专属 param ↔ AMPConfig dataclass 字段一一对应.
        17 个复用 param 不在本蓝图 bijection 范围内 (它们是 ILPPOTrainerNode
        的历史字段, 由 ILPPOTrainerNode 与现有 algorithm_config dataclass
        的对接已经存在; 本蓝图不重新校验那部分).

      compatibility_checker_rule: |
        AMPTrainerNode 编译时必须满足:
          - inputs.reference_motion_config 不为空
          - 上游 ReferenceMotionNode.consumer_mode ∈ {'amp', 'both'}
        否则抛 CompileError 并在 Canvas 节点头部显示红色 badge.

  routing:
    - "TrainingSpecCompiler (training/training_spec.py) 识别新输入字段并填入
       TrainingJobSpec.{robot_asset_id, reference_motion_config(扩展), amp}"
    - "compatibility_checker.py 增加规则: AMPTrainerNode 必须连
       ReferenceMotionNode 且后者 consumer_mode in {amp, both}"
    - "**反向编译**: 给定一个 TrainingSpec.yaml (本蓝图字段范围), 必须能在
       Canvas 上还原出节点的全部新增参数 (round-trip 测试)"

  verify:
    - "ReferenceMotionNode 在 training_nodes.py 内, 且新增 4 个 param 出现"
    - "RobotAssetNode + AMPTrainerNode 都加在 training_nodes.py 内"
    - "**反向断言**: src/system/nodes/__init__.py 的 REGISTERED_NODES 中
       **不应** 出现这三个节点 (训练节点不进全局注册表)"
    - "Training Ground canvas 运行时可解析并实例化这三个节点"
    - "Canvas 内可拖出节点 + 连线 + 编译出非空 TrainingJobSpec"
    - "compatibility_checker 在 AMPTrainerNode 未连 consumer_mode='amp' 的
       ReferenceMotionNode 时报错而非崩溃"
    - "ReferenceMotionNode 通过 validator 后可触发 MotionPreviewPanel 弹出
       (任一 format_id, 任一 consumer_mode)"
    - "RobotAssetNode 同时上传 usd + mjcf 且 joint 顺序不一致时, 节点头部
       显示红色错误 badge 且阻止编译"
    - "Round-trip 测试 (本蓝图字段范围): 新字段从 yaml 反编译回 Canvas 后
       节点参数完全相同"
    - "AMPTrainerNode 的 7 个 param 与 AMPConfig dataclass 字段一一对应 (无字段
       只能在 yaml 手填)"

