# =============================================================================
# AMP_design.yaml — UnitPort Isaac Training Ground 扩展蓝图
# -----------------------------------------------------------------------------
# 目标：在不破坏现有 PPO 路线 (rsl_rl OnPolicyRunner) 的前提下，叠加
#       Reference Motion 流水线 + 完全自定义机器人资产接入 + AMP 训练后端，
#       形成：reference_motion → custom URDF/USD/MJCF → PPO+AMP → ONNX bundle
#       → MuJoCo sim2sim 的端到端能力。
#
# 范围：仅设计蓝图（接口契约 / 文件落点 / 数据流 / 验收准则）。不写代码。
# 审阅方式：用户将派 sub-agent 对照本文件逐项核查，每节都给出
#          `verify:` 列表，sub-agent 据此判断是否落实。
#
# 维护：当任一条目实现完成，把 status: planned → in_progress → done。
# 全局阻塞项：amp_backend.runner_integration —— 缺它则整套不可用。
# =============================================================================

meta:
  name: AMP Training Ground Blueprint
  version: 0.4.0
  date: 2026-04-08
  changelog:
    - "0.1.0 (2026-04-08): initial draft"
    - "0.2.0 (2026-04-08): user decisions on 5 open questions integrated:
       (1) asset converters dropped — receive + validate only;
       (2) canvas/config bijection promoted to first-class principle;
       (3) motion 3D preview becomes mandatory deliverable;
       (4) reference motion data is user-supplied from community;
            our scope = visualization-after-import only;
       (5) RslRlVecEnvWrapper: subclass (fork) — rationale recorded in §4.1"
    - "0.3.0 (2026-04-08): sub-agent review fixes:
       (a) Reframe motion pipeline as **additive extension** to the existing
           ReferenceMotionNode (training_nodes.py:409) and ReferenceMotionConfig
           (training_config.py:1144) — DROP the parallel MotionSourceNode plan;
       (b) Fix node registration verify items: training nodes live in
           training_nodes.py and are registered by Training Ground canvas at
           runtime, NOT in src/system/nodes/__init__.py global REGISTERED_NODES;
       (c) Fix sb3_trainer.py baseline line range (L920 is `def train()`, not
           a PPO/SAC class definition);
       (d) Drop end-line numbers from grep ground-truth (off-by-one noise);
       (e) Pin usd_parser risk to path (b): mjcf is primary metadata source in
           main venv, usd-only assets degrade to warn + launcher-side check;
       (f) Bijection round-trip scope = new fields only; full-spec round-trip
           is a separate follow-up;
       (g) Clarify AmpRslRlVecEnvWrapper REPLACES (not nests) the standard wrapper."
    - "0.3.1 (2026-04-08): second sub-agent review fixes:
       (h) AMPTrainerNode inputs corrected — chosen **Path A**: it is a true
           sibling of ILPPOTrainerNode (training_nodes.py:1986), reusing the
           6 layered inputs (policy / total_reward / termination_config /
           domain_rand_config / obs_vector / base_asset) + ONE additional
           required input `reference_motion_config`. The previous draft
           wrongly listed robot_asset/scenario as direct trainer inputs;
