# Guiding principle: these layers only *call* the registry/validator APIs
# built in phase_1. They never bypass or duplicate the validation path —
# auto-discovery and manual RobotAssetNode editing **must** go through the
# same register_asset() entry point so that a single correction path fixes
# both workflows.

todo:

  # ---------------------------------------------------------------------------
  # Phase_5: Auto-discovery layer
  # ---------------------------------------------------------------------------
  auto_discovery:
    goal: |
      Walk a downloaded community package tree and auto-register any robot
      assets + reference motions it contains, without the user having to
      manually create a RobotAssetNode / ReferenceMotionNode per file.

    scope_boundary: |
      Discovery is **purely a scanner + batch importer** on top of the
      phase_1 registry. It:
        - does NOT convert files (still receive+validate only)
        - does NOT mutate the downloaded tree
        - does NOT do retargeting
        - routes every candidate through register_asset() / the existing
          validator — no side paths
      Anything the phase_1 validator rejects shows up in the UI's "manual
      fix needed" queue; the user then opens a RobotAssetNode and edits
      the same registry entry by hand.

    new_module:
      path: src/system/training/robot_assets/discovery.py
      api:
        - "walk_and_register(root: Path) -> DiscoveryReport
           Recursively scans *root*. Groups files by parent directory.
           Produces one RobotAsset candidate per directory that contains
           a .usd / .xml / .urdf. Passes each to register_asset(). Collects
           motion files (.txt/.json) separately for phase_2 motion registry
           (future extension point)."
        - "DiscoveryReport dataclass:
             registered: List[str]         # asset_ids successfully registered
             rejected: List[RejectedCandidate]  # with validator error + path
             motion_candidates: List[Path] # .txt/.json files found for review
             unknown_files: List[Path]     # .py/.md/.urdf alone/etc ignored"
        - "RejectedCandidate: { dir: Path, candidate: RobotAsset, error: str }"

    candidate_grouping_rules:
      - "Any directory containing at least one of (*.urdf, *.xml, *.usd)
         is a candidate. The directory name becomes the default asset_id."
      - "Sibling files in the same directory get merged into one candidate:
         {foo.urdf, foo.xml, foo.usd} → asset_id='foo', all three paths set."
      - "If multiple .urdf files live in the same directory, create one
         candidate per unique stem."
      - "meshes/ subdirectories are followed by the urdf/mjcf parsers
         implicitly; discovery doesn't touch them."
      - "datasets/**/*.txt and datasets/**/*.json are collected into
         motion_candidates (phase_2 motion registry will consume)."
      - "Any file matching .git/**, __pycache__, .venv, node_modules is
         skipped by a hardcoded denylist."

    family_inference:
      - "Default: 'quadruped' (most community repos are legged)."
      - "Override: look for family hints in parent directory names
         ('biped', 'humanoid', 'h1', 'g1' → biped; 'wheeled' → wheeled)."
      - "A mistake here is low-cost: the user fixes it in the node."

    ui_integration:
      - "New Training Ground toolbar button 'Scan downloads' (or similar)
         that invokes discovery.walk_and_register(custom_mods/archives/)."
      - "DiscoveryReport flows into a modal: N registered, M rejected,
         K motion candidates. Rejected rows double-click → open matching
         RobotAssetNode with the candidate pre-filled for manual fix."
      - "Re-running discovery is idempotent (register_asset overwrites
         the same asset_id, which is already documented in registry.py)."

    provenance_metadata:
      file: "<archive_root>/.unitport/source.json"
      schema: |
        {
          "source": "github" | "huggingface" | "local",
          "url": "https://github.com/.../...",
          "commit": "sha hash" (optional),
          "downloaded_at": ISO8601,
          "unitport_version": "0.x.y"
        }
      role: |
        Written by the upper-layer fetch step (see below). Discovery reads
        it to tag every registered asset's source_meta['origin'] field so
        the UI can show 'from AMP_for_hardware @ abc1234'.
      policy: |
        Missing source.json is fine — discovery just tags origin='local'.
        We do NOT write source.json when the user drops files in manually.

    exit_criteria:
      - "walk_and_register(custom_mods/archives/AMP_for_hardware) registers
         at least 1 a1 asset + discovers mocap_motions/*.txt as candidates"
      - "Rejected candidates appear in DiscoveryReport with a validator
         error message that the user can read without looking at logs"
      - "Unit tests cover: happy path, duplicate asset_id, empty tree,
         tree with only junk files, tree with mismatched dual-source asset"

  # ---------------------------------------------------------------------------
  # Phase_6: Upper-layer fetch (git / HuggingFace)
  # ---------------------------------------------------------------------------
  upper_layer_fetch:
    goal: |
      A thin wrapper that lets the user paste a git URL / HF repo id in
      the frontend and get a clean archive in custom_mods/archives/ + an
      auto-discovery pass, without leaving the Training Ground.

    depends_on: [auto_discovery]

    new_module:
      path: src/system/training/robot_assets/fetch.py
      api:
        - "fetch_git(url: str, name: Optional[str] = None) -> Path
           Runs `git clone --depth 1 <url> custom_mods/archives/<name>/`.
           Writes .unitport/source.json with url + commit hash. Returns
           the absolute archive path."
        - "fetch_hf(repo_id: str, *, hf_type='dataset'|'model') -> Path
           Uses huggingface_hub.snapshot_download into
           custom_mods/archives/<repo_id_slug>/. Writes .unitport/source.json."
        - "fetch_and_discover(url_or_id, source_type) -> DiscoveryReport
           Combines fetch + discovery.walk_and_register + report."

    safety:
      - "Depth-1 clone only (no full history by default — saves disk)."
      - "Archive name collision: refuse by default, require --force flag
         or UI confirmation."
      - "Sandbox: never clone outside custom_mods/archives/. Path escape
         attempts (../, absolute names) are rejected at the API layer."
      - "No execution of anything inside the archive (no setup.py, no
         pip install). We only read files."
      - "SSL / HTTPS required; no ssh:// URLs for now (keeps credential
         handling simple)."

    ui_integration:
      - "New dialog: 'Add community package' → text field for URL, radio
         for git vs HF, Fetch button. Shows progress + final
         DiscoveryReport in the same modal."
      - "The button lives next to the existing 'Scan downloads' button
         from phase_5 — fetching is just 'scan after cloning'."

    frontend_contract: |
      The frontend NEVER touches git / HTTP directly. It calls into
      fetch.py which is the only code path that can write into
      custom_mods/archives/. This keeps the sandboxing single-point.

    out_of_scope_for_now:
      - "Credentials manager (GitHub tokens, HF login)"
      - "Partial/resumable downloads"
      - "Dependency resolution between archives (e.g. repo A needs
         meshes from repo B)"
      - "Background updating / re-fetching"

    exit_criteria:
      - "fetch_git('https://github.com/.../AMP_for_hardware') produces
         custom_mods/archives/AMP_for_hardware/ with .unitport/source.json
         and triggers a clean DiscoveryReport"
      - "Path escape test: fetch_git with name='../../etc' is rejected"
      - "Depth-1 clone verified via .git/config alternates"

  # ---------------------------------------------------------------------------
  # Cross-cutting: discovery ↔ manual-edit round-trip invariant
  # ---------------------------------------------------------------------------
  invariant:
    name: single_registry_source
    rule: |
      Both discovery and manual RobotAssetNode editing produce RobotAsset
      entries via the **exact same** registry.register_asset() call. There
      is NO "discovered_assets" vs "manual_assets" distinction anywhere.
      When the user fixes a discovery rejection by hand, the fix updates
      the same registry entry.
    enforcement:
      - "A single reverse-assertion test in phase_5 that registry.py only
         exposes one register_asset function and that discovery.py calls
         it directly (no helper wrappers)."
      - "DiscoveryReport.rejected entries carry enough info (dir, paths,
         partial RobotAsset, validator error) that the UI can pop up a
         pre-filled RobotAssetNode — user clicks Save → same register_asset
         runs — no code duplication."

