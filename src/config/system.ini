[Resources]
; Empty value -> use built-in default (PROJECT_ROOT-rooted, except user_config_dir).
; Relative value -> resolved under PROJECT_ROOT. Absolute value -> used as-is.
;
; All keys here support user.ini overlay (user.ini wins) EXCEPT user_config_dir:
; user.ini lives under USER_CONFIG_DIR, so user.ini cannot determine its own
; location (chicken-egg). user_config_dir is read from this file ONLY.
assets_dir =
logs_dir =
registers_dir =
runtime_dir =
custom_mods_dir =
; factory_build_dir: locally-built factory data (e.g. USD body dumps from a
; local IsaacLab installation). Shared across all users on this install,
; survives reset.bat. Empty -> PROJECT_ROOT/runtime/factory_build. Distinct
; from user_config_dir (per-user state) and runtime_dir (Python cache).
factory_build_dir =
user_config_dir =
projects_dir =

[auth]
; Supabase project credentials. anon_key is publishable; redirect_url is the
; OS-registered scheme used when the OAuth loopback server is unavailable.
supabase_url = https://api.unitport.ai
supabase_anon_key = sb_publishable_tuE2SzzvvUsFs3ufK28VkQ_a-gNMnYy
redirect_url = unitport://auth-callback

[CloudSync]
; Cloud-sync target Supabase Storage bucket. RLS policies enforce
; ``(storage.foldername(name))[1] = auth.uid()::text`` so per-user data is
; namespaced by Supabase UUID on the cloud side, matching the local UUID-
; keyed USER_CONFIG_DIR layout.
bucket = user-data
; Hard cap matching the bucket's server-side limit. Files larger than this
; are skipped client-side with a warning rather than triggering a 413.
single_file_size_limit_mb = 50
; Per-engine cap on training-run directories retained on the cloud. Older
; runs stay local but are pruned from any push plan (transform.runs_topn).
runs_keep_top_n = 3
; Passive self-check on app start: lists the user's cloud prefix and reports
; counts + quota. No transfer is performed (status refresh, NOT a data sync);
; Push/Pull are user-initiated via the UserPanel. There is intentionally NO
; shutdown self-check — quit does zero cloud work so it stays instant; status
; is refreshed at startup and after every persist-time auto-sync push.
self_check_on_startup = true
; Persist-time auto-sync debounce window, in milliseconds. When the Auto-sync
; toggle (user.ini[Cloud] auto_push) is on and the user is signed in, every
; write of an include-set file under USER_CONFIG_DIR schedules a cloud push;
; a burst of writes within this window collapses into a single upload. Cloud
; auto-sync follows the user's saves (there is NO batch upload on exit). Floor
; is clamped to 200 ms so a mis-set 0 cannot busy-loop the push queue.
auto_sync_debounce_ms = 1500


[Canvas]
; Reward × MotionPhase isolation feature (see plan custom-mods-canvas-issaclab-go2-ppo).
; phase_lanes_enabled : master switch for the Phase Lane visualization in
;   the Rewards node. false ⇒ flat tile layout (legacy behavior), Coverage
;   Badge hidden, compile-time block disabled. Default true.
; reward_coverage_mode : how strict the Coverage check is at compile time.
;   strict ⇒ red coverage opens a modal block dialog before training starts.
;   warn   ⇒ red coverage logs a warning; training proceeds.
;   off    ⇒ no check at all.
phase_lanes_enabled = true
reward_coverage_mode = off

