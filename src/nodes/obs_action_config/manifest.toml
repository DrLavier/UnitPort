schema = "unitport.node/v1"
id = "obs_action_config"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "A"
display_name_key = "node.obs_action_config.display"
description_key = "node.obs_action_config.desc"
icon = "obs_action_config.svg"

# Obs / Action — 观测与动作空间配置（含 contract preset）.

[[outputs]]
name = "obs_action_config"
type = "obs_action_config"

# NOTE (2026-06): ``contract_preset`` and ``obs_components`` were removed.
# Observations are driven SOLELY by the il_observation node's ``obs_terms``
# (= obs_action.il_terms) through obs_term_engine, for BOTH backends — these
# two were never consumed by SB3 or IsaacLab (a stale obs picker + preset
# table). ``action_scale`` was also removed: it is an actor property owned by
# the actor_setting node (the single authority both backends read); the
# duplicate here silently diverged (default 1.0 vs actor's 0.25).

[[parameters]]
key = "obs_clip_range"
type = "float"
default = 100.0
widget = "range"
description = "观测裁剪范围"
meta = { min = 0.0, max = 100.0, step = 0.5 }

[[parameters]]
key = "frame_stack"
type = "int"
default = 1
widget = "index"
description = "帧栈深度"
meta = { min = 1, max = 32 }

[[parameters]]
key = "action_type"
type = "enum"
default = "joint_position"
choices = ["joint_position", "torque"]
description = "动作类型"

[[parameters]]
key = "action_clip"
type = "float"
default = 1.0
widget = "range"
description = "动作裁剪上限"
meta = { min = 0.0, max = 10.0, step = 0.05 }
