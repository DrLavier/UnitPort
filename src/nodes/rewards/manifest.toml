schema = "unitport.node/v1"
id = "rewards"
kind = "CUSTOM"
version = "2.0.0"
category = "config"
layer = "A"
display_name_key = "node.rewards.display"
description_key = "node.rewards.desc"
icon = "rewards.svg"

# Rewards — 奖励配置节点 / Per-item reward configuration.
#
# v2 颗粒度：rewards 不再是 trainer 上游，而是 training_motion 中每个 item 的
# 旁路供应方 —— 输出 ``reward_pipe`` (multi) 连到 training_motion 节点上每个
# enabled item 行内独立的 reward 输入端口。可以在 canvas 上放多个 rewards
# 节点供应不同 item。
#
# Backend 由所在 canvas 自动派生（registers/backends.py），本节点不暴露
# backend ParamSpec：
#   sb3       canvas → REWARD_REGISTRY
#   isaac_lab canvas → IL_REWARD_REGISTRY

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

[[outputs]]
name = "reward_pipe"
type = "reward_pipe"
multi = true
description = "Per-item reward feed (connect to training_motion item rows)"

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------

# 缺口③ — joint-partition pager. Sits ABOVE reward_terms; a multi-select of
# the robot family's pd_groups + a table (Global + per-partition pages with
# reward counts). Clicking a page switches reward_terms to that page. Stores no
# data of its own — pages live in reward_terms keys; active page in
# reward_active_page. Pure view/controller widget.
[[parameters]]
key = "reward_joint_pages"
type = "string"
default = ""
widget = "reward_joint_pager"
description = "关节分区页 / Joint-partition reward pages (Global + pd_group pages)"
meta = { partition_source = "pd_groups", terms_key = "reward_terms", active_page_key = "reward_active_page" }

# UI cursor: which reward_terms page the editor below shows. Compiler ignores it.
[[parameters]]
key = "reward_active_page"
type = "string"
default = "__global__"
description = "当前编辑的关节页 / Active reward page (UI cursor)"

[[parameters]]
key = "reward_terms"
type = "json"
default = "{}"
widget = "registry_module"
description = "奖励项字典 / Reward terms (paged by joint partition)"
meta = { registry_id = "rewards", registry_id_il = "il_rewards", backend_keyed = true, pin_on_collapse = true, paged = true, active_page_key = "reward_active_page" }

[[parameters]]
key = "std"
type = "float"
default = 0.25
widget = "range"
description = "全局 std (奖励项 default σ)"
meta = { min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "threshold"
type = "float"
default = 0.5
widget = "range"
description = "全局 threshold"
meta = { min = 0.0, max = 1.0, step = 0.01 }
