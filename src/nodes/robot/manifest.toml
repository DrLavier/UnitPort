schema = "unitport.node/v1"
id = "robot"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "A"
display_name_key = "node.robot.display"
description_key = "node.robot.desc"
icon = "robot.svg"

# Robot — 机器人资产 / Robot asset (information display).
#
# Single source of truth for robot IDENTITY and STRUCTURAL metadata. The
# canvas display panels (asset files / joint & IR list / init pose default /
# actuator defaults) are read-only projections of the selected asset_id.
# Settings live on the paired ActorSettingNode; do not add editable fields
# here beyond `asset_id`, `active_override`, and `body_mapping`
# (auto-resolved). The base_height reward target lives on the Rewards node's
# per-item "Value" chip; spawn height = actor init_pos_z / asset nominal.

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

[[outputs]]
name = "robot_pipe"
type = "robot_pipe"
description = "Bundles asset identity, joint_names, body list, and default metadata"

# ---------------------------------------------------------------------------
# Parameters (full DEMO alignment)
# ---------------------------------------------------------------------------

[[parameters]]
key = "asset_id"
type = "string"
default = "unitree_go2"
widget = "picker_robot_asset"
description = "资产 id / Robot asset id (registry-backed picker)"
meta = { registry_id = "robots", pin_on_collapse = true }

[[parameters]]
key = "active_override"
type = "enum"
default = "auto"
choices = ["auto", "mjcf", "usd", "urdf"]
widget = "active_file_table"
description = "格式覆盖 / Active asset format override (3-row file-type table)"

[[parameters]]
key = "body_mapping"
type = "json"
default = ""
widget = "body_mapping_table"
description = "body→IR-role 映射 (auto-resolved) / Body→IR-role mapping"

[[parameters]]
key = "_mjcf_base_offset_status"
type = "string"
default = ""
widget = "mjcf_offset_badge"
description = "MJCF 落地偏移 / MJCF base spawn-Z offset (auto-calibrated; read-only status)"

# ---------------------------------------------------------------------------
# PD parameterization (sim2sim_mass-matrix-adaptive) — merged from
# ex-ActuatorPDNode. Specifies (omega_n, zeta) per joint group; engine-
# specific kp/kd are derived at runtime via application.physics.{mujoco,physx}_gain_solver.
# All values are OPTIONAL — empty `pd_groups` ({}) means "use the family
# default (omega_n, zeta) for every group" from
# registers/data/pd_groups_defaults.json. spec_compiler merges
# family defaults + canvas overrides into the canonical PDParam.
# ---------------------------------------------------------------------------

[[parameters]]
key = "pd_param_mode"
type = "enum"
default = "natural_freq"
choices = ["natural_freq"]
description = "PD 参数化模式 / PD parameterization mode"

[[parameters]]
key = "pd_groups"
type = "json"
default = "{}"
widget = "pd_param_table"
description = "按关节组覆盖 (omega_n, zeta)；空 {} 表示全部使用 family 默认 / Per-group (omega_n, zeta) overrides; empty {} = family defaults for all groups"
meta = { language = "json" }

# NOTE: effort_limit / velocity_limit are NOT defined here. The single
# canvas source of truth for both is the ActorSetting node (§4 Actuator
# overrides). They were de-duplicated off this node (ex pd_effort_limit /
# pd_velocity_limit) so MuJoCo (bundle_exporter) and IsaacLab
# (env_cfg_compiler) read the same value. RobotNode keeps only the
# (omega_n, zeta) parameterization and the PD-process toggles below.

[[parameters]]
key = "pd_resolve_at_reset"
type = "bool"
default = true
description = "每次 reset 重算 PD (跟随 DR 的 ωn/ζ/质量扰动) / Re-solve gains after each DR reset"

[[parameters]]
key = "pd_calibration_blocking"
type = "bool"
default = true
description = "校准失败阻断 bundle 导出 / Block bundle export on calibration fail"

[[parameters]]
key = "pd_skip_calibration"
type = "bool"
default = false
description = "跳过 step-response 校准 (跳过会被记入 provenance) / Skip calibration"
