schema = "unitport.node/v1"
id = "vis_check"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "D"
display_name_key = "node.vis_check.display"
description_key = "node.vis_check.desc"
icon = "vis_check.svg"

# Vis Check — 训练里程碑可视化（弹 MuJoCo viewer）.

[[inputs]]
name = "vis_check"
type = "vis_check"
optional = true

[[parameters]]
key = "trigger_mode"
type = "enum"
default = "step_interval"
choices = ["step_interval", "episode_split"]
description = "触发模式 / Trigger mode"

[[parameters]]
key = "vis_start_step"
type = "int"
default = 50000
widget = "index"
description = "起始步 (step_interval mode)"
meta = { min = 0, max = 100000000 }

[[parameters]]
key = "vis_interval_steps"
type = "int"
default = 50000
widget = "index"
description = "间隔步 (step_interval mode)"
meta = { min = 1, max = 100000000 }

[[parameters]]
key = "num_vis_checks"
type = "int"
default = 5
widget = "index"
description = "总检查次数 (episode_split mode)"
meta = { min = 1, max = 1000 }

[[parameters]]
key = "vis_episodes"
type = "int"
default = 3
widget = "index"
description = "每次回合数"
meta = { min = 1, max = 100 }

[[parameters]]
key = "deterministic"
type = "bool"
default = true
description = "确定性策略 / Deterministic actions"
