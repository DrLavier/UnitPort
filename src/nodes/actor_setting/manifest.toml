schema = "unitport.node/v1"
id = "actor_setting"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "A"
display_name_key = "node.actor_setting.display"
description_key = "node.actor_setting.desc"
icon = "actor_setting.svg"

# Actor Setting — Actor 初始姿态 / 接触传感器 / 执行器 / Actor init pose,
# contact sensors, actuator overrides, action space, action-scale curriculum.
#
# Partner of RobotNode. Owns EVERY user-editable knob that attaches to the
# robot. Reads ``robot_pipe`` (structural body list for the contact picker)
# and re-emits a superset ``actor_pipe`` consumed by rewards / domain rand /
# observation / action / velocity command nodes.
#
# ``joint_init`` is optional: when connected, the upstream JointInitNode
# provides the authoritative per-joint angle dict; otherwise the local
# ``init_joint_angles`` parameter is used.

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------

[[inputs]]
name = "robot_pipe"
type = "robot_pipe"
description = "Structural body list / joint names / PD parameterization from the paired Robot node"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

[[outputs]]
name = "actor_pipe"
type = "actor_pipe"
description = "Superset Actor block consumed by rewards / DR / obs / action / cmd"

# ---------------------------------------------------------------------------
# Parameters — §1 Init pose
# ---------------------------------------------------------------------------

# Family-filtered preset dropdown. Choosing a preset cascades the selected
# pose into the sibling fields init_pos_{x,y,z} + init_joint_angles via
# RegistryPresetPickerRow.on_select. The bound param itself only carries
# the preset name; spec_compiler does not consume this field (the
# joint_init / init_pose snapshot comes from the sibling fields).
[[parameters]]
key = "init_pose_preset"
type = "string"
default = ""
widget = "registry_preset_picker"
description = "起始姿态 preset / Init pose preset (family-filtered)"
meta = { registry = "init_pose_presets", family_source = "robot_pipe" }

[[parameters]]
key = "init_pos_x"
type = "float"
default = 0.0
widget = "range"
description = "初始 X 位置 / Init world-frame X (m)"
meta = { min = -100.0, max = 100.0, step = 0.01 }

[[parameters]]
key = "init_pos_y"
type = "float"
default = 0.0
widget = "range"
description = "初始 Y 位置 / Init world-frame Y (m)"
meta = { min = -100.0, max = 100.0, step = 0.01 }

[[parameters]]
key = "init_pos_z"
type = "float"
default = 0.4
widget = "range"
description = "初始 Z 位置 / Init world-frame Z (m)"
meta = { min = 0.0, max = 2.4, step = 0.01 }

# ---------------------------------------------------------------------------
# Parameters — §2 Init joint angles (single source of truth)
# ---------------------------------------------------------------------------

[[parameters]]
key = "init_joint_angles"
type = "json"
default = "{}"
widget = "joint_pose_table"
description = "初始关节角 (IR-role → radians) / Init joint angles (slider editor)"
meta = { language = "json" }

# ---------------------------------------------------------------------------
# Parameters — §2.5 Episode init-pose strategy (migrated from init_pose node)
# ---------------------------------------------------------------------------

[[parameters]]
key = "init_pose_mode"
type = "enum"
default = "default"
choices = ["default", "reference_frame_0", "keyframe", "custom"]
description = "起始姿态模式 / Episode init-pose mode"

[[parameters]]
key = "init_pose_noise_scale"
type = "float"
default = 0.05
widget = "range"
description = "起始姿态噪声 (rad) / Init-pose joint noise"
meta = { min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "init_pose_keyframe_name"
type = "string"
default = "home"
description = "MJCF keyframe 名 (mode=keyframe) [SB3/MJCF only: IL 路径用 USD 无 keyframe 概念；IL canvas 上 mode=keyframe 退化为 default]"
meta = { conditional_on = { key = "init_pose_mode", op = "==", value = "keyframe" } }

[[parameters]]
key = "init_pose_rsi_prob"
type = "float"
default = 1.0
widget = "range"
description = "RSI 概率 (mode=reference_frame_0) / RSI probability"
meta = { min = 0.0, max = 1.0, step = 0.01, conditional_on = { key = "init_pose_mode", op = "==", value = "reference_frame_0" } }

[[parameters]]
key = "init_pose_rsi_sample_mode"
type = "enum"
default = "frame_0"
choices = ["frame_0", "uniform_phase"]
description = "RSI 采样模式 / RSI sample mode"
meta = { conditional_on = { key = "init_pose_mode", op = "==", value = "reference_frame_0" } }

# ---------------------------------------------------------------------------
# Parameters — §3 Contact sensors
# ---------------------------------------------------------------------------

[[parameters]]
key = "contact_body_names"
type = "json"
default = "[]"
widget = "ir_body_picker"
description = "接触 body IR 角色 / Contact-sensor body IR roles (IsaacLab ContactSensor; multi-select from upstream Robot Node). SB3 has no ContactSensor (its illegal_contact reads data.contact with a hardcoded family body set — identical to IsaacLab by design), so this is hidden on SB3 canvases."
meta = { source = "body", default_select_all = true, language = "json", conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

# Contact history + air-time tracking are IsaacLab ContactSensor features; the
# SB3 MuJoCo env reads neither (its illegal_contact uses data.contact directly,
# no history; no air-time terms). Hidden on SB3 canvases.
[[parameters]]
key = "contact_history_length"
type = "int"
default = 3
widget = "index"
description = "接触历史长度 / Contact history length (IsaacLab only)"
meta = { min = 1, max = 64, conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "contact_track_air_time"
type = "bool"
default = true
description = "追踪 air time / Track air time (IsaacLab only)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

# ---------------------------------------------------------------------------
# Parameters — §4 Actuator overrides: MOVED to RobotNode (2026-05).
# stiffness/damping were dropped (gains derive from (omega_n, zeta) in both
# engines, §10); effort_limit/velocity_limit moved to the RobotNode (hidden
# params, edited via its pd_param_table panel). Existing canvases are migrated
# by bootstrap/migrate_canvas_actuator_to_robot.py.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Parameters — §5 Action space (absorbed from IL Action Config)
# ---------------------------------------------------------------------------

[[parameters]]
key = "action_joint_names_expr"
type = "json"
default = '[".*"]'
widget = "ir_joint_picker"
description = "动作关节 IR 角色 / Action joint IR roles (multi-select; \"All\" = every joint via the .* regex; pick specific IR roles to actuate only those)"
meta = { source = "joint", default_select_all = true, language = "json" }

[[parameters]]
key = "action_scale"
type = "float"
default = 0.25
widget = "range"
description = "动作缩放 / Action scale"
meta = { min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "action_use_default_offset"
type = "bool"
default = true
description = "动作使用默认 offset / Use default joint offset"

# ---------------------------------------------------------------------------
# Parameters — §6 Action-scale curriculum
# ---------------------------------------------------------------------------

# action_scale curriculum is IsaacLab-only (consumed by env_cfg_compiler's
# CurriculumCfg; the SB3 trainer has no action-scale curriculum callback).
# Hidden on SB3 canvases so the user isn't offered a knob SB3 silently drops.
[[parameters]]
key = "action_scale_curriculum_enabled"
type = "bool"
default = false
description = "启用 action_scale 课程 / Enable action-scale curriculum (IsaacLab only)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "action_scale_curriculum_start"
type = "float"
default = 0.15
widget = "range"
description = "课程起始 scale / Curriculum start scale"
meta = { min = 0.0, max = 5.0, step = 0.01, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "action_scale_curriculum_enabled", op = "==", value = true } ] }

[[parameters]]
key = "action_scale_curriculum_end"
type = "float"
default = 0.25
widget = "range"
description = "课程结束 scale / Curriculum end scale"
meta = { min = 0.0, max = 5.0, step = 0.01, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "action_scale_curriculum_enabled", op = "==", value = true } ] }

[[parameters]]
key = "action_scale_curriculum_ramp_iters"
type = "int"
default = 300
widget = "index"
description = "课程 ramp 迭代数 / Curriculum ramp iterations"
meta = { min = 1, max = 1000000, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "action_scale_curriculum_enabled", op = "==", value = true } ] }

# ---------------------------------------------------------------------------
# Parameters — §7 Review Pose 按钮 (full-width teal button)
# ---------------------------------------------------------------------------
# 触发后用当前 init_pos_{x,y,z} + init_joint_angles 构造 InitPoseOverride，
# 走上游 RobotNode 解析到的 SKU 提交对应引擎的 ReviewTask（纯加载 USD/MJCF
# + 注入 pose）。引擎下拉决定走 MuJoCo (RobotReviewTask) 还是 IsaacSim
# (IsaacSimPoseReviewTask)。

[[parameters]]
key = "review_pose_engine"
type = "enum"
default = "mujoco"
choices = ["mujoco", "isaac_sim"]
description = "Review 引擎 / Review engine (mujoco = MJCF, isaac_sim = USD)"

[[parameters]]
key = "_review_pose"
type = "string"
default = ""
widget = "actor_review_pose_button"
description = "▶ Review init pose in selected engine"
meta = { full_width_widget = true }
