schema = "unitport.node/v1"
id = "actor_setting"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "A"
display_name_key = "node.actor_setting.display"
description_key = "node.actor_setting.desc"
icon = "actor_setting.svg"

# Actor Setting — Actor 初始姿态 / 接触传感器 / 执行器 / Actor init pose,
# contact sensors, actuator overrides, action space, action-scale curriculum.
#
# Partner of RobotNode. Owns EVERY user-editable knob that attaches to the
# robot. Reads ``robot_pipe`` (structural body list for the contact picker)
# and re-emits a superset ``actor_pipe`` consumed by rewards / domain rand /
# observation / action / velocity command nodes.
#
# ``joint_init`` is optional: when connected, the upstream JointInitNode
# provides the authoritative per-joint angle dict; otherwise the local
# ``init_joint_angles`` parameter is used.

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------

[[inputs]]
name = "robot_pipe"
type = "robot_pipe"
description = "Structural body list / joint names from the paired Robot node"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

[[outputs]]
name = "actor_pipe"
type = "actor_pipe"
description = "Superset Actor block consumed by rewards / DR / obs / action / cmd"

# ---------------------------------------------------------------------------
# Parameters — §1 Init pose
# ---------------------------------------------------------------------------

[[parameters]]
key = "init_pos_x"
type = "float"
default = 0.0
widget = "range"
description = "初始 X 位置 / Init world-frame X (m)"
meta = { min = -100.0, max = 100.0, step = 0.01 }

[[parameters]]
key = "init_pos_y"
type = "float"
default = 0.0
widget = "range"
description = "初始 Y 位置 / Init world-frame Y (m)"
meta = { min = -100.0, max = 100.0, step = 0.01 }

[[parameters]]
key = "init_pos_z"
type = "float"
default = 0.4
widget = "range"
description = "初始 Z 位置 / Init world-frame Z (m)"
meta = { min = 0.0, max = 5.0, step = 0.01 }

# ---------------------------------------------------------------------------
# Parameters — §2 Init joint angles (single source of truth)
# ---------------------------------------------------------------------------

[[parameters]]
key = "init_joint_angles"
type = "json"
default = "{}"
widget = "joint_pose_table"
description = "初始关节角 (IR-role → radians) / Init joint angles (slider editor)"
meta = { language = "json" }

# ---------------------------------------------------------------------------
# Parameters — §2.5 Episode init-pose strategy (migrated from init_pose node)
# ---------------------------------------------------------------------------

[[parameters]]
key = "init_pose_mode"
type = "enum"
default = "default"
choices = ["default", "reference_frame_0", "keyframe", "custom"]
description = "起始姿态模式 / Episode init-pose mode"

[[parameters]]
key = "init_pose_noise_scale"
type = "float"
default = 0.05
widget = "range"
description = "起始姿态噪声 (rad) / Init-pose joint noise"
meta = { min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "init_pose_keyframe_name"
type = "string"
default = "home"
description = "MJCF keyframe 名 (mode=keyframe) [SB3/MJCF only: IL 路径用 USD 无 keyframe 概念；IL canvas 上 mode=keyframe 退化为 default]"
meta = { conditional_on = { key = "init_pose_mode", op = "==", value = "keyframe" } }

[[parameters]]
key = "init_pose_rsi_prob"
type = "float"
default = 1.0
widget = "range"
description = "RSI 概率 (mode=reference_frame_0) / RSI probability"
meta = { min = 0.0, max = 1.0, step = 0.01, conditional_on = { key = "init_pose_mode", op = "==", value = "reference_frame_0" } }

[[parameters]]
key = "init_pose_rsi_sample_mode"
type = "enum"
default = "frame_0"
choices = ["frame_0", "uniform_phase"]
description = "RSI 采样模式 / RSI sample mode"
meta = { conditional_on = { key = "init_pose_mode", op = "==", value = "reference_frame_0" } }

# ---------------------------------------------------------------------------
# Parameters — §3 Contact sensors
# ---------------------------------------------------------------------------

[[parameters]]
key = "contact_body_names"
type = "json"
default = "[]"
widget = "code"
description = "接触 body 名 (JSON list) / Contact-sensor body names"
meta = { language = "json" }

[[parameters]]
key = "contact_history_length"
type = "int"
default = 3
widget = "index"
description = "接触历史长度 / Contact history length"
meta = { min = 1, max = 64 }

[[parameters]]
key = "contact_track_air_time"
type = "bool"
default = true
description = "追踪 air time / Track air time"

# ---------------------------------------------------------------------------
# Parameters — §4 Actuator overrides
# ---------------------------------------------------------------------------

[[parameters]]
key = "stiffness"
type = "float"
default = 25.0
widget = "range"
description = "刚度 / Joint stiffness (PD P gain)"
meta = { min = 0.0, max = 200.0, step = 1.0 }

[[parameters]]
key = "damping"
type = "float"
default = 0.5
widget = "range"
description = "阻尼 / Joint damping (PD D gain)"
meta = { min = 0.0, max = 10.0, step = 0.05 }

[[parameters]]
key = "effort_limit"
type = "float"
default = 30.0
widget = "range"
description = "扭矩上限 / Effort (torque) limit"
meta = { min = 0.0, max = 200.0, step = 1.0 }

[[parameters]]
key = "velocity_limit"
type = "float"
default = 30.0
widget = "range"
description = "速度上限 / Joint velocity limit"
meta = { min = 0.0, max = 100.0, step = 0.5 }

# ---------------------------------------------------------------------------
# Parameters — §5 Action space (absorbed from IL Action Config)
# ---------------------------------------------------------------------------

[[parameters]]
key = "action_joint_names_expr"
type = "json"
default = "[]"
widget = "code"
description = "动作关节名表达 (JSON list / regex) / Action joint names expr"
meta = { language = "json" }

[[parameters]]
key = "action_scale"
type = "float"
default = 0.25
widget = "range"
description = "动作缩放 / Action scale"
meta = { min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "action_use_default_offset"
type = "bool"
default = true
description = "动作使用默认 offset / Use default joint offset"

# ---------------------------------------------------------------------------
# Parameters — §6 Action-scale curriculum
# ---------------------------------------------------------------------------

[[parameters]]
key = "action_scale_curriculum_enabled"
type = "bool"
default = false
description = "启用 action_scale 课程 / Enable action-scale curriculum"

[[parameters]]
key = "action_scale_curriculum_start"
type = "float"
default = 0.15
widget = "range"
description = "课程起始 scale / Curriculum start scale"
meta = { min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "action_scale_curriculum_end"
type = "float"
default = 0.25
widget = "range"
description = "课程结束 scale / Curriculum end scale"
meta = { min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "action_scale_curriculum_ramp_iters"
type = "int"
default = 300
widget = "index"
description = "课程 ramp 迭代数 / Curriculum ramp iterations"
meta = { min = 1, max = 1000000 }

# ---------------------------------------------------------------------------
# Parameters — §7 Review Pose 按钮 (full-width teal button)
# ---------------------------------------------------------------------------
# 触发后用当前 init_pos_{x,y,z} + init_joint_angles 构造 InitPoseOverride，
# 走上游 RobotNode 解析到的 SKU 提交 RobotReviewTask（纯加载 MJCF + 注入 pose）。

[[parameters]]
key = "_review_pose"
type = "string"
default = ""
widget = "actor_review_pose_button"
description = "▶ Review init pose in MuJoCo viewer"
meta = { full_width_widget = true }
