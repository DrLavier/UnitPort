schema = "unitport.node/v1"
id = "terminations"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "A"
display_name_key = "node.terminations.display"
description_key = "node.terminations.desc"
icon = "terminations.svg"

# Terminations — 终止条件配置（SB3 / Isaac Lab 共用 registry-backed editor）。
# Backend 由所在 canvas 自动派生，本节点不暴露 backend ParamSpec。

[[outputs]]
name = "termination_config"
type = "termination_config"

[[parameters]]
key = "termination_conditions"
type = "json"
default = "{}"
widget = "registry_module"
description = "终止条件 dict / Termination terms"
meta = { registry_id = "terminations", registry_id_il = "il_terminations", backend_keyed = true }

[[parameters]]
key = "termination_curriculum_enabled"
type = "bool"
default = false
description = "启用 base_height termination curriculum"

[[parameters]]
key = "termination_curriculum_start"
type = "float"
default = 0.18
widget = "range"
description = "curriculum 起始阈值 (m)"
meta = { min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "termination_curriculum_end"
type = "float"
default = 0.22
widget = "range"
description = "curriculum 终止阈值 (m)"
meta = { min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "termination_curriculum_ramp_iters"
type = "int"
default = 500
widget = "index"
description = "curriculum ramp 迭代数"
meta = { min = 1, max = 1000000 }
