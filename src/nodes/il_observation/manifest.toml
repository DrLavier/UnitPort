schema = "unitport.node/v1"
id = "il_observation"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "IL"
display_name_key = "node.il_observation.display"
description_key = "node.il_observation.desc"
icon = "il_observation.svg"

# IL Observation — Isaac Lab 观测项（registry-backed）.

[[inputs]]
name = "actor_pipe"
type = "actor_pipe"
optional = true

[[inputs]]
name = "command_pipe"
type = "command_pipe"
optional = true

[[outputs]]
name = "obs_vector"
type = "obs_vector"

[[parameters]]
key = "obs_terms"
type = "json"
default = "{}"
widget = "registry_module"
description = "观测项 dict / Observation terms (IL registry-backed)"
meta = { registry_id = "il_obs" }

# group_name (asymmetric actor/critic), obs corruption, and the obs-noise
# curriculum are all IsaacLab/rsl_rl-only — the SB3 MuJoCo env reads obs noise
# from domain_rand.obs_noise_std (not these), has no asymmetric-AC critic
# group, and no obs-noise curriculum. Hidden on SB3 canvases (only obs_terms is
# SB3-meaningful). conditional_on backend == isaac_lab.
[[parameters]]
key = "group_name"
type = "enum"
default = "policy"
choices = ["policy", "critic"]
description = "ObsGroup 名 / ObsGroup name. 'policy' = actor input; 'critic' = privileged critic-only group (asymmetric actor-critic). Place a second il_observation node with group_name='critic' carrying privileged terms (e.g. base_lin_vel) to enable asymmetric AC. (IsaacLab only.)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "enable_corruption"
type = "bool"
default = true
description = "启用观测噪声 (IsaacLab only; SB3 uses domain_rand.obs_noise_std)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "corruption_noise_std"
type = "float"
default = 0.05
widget = "range"
description = "噪声标准差"
meta = { min = 0.0, max = 1.0, step = 0.001, conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "obs_noise_curriculum_enabled"
type = "bool"
default = false
description = "启用 obs noise curriculum (IsaacLab only)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "obs_noise_curriculum_start"
type = "float"
default = 0.25
widget = "range"
description = "curriculum 起始倍率"
meta = { min = 0.0, max = 1.0, step = 0.001, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "obs_noise_curriculum_enabled", op = "==", value = true } ] }

[[parameters]]
key = "obs_noise_curriculum_end"
type = "float"
default = 1.0
widget = "range"
description = "curriculum 终止倍率"
meta = { min = 0.0, max = 1.0, step = 0.001, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "obs_noise_curriculum_enabled", op = "==", value = true } ] }

[[parameters]]
key = "obs_noise_curriculum_ramp_iters"
type = "int"
default = 500
widget = "index"
description = "curriculum ramp iter 数"
meta = { min = 1, max = 1000000, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "obs_noise_curriculum_enabled", op = "==", value = true } ] }
