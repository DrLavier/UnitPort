schema = "unitport.node/v1"
id = "il_observation"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "IL"
display_name_key = "node.il_observation.display"
description_key = "node.il_observation.desc"
icon = "il_observation.svg"

# IL Observation — Isaac Lab 观测项（registry-backed）.

[[inputs]]
name = "actor_pipe"
type = "actor_pipe"
optional = true

[[inputs]]
name = "command_pipe"
type = "command_pipe"
optional = true

[[outputs]]
name = "obs_vector"
type = "obs_vector"

[[parameters]]
key = "obs_terms"
type = "json"
default = "{}"
widget = "registry_module"
description = "策略观测项 dict / Policy observation terms (the DEPLOYED obs; IL registry-backed)"
meta = { registry_id = "il_obs" }

# 缺口② — asymmetric actor-critic is now a SINGLE node: this row carries the
# PRIVILEGED terms the value fn (critic) additionally sees beyond the policy
# (e.g. base_lin_vel — sim-only ground truth the deployed policy can't read).
# Non-empty ⇒ compiler emits PolicyCfg + CriticCfg(=obs_terms ∪ these, noiseless).
# Empty ⇒ symmetric (PolicyCfg only). NEVER enters the deploy bundle. Reuses the
# same obs picker (registry_id="il_obs"). IsaacLab/rsl_rl-only (SB3 has no
# asymmetric-AC critic group); hidden on SB3 canvases.
[[parameters]]
key = "critic_privileged_terms"
type = "json"
default = '{"base_lin_vel": 2.0}'
widget = "registry_module"
description = "特权 critic 观测项 / Privileged critic-only obs (asymmetric AC; e.g. base_lin_vel). 空=对称 (critic=policy). IsaacLab only."
meta = { registry_id = "il_obs", conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

# obs corruption + the obs-noise curriculum are IsaacLab/rsl_rl-only — the SB3
# MuJoCo env reads obs noise from domain_rand.obs_noise_std (not these), and has
# no obs-noise curriculum. Hidden on SB3 canvases. conditional_on isaac_lab.
[[parameters]]
key = "enable_corruption"
type = "bool"
default = true
description = "启用观测噪声 (IsaacLab only; SB3 uses domain_rand.obs_noise_std)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "corruption_noise_std"
type = "float"
default = 0.05
widget = "range"
description = "噪声标准差"
meta = { min = 0.0, max = 1.0, step = 0.001, conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "obs_noise_curriculum_enabled"
type = "bool"
default = false
description = "启用 obs noise curriculum (IsaacLab only)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "obs_noise_curriculum_start"
type = "float"
default = 0.25
widget = "range"
description = "curriculum 起始倍率"
meta = { min = 0.0, max = 1.0, step = 0.001, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "obs_noise_curriculum_enabled", op = "==", value = true } ] }

[[parameters]]
key = "obs_noise_curriculum_end"
type = "float"
default = 1.0
widget = "range"
description = "curriculum 终止倍率"
meta = { min = 0.0, max = 1.0, step = 0.001, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "obs_noise_curriculum_enabled", op = "==", value = true } ] }

[[parameters]]
key = "obs_noise_curriculum_ramp_iters"
type = "int"
default = 500
widget = "index"
description = "curriculum ramp iter 数"
meta = { min = 1, max = 1000000, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "obs_noise_curriculum_enabled", op = "==", value = true } ] }
