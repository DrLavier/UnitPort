schema = "unitport.node/v1"
id = "il_observation"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "IL"
display_name_key = "node.il_observation.display"
description_key = "node.il_observation.desc"
icon = "il_observation.svg"

# IL Observation — Isaac Lab 观测项（registry-backed）.

[[inputs]]
name = "actor_pipe"
type = "actor_pipe"
optional = true

[[inputs]]
name = "command_pipe"
type = "command_pipe"
optional = true

[[outputs]]
name = "obs_vector"
type = "obs_vector"

[[parameters]]
key = "obs_terms"
type = "json"
default = "{}"
widget = "registry_module"
description = "观测项 dict / Observation terms (IL registry-backed)"
meta = { registry_id = "il_obs" }

[[parameters]]
key = "group_name"
type = "string"
default = "policy"
description = "ObsGroup 名"

[[parameters]]
key = "enable_corruption"
type = "bool"
default = true
description = "启用观测噪声"

[[parameters]]
key = "corruption_noise_std"
type = "float"
default = 0.05
widget = "range"
description = "噪声标准差"
meta = { min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "obs_noise_curriculum_enabled"
type = "bool"
default = false
description = "启用 obs noise curriculum"

[[parameters]]
key = "obs_noise_curriculum_start"
type = "float"
default = 0.25
widget = "range"
description = "curriculum 起始倍率"
meta = { min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "obs_noise_curriculum_end"
type = "float"
default = 1.0
widget = "range"
description = "curriculum 终止倍率"
meta = { min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "obs_noise_curriculum_ramp_iters"
type = "int"
default = 500
widget = "index"
description = "curriculum ramp iter 数"
meta = { min = 1, max = 1000000 }
