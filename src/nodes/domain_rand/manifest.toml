schema = "unitport.node/v1"
id = "domain_rand"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "A"
display_name_key = "node.domain_rand.display"
description_key = "node.domain_rand.desc"
icon = "domain_rand.svg"

# Domain Rand — 统一域随机化节点 (SB3 + Isaac Lab).
#
# Backend 由所在 canvas 自动派生，本节点不暴露 backend ParamSpec：
#   sb3 canvas:
#     - 暴露 SB3 DR 参数 (mass_range / friction_range / motor / push / schedule)
#     - actor_pipe 端口隐藏
#   isaac_lab canvas:
#     - 暴露 IL DR events (friction / mass / push / init_pose / joint_noise，
#       每组带 mode 切换)
#     - actor_pipe 端口可见
#
# Class-side `normalize_parameters()` 在画布加载后裁掉错误 backend 的 keys，
# 保证「保存的画布 → 加载后的 params → execute 后的 config」一一一对齐。

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------

[[inputs]]
name = "actor_pipe"
type = "actor_pipe"
optional = true
description = "Actor stream (IL only — auto-hidden in SB3 mode)"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

[[outputs]]
name = "domain_rand_config"
type = "domain_rand_config"

# ---------------------------------------------------------------------------
# Parameters — Shared schedule (always visible)
# ---------------------------------------------------------------------------

[[parameters]]
key = "rand_schedule"
type = "enum"
default = "none"
choices = ["none", "linear"]
description = "DR 强度调度 [SB3-only: Isaac Lab Event system 不支持 runtime params mutation；IL 路径下永远满强度]"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" } }

[[parameters]]
key = "rand_schedule_start_step"
type = "int"
default = 0
widget = "index"
description = "DR 激活起始全局步 [SB3-only]"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0, max = 1000000000 }

[[parameters]]
key = "rand_schedule_end_step"
type = "int"
default = 500000
widget = "index"
description = "DR 达到满强度的全局步 [SB3-only]"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0, max = 1000000000 }

# ---------------------------------------------------------------------------
# Parameters — SB3 backend (visible only when backend == "sb3_mujoco")
# ---------------------------------------------------------------------------

[[parameters]]
key = "enabled"
type = "bool"
default = true
description = "[SB3] 启用"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" } }

[[parameters]]
key = "mass_range"
type = "list"
default = "[0.8, 1.2]"
widget = "range_list"
description = "[SB3] 质量缩放范围"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "friction_range"
type = "list"
default = "[0.5, 1.5]"
widget = "range_list"
description = "[SB3] 摩擦缩放范围"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "omega_n_log_uniform"
type = "list"
default = "[0.8, 1.25]"
widget = "range_list"
description = "[SB3] ωn 对数均匀缩放范围 (×nominal) / Natural-frequency DR factor"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.5, max = 2.0, step = 0.01 }

[[parameters]]
key = "zeta_log_uniform"
type = "list"
default = "[0.9, 1.11]"
widget = "range_list"
description = "[SB3] ζ 对数均匀缩放范围 (×nominal) / Damping-ratio DR factor"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.7, max = 1.5, step = 0.01 }

[[parameters]]
key = "obs_noise_std"
type = "float"
default = 0.01
widget = "range"
description = "[SB3] 观测高斯噪声 std"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "push_robot"
type = "bool"
default = false
description = "[SB3] 启用外力推扰"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" } }

[[parameters]]
key = "push_interval_steps"
type = "int"
default = 200
widget = "index"
description = "[SB3] 推扰间隔（步）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 1, max = 1000000 }

[[parameters]]
key = "push_force_range"
type = "list"
default = "[50, 150]"
widget = "range_list"
description = "[SB3] 推扰力范围（N）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.0, max = 1000.0, step = 1.0 }

# P2 — reset-time state randomization (SB3 feature parity with IsaacLab DR).
[[parameters]]
key = "sb3_enable_init_pose_rand"
type = "bool"
default = false
description = "[SB3] 启用初始位姿随机化（基座 xy + 偏航）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" } }

[[parameters]]
key = "sb3_init_pos_x_range"
type = "list"
default = "[-0.0, 0.0]"
widget = "range_list"
description = "[SB3] 初始 x 位置抖动范围（m）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = -5.0, max = 5.0, step = 0.05 }

[[parameters]]
key = "sb3_init_pos_y_range"
type = "list"
default = "[-0.0, 0.0]"
widget = "range_list"
description = "[SB3] 初始 y 位置抖动范围（m）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = -5.0, max = 5.0, step = 0.05 }

[[parameters]]
key = "sb3_init_yaw_range"
type = "list"
default = "[-0.0, 0.0]"
widget = "range_list"
description = "[SB3] 初始偏航抖动范围（rad）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = -3.15, max = 3.15, step = 0.05 }

[[parameters]]
key = "sb3_enable_joint_noise"
type = "bool"
default = false
description = "[SB3] 启用关节状态噪声（reset 时）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" } }

[[parameters]]
key = "sb3_joint_pos_noise"
type = "float"
default = 0.0
widget = "range"
description = "[SB3] 关节位置噪声幅值（rad）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.0, max = 1.0, step = 0.01 }

[[parameters]]
key = "sb3_joint_vel_noise"
type = "float"
default = 0.0
widget = "range"
description = "[SB3] 关节速度噪声幅值（rad/s）"
meta = { conditional_on = { key = "backend", op = "==", value = "sb3_mujoco" }, min = 0.0, max = 5.0, step = 0.01 }

# ---------------------------------------------------------------------------
# Parameters — Isaac Lab backend (visible only when backend == "isaac_lab")
# ---------------------------------------------------------------------------

# Friction event
[[parameters]]
key = "enable_friction_rand"
type = "bool"
default = true
description = "[IL] 启用摩擦随机化"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "friction_mode"
type = "enum"
default = "reset"
choices = ["reset", "interval", "startup"]
description = "[IL] 摩擦事件触发模式"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "static_friction_range"
type = "list"
default = "[0.5, 1.25]"
widget = "range_list"
description = "[IL] 静摩擦范围"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "dynamic_friction_range"
type = "list"
default = "[0.5, 1.25]"
widget = "range_list"
description = "[IL] 动摩擦范围"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "restitution_range"
type = "list"
default = "[0.0, 0.4]"
widget = "range_list"
description = "[IL] 弹性系数范围"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = 0.0, max = 1.0, step = 0.01 }

# Mass event
[[parameters]]
key = "enable_mass_rand"
type = "bool"
default = true
description = "[IL] 启用质量随机化"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "mass_mode"
type = "enum"
default = "reset"
choices = ["reset", "interval", "startup"]
description = "[IL] 质量事件触发模式"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

# Mass-randomization target scope. legged_gym only perturbs the root link
# (props[0]); IsaacLab stock add_base_mass likewise attaches one body. This
# lets the user choose per training need (not hardcoded):
#   root       — articulation root link (pelvis/base/…); 1:1 legged parity
#   all_bodies — every link (body_names=".*"); strongest mass robustness
#   custom     — a specific body/role typed in mass_target_body
[[parameters]]
key = "mass_target_scope"
type = "enum"
default = "root"
choices = ["root", "all_bodies", "custom"]
description = "[IL] 质量随机化作用范围: root=根link(legged原样) / all_bodies=全身.* / custom=指定body"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "mass_target_body"
type = "string"
default = "torso"
description = "[IL] 自定义质量随机化目标 body（IR 角色名如 torso，或 USD link 名如 torso_link）"
meta = { conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "mass_target_scope", op = "==", value = "custom" } ] }

[[parameters]]
key = "mass_offset_range"
type = "list"
default = "[-0.5, 0.5]"
widget = "range_list"
description = "[IL] 质量偏移范围（kg）"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = -10.0, max = 10.0, step = 0.05 }

[[parameters]]
key = "mass_operation"
type = "enum"
default = "add"
choices = ["add", "scale", "abs"]
description = "[IL] 质量随机化操作模式：add=偏移叠加 / scale=按比例缩放 / abs=直接替换"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

# External push
[[parameters]]
key = "enable_external_push"
type = "bool"
default = true
description = "[IL] 启用外力推扰"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "push_mode"
type = "enum"
default = "interval"
choices = ["reset", "interval", "startup"]
description = "[IL] 推扰事件触发模式"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "push_interval_range_s"
type = "list"
default = "[10.0, 15.0]"
widget = "range_list"
description = "[IL] 推扰时间间隔范围（s）"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = 0.0, max = 60.0, step = 0.5 }

[[parameters]]
key = "push_velocity_x_range"
type = "list"
default = "[-0.5, 0.5]"
widget = "range_list"
description = "[IL] 推扰 X 速度增量范围（m/s）"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = -5.0, max = 5.0, step = 0.05 }

[[parameters]]
key = "push_velocity_y_range"
type = "list"
default = "[-0.5, 0.5]"
widget = "range_list"
description = "[IL] 推扰 Y 速度增量范围（m/s）"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = -5.0, max = 5.0, step = 0.05 }

# Init pose event
[[parameters]]
key = "enable_init_pose_rand"
type = "bool"
default = true
description = "[IL] 启用初始位姿随机化"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "init_pose_mode"
type = "enum"
default = "reset"
choices = ["reset", "interval", "startup"]
description = "[IL] 初始位姿事件触发模式"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "init_pos_x_range"
type = "list"
default = "[-0.5, 0.5]"
widget = "range_list"
description = "[IL] 初始 X 位置范围（m）"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = -10.0, max = 10.0, step = 0.1 }

[[parameters]]
key = "init_pos_y_range"
type = "list"
default = "[-0.5, 0.5]"
widget = "range_list"
description = "[IL] 初始 Y 位置范围（m）"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = -10.0, max = 10.0, step = 0.1 }

[[parameters]]
key = "init_yaw_range"
type = "list"
default = "[-3.14, 3.14]"
widget = "range_list"
description = "[IL] 初始 Yaw 范围（rad）"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = -3.14159, max = 3.14159, step = 0.01 }

# Joint noise event
[[parameters]]
key = "enable_joint_noise"
type = "bool"
default = true
description = "[IL] 启用关节噪声"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "joint_noise_mode"
type = "enum"
default = "reset"
choices = ["reset", "interval", "startup"]
description = "[IL] 关节噪声事件触发模式"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "joint_pos_noise"
type = "float"
default = 0.25
widget = "range"
description = "[IL] 关节位置噪声幅度"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = 0.0, max = 1.0, step = 0.001 }

[[parameters]]
key = "joint_vel_noise"
type = "float"
default = 0.1
widget = "range"
description = "[IL] 关节速度噪声幅度"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" }, min = 0.0, max = 5.0, step = 0.001 }
