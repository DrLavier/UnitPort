schema = "unitport.node/v1"
id = "env_assembler"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "B"
display_name_key = "node.env_assembler.display"
description_key = "node.env_assembler.desc"
icon = "env_assembler.svg"

# Env Assembler — Layer B SB3 aggregation point.
#
# Merges §1 Actor block (actor_pipe), §2 Scene (scene_pipe),
# §4 Training Commands (command_pipe), plus the SB3-only task-layer configs
# (physics / task / obs&action / domain_rand / ref_motion / init_pose) into a
# single ``env_config`` dict consumed by TrainNode.
#
# scene_pipe / actor_pipe / command_pipe are declared optional at the node
# level because legacy SB3 canvases may not have them wired. The C6
# cross-section validator still requires PlayGroundSetting to terminate
# somewhere on the compile pipeline — either at a trainer (IL) or at
# EnvAssembler.scene_pipe (SB3).

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------

[[inputs]]
name = "actor_pipe"
type = "actor_pipe"
optional = true
description = "§1 Actor block (optional in legacy SB3 canvases)"

[[inputs]]
name = "scene_pipe"
type = "scene_pipe"
optional = true
description = "§2 Scene from PlayGroundSetting (optional)"

[[inputs]]
name = "command_pipe"
type = "command_pipe"
optional = true
description = "§4 Training Commands (optional)"

[[inputs]]
name = "physics_config"
type = "physics_config"

[[inputs]]
name = "task_config"
type = "task_config"

[[inputs]]
name = "obs_action_config"
type = "obs_action_config"

[[inputs]]
name = "domain_rand_config"
type = "domain_rand_config"
optional = true

[[inputs]]
name = "reference_motion_config"
type = "reference_motion_config"
optional = true

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

[[outputs]]
name = "env_config"
type = "env_config"
description = "Aggregated SB3 env config consumed by TrainNode"

# ---------------------------------------------------------------------------
# Parameters — VecEnv
# ---------------------------------------------------------------------------

[[parameters]]
key = "parallelism_mode"
type = "enum"
default = "auto"
choices = ["auto", "manual"]
description = "并行度模式: auto=按本机 CPU/RAM 自适应, manual=用下方 n_envs/vec_type / Parallelism: auto = adapt to this machine's CPU+RAM, manual = use n_envs/vec_type below"

[[parameters]]
key = "n_envs"
type = "int"
default = 8
widget = "index"
description = "并行 env 数 (仅 manual 生效; 1 不可接受) / Parallel envs (manual mode only; 1 = unacceptable)"
meta = { min = 1, max = 4096, conditional_on = { key = "parallelism_mode", op = "==", value = "manual" } }

[[parameters]]
key = "vec_type"
type = "enum"
default = "subproc"
choices = ["dummy", "subproc"]
description = "向量化类型 (仅 manual 生效) / Vectorisation type (manual mode only)"
meta = { conditional_on = { key = "parallelism_mode", op = "==", value = "manual" } }

# ---------------------------------------------------------------------------
# Parameters — Wrapper stack
# ---------------------------------------------------------------------------

[[parameters]]
key = "obs_normalize"
type = "bool"
default = true
description = "观测归一化 / Observation normalisation wrapper"

[[parameters]]
key = "reward_normalize"
type = "bool"
default = false
description = "奖励归一化 / Reward normalisation wrapper"

[[parameters]]
key = "clip_obs"
type = "float"
default = 10.0
widget = "range"
description = "观测裁剪范围 / Observation clip"
meta = { min = 0.0, max = 1000.0, step = 0.1 }

[[parameters]]
key = "clip_reward"
type = "float"
default = 10.0
widget = "range"
description = "奖励裁剪范围 / Reward clip"
meta = { min = 0.0, max = 1000.0, step = 0.1 }

[[parameters]]
key = "action_clip_range"
type = "float"
default = 1.0
widget = "range"
description = "ActionClip 包装范围 / ActionClip wrapper range [-x, x]"
meta = { min = 0.0, max = 100.0, step = 0.01 }

# enable_monitor / time_limit_override / eval_disable_rand removed (2026-06):
# all three had zero readers. Monitor is always wrapped (build_vec_env); the
# episode horizon comes only from physics.episode_max_steps / task
# .truncation_max_steps; eval reuses the same env build (DR untouched).
