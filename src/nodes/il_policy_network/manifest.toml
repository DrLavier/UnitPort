schema = "unitport.node/v1"
id = "il_policy_network"
backends = ["isaac_lab"]  # IsaacLab policy_net; SB3 builds net_arch from algorithm_config
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "IL"
display_name_key = "node.il_policy_network.display"
description_key = "node.il_policy_network.desc"
icon = "il_policy_network.svg"

# IL Policy Net — Isaac Lab MLP actor-critic 架构配置.

[[inputs]]
name = "obs_vector"
type = "obs_vector"

[[outputs]]
name = "policy"
type = "policy"

[[parameters]]
key = "actor_hidden_dims"
type = "list"
default = "[128, 64, 32]"
widget = "code"
description = "actor 隐藏层 (JSON list)"
meta = { language = "json" }

[[parameters]]
key = "critic_hidden_dims"
type = "list"
default = "[128, 64, 32]"
widget = "code"
description = "critic 隐藏层 (JSON list)"
meta = { language = "json" }

[[parameters]]
key = "activation"
type = "enum"
default = "elu"
choices = ["relu", "elu", "tanh", "leaky_relu"]
description = "激活函数"

[[parameters]]
key = "init_noise_std"
type = "float"
default = 1.0
widget = "range"
# Direct action std (legged_gym convention): 1.0 == std 1.0. NOT log-space.
# The value the user types is the initial exploration std verbatim — the
# framework never exp()'s it (see env_cfg_compiler / il_train_launcher).
description = "初始动作噪声 std（直接值，legged_gym 约定：1.0=std 1.0）"
meta = { min = 0.05, max = 3.0, step = 0.01 }

# 缺口① — recurrent policy (GRU/LSTM). 'none' = feed-forward MLP (default,
# byte-identical to the pre-recurrent path). 'gru'/'lstm' wrap the actor in a
# memory cell (legged_gym ActorCriticRecurrent); critic stays MLP. The hidden
# state is threaded through training + ONNX export + deploy.
[[parameters]]
key = "rnn_type"
type = "enum"
default = "none"
choices = ["none", "gru", "lstm"]
description = "循环策略类型 / Recurrent policy type (none = MLP)"

[[parameters]]
key = "rnn_hidden_size"
type = "int"
default = 256
widget = "index"
description = "RNN 隐藏维度 / RNN hidden size (only when rnn_type != none)"
meta = { min = 1, max = 4096 }

[[parameters]]
key = "rnn_num_layers"
type = "int"
default = 1
widget = "index"
description = "RNN 层数 / RNN num layers (only when rnn_type != none)"
meta = { min = 1, max = 8 }
