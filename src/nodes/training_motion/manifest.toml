schema = "unitport.node/v1"
id = "training_motion"
kind = "CUSTOM"
version = "1.0.0"
category = "config"
layer = "B"
display_name_key = "node.training_motion.display"
description_key = "node.training_motion.desc"
icon = "training_motion.svg"

# Training Motion — 统一 training-motion 节点（替代 TrainingCommandsNode +
# ReferenceMotionNode）.
#
# 单节点同时持有「训练项 → motion_tag → 命令 envelope → reference clip」
# 的全链路绑定，保证 train = reference = execute 三者一致。
#
# v2 颗粒度：
#   - 新增 actor_pipe 输入（来自 actor_setting），由本节点聚合后送 trainer
#   - 每个 enabled training item 在 canvas 上对应一个动态 reward_in__<id>
#     输入端口（type=reward_pipe, multi=true — 同一 item 允许多个 RewardsNode
#     扇入），由 NodeItem 按 ``training_items`` dict 动态重建。端口集合不在
#     manifest 中静态声明 — 训练 spec 编译器从 IR edges 反查
#     (rewards_node, item_id) 映射，PortSpec 的唯一来源是
#     ``nodes.training_motion.node.iter_reward_port_specs``。
#
# 端口：
#   inputs  actor_pipe                — Actor stream (from actor_setting)
#   inputs  reward_in__<item_id>      — Dynamic, per enabled item (canvas-only)
#   outputs command_pipe              — CommandSchema.to_dict() + task_items list
#   outputs reference_motion_config   — entries / task_item_to_clip / format_mixed / pack_refs

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------

[[inputs]]
name = "actor_pipe"
type = "actor_pipe"
optional = true
description = "Actor stream (from actor_setting)"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

[[outputs]]
name = "command_pipe"
type = "command_pipe"

[[outputs]]
name = "reference_motion_config"
type = "reference_motion_config"

# ---------------------------------------------------------------------------
# Parameters — §1 Training items
# ---------------------------------------------------------------------------

[[parameters]]
key = "training_items"
type = "json"
default = "{\"stand\": {\"enabled\": true, \"speed\": [0.0, 0.0], \"clip\": \"pack:unitport_builtin:mocap_motions/stand.txt\", \"advanced\": {}}, \"walk\": {\"enabled\": true, \"speed\": [0.2, 1.0], \"clip\": null, \"advanced\": {}}, \"turn\": {\"enabled\": true, \"speed\": [0.3, 0.8], \"clip\": null, \"advanced\": {}}, \"pace\": {\"enabled\": false, \"speed\": [0.5, 1.2], \"clip\": null, \"advanced\": {}}}"
widget = "training_items"
description = "训练项字典（item_id → {enabled, speed, clip, advanced, weight?}）；可选 weight 为该项的初始采样权重（缺省=均匀），由 Weight Set 饼图编辑器写入"
meta = { pin_on_collapse = true }

# ---------------------------------------------------------------------------
# Parameters — §1.5 Initial sampling weights (pie editor)
# ---------------------------------------------------------------------------

# Action-only button row: opens a modal pie-chart editor for the per-item
# initial sampling weight (stored back into each enabled training_items[id]
# ["weight"]). This param itself holds no value (throwaway, like
# `review_launch`); the editor reads/writes the sibling `training_items`.
# Always visible — the weight is the initial sampling distribution whether
# adaptive item sampling is on (start point) or off (permanent).
[[parameters]]
key = "weight_set"
type = "string"
default = ""
widget = "weight_pie_editor"
description = "命令项初始采样权重（饼图编辑器；写入各启用 item 的 weight，缺省=均匀）"

# ---------------------------------------------------------------------------
# Parameters — §2 Global stick-shaping
# ---------------------------------------------------------------------------

[[parameters]]
key = "mapping_mode"
type = "enum"
default = "linear"
choices = ["linear", "deadzone", "exponential"]
description = "命令映射模式 [deploy-only: CommandBus 在 deploy 时处理 stick 输入；IL/SB3 sim 训练时 CommandTerm 直接生成命令，不消费此字段]"

[[parameters]]
key = "deadzone"
type = "float"
default = 0.10
widget = "range"
description = "死区 [deploy-only: 仅 deploy 时 stick 映射使用，不影响 sim 训练]"
meta = { min = 0.0, max = 1.0, step = 0.01, conditional_on = { key = "mapping_mode", op = "==", value = "deadzone" } }

[[parameters]]
key = "curve_exponent"
type = "float"
default = 2.00
widget = "range"
description = "曲线指数 [deploy-only: 仅 deploy 时 stick 映射使用，不影响 sim 训练]"
meta = { min = 0.1, max = 10.0, step = 0.01, conditional_on = { key = "mapping_mode", op = "==", value = "exponential" } }

[[parameters]]
key = "runtime_clip"
type = "bool"
default = true
description = "运行时裁剪命令 [deploy-only: 仅 deploy 时 CommandBus 应用；sim 训练 CommandTerm 用 ranges 内部约束]"

# ---------------------------------------------------------------------------
# Parameters — §3 Walk-These-Ways gait parameterisation
# ---------------------------------------------------------------------------

# gait (Walk-These-Ways) is IsaacLab-only — the gait command/obs/rewards are
# emitted only on the rsl_rl side; the SB3 MuJoCo env has no gait. Hidden on
# SB3 canvases (conditional_on backend), and validator F2 fail-louds if a
# legacy SB3 canvas still carries gait_enabled=true.
[[parameters]]
key = "gait_enabled"
type = "bool"
default = false
description = "启用 gait 参数化 (IsaacLab only)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "gait_frequency_range"
type = "list"
default = "[1.5, 3.5]"
widget = "range_list"
description = "步频范围（Hz）"
meta = { conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "gait_enabled", op = "==", value = true } ], min = 0.0, max = 10.0, step = 0.1 }

[[parameters]]
key = "body_height_range"
type = "list"
default = "[0.28, 0.40]"
widget = "range_list"
description = "身体高度范围（m）"
meta = { conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "gait_enabled", op = "==", value = true } ], min = 0.0, max = 2.0, step = 0.01 }

[[parameters]]
key = "step_height_range"
type = "list"
default = "[0.03, 0.15]"
widget = "range_list"
description = "抬腿高度范围（m）"
meta = { conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "gait_enabled", op = "==", value = true } ], min = 0.0, max = 0.5, step = 0.01 }

[[parameters]]
key = "gait_presets"
type = "string"
default = ""
widget = "registry_preset_picker"
description = "gait 预设名 / Gait preset (family-filtered)"
meta = { registry = "gait_presets", family_source = "robot_pipe", conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "gait_enabled", op = "==", value = true } ] }

# ---------------------------------------------------------------------------
# Parameters — §3.5 Command velocity gains (sim2real envelope)
# ---------------------------------------------------------------------------
# The four gains define the canvas-authoritative absolute velocity caps
# that lower into UniformVelocityCommandCfg.Ranges. They must match the
# deploy-side CommandBus gains so that the sim training envelope equals
# the real-robot input envelope — i.e. the policy never sees a sim
# command it could not legitimately receive on hardware.

[[parameters]]
key = "gain_lin_forward"
type = "float"
default = 2.0
widget = "range"
description = "前进方向最大速度 (m/s) / Forward velocity cap"
meta = { min = 0.0, max = 5.0, step = 0.05 }

[[parameters]]
key = "gain_lin_backward"
type = "float"
default = 1.0
widget = "range"
description = "后退方向最大速度 (m/s) / Backward velocity cap"
meta = { min = 0.0, max = 5.0, step = 0.05 }

[[parameters]]
key = "gain_lin_lateral"
type = "float"
default = 0.5
widget = "range"
description = "侧向最大速度 (m/s) / Lateral velocity cap"
meta = { min = 0.0, max = 3.0, step = 0.05 }

[[parameters]]
key = "gain_yaw"
type = "float"
default = 1.5
widget = "range"
description = "yaw 最大角速度 (rad/s) / Yaw rate cap"
meta = { min = 0.0, max = 5.0, step = 0.05 }

# ---------------------------------------------------------------------------
# Parameters — §4 Episode sampler
# ---------------------------------------------------------------------------

[[parameters]]
key = "resampling_time_range"
type = "list"
default = "[4.0, 12.0]"
widget = "range_list"
description = "命令重采样时间范围（s）"
meta = { min = 0.0, max = 30.0, step = 0.1 }

# NOTE: `zero_command_probability` (the legged_gym rel_standing_envs knob) was
# REMOVED as a node parameter — standing is now provided solely by an explicit
# `stand` training item (zero-velocity ranges). Adding a separate zero-command
# probability double-counted standing. The runtime command term keeps an inert
# rel_standing_envs=0.0 for API compatibility; nothing drives it from the node.

[[parameters]]
key = "cmd_step_change_prob"
type = "float"
default = 0.01
widget = "range"
description = "每步命令切换概率"
meta = { min = 0.0, max = 1.0, step = 0.001 }

# ---------------------------------------------------------------------------
# Parameters — §4.5 Heading command (legged_gym parity)
# ---------------------------------------------------------------------------
# Closed-loop yaw: when on, ang_vel_z is NOT sampled directly — each resample
# draws a target world-heading in heading_range, and every control step the
# env recomputes ang_vel_z = clip(heading_control_stiffness *
# wrap_to_pi(target - yaw), <item ang_vel_z range>). Mirrors legged_gym's
# commands.heading_command. Implemented on BOTH engines (IsaacLab command
# term + SB3 MuJoCo env) so it is not backend-gated. Off = open-loop yaw
# sampling (legacy, byte-identical).

[[parameters]]
key = "heading_command"
type = "bool"
default = false
description = "Heading 命令模式 / Heading command (closed-loop yaw from heading error)"

[[parameters]]
key = "heading_control_stiffness"
type = "float"
default = 0.5
widget = "range"
description = "Heading 比例增益 (heading误差 rad → yaw速率 rad/s); legged_gym=0.5"
meta = { min = 0.0, max = 5.0, step = 0.05, conditional_on = { key = "heading_command", op = "==", value = true } }

[[parameters]]
key = "heading_range"
type = "list"
default = "[-3.141592653589793, 3.141592653589793]"
widget = "range_list"
description = "目标 heading 采样范围 (rad); legged_gym=[-π, π]"
meta = { min = -3.141592653589793, max = 3.141592653589793, step = 0.01, conditional_on = { key = "heading_command", op = "==", value = true } }

# ---------------------------------------------------------------------------
# Parameters — §2 Adaptive item sampling (Phase C)
# ---------------------------------------------------------------------------
# Each enabled training_item starts at equal sampling weight (1/N). When
# adaptive_motion_enabled, the env-side command term harvests per-item mean
# step-reward and every `adaptive_update_interval` iterations re-biases the
# sampling weights toward under-performing (low-reward) items — bounded by
# [adaptive_weight_floor, adaptive_weight_ceil] (clamped + renormalised).
# Env-side (inside the command term) so it works identically under plain-PPO
# and AMP, neither of which exposes a per-iteration hook on the vanilla path.
# IsaacLab-only: the SB3 MuJoCo env uses its own command sampler (validator
# fail-louds if this is enabled on an SB3 canvas).

[[parameters]]
key = "adaptive_motion_enabled"
type = "bool"
default = false
description = "自适应项采样 / Adaptive item sampling (boost under-performing items)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "adaptive_update_interval"
type = "int"
default = 50
widget = "range"
description = "自适应权重更新间隔（迭代数） / Adaptive re-weight interval (iterations)"
meta = { min = 1, max = 2000, step = 1, conditional_on = { key = "adaptive_motion_enabled", op = "==", value = true } }

[[parameters]]
key = "adaptive_weight_floor"
type = "float"
default = 0.03
widget = "range"
description = "每项最小采样权重(归一化前钳制,防饿死) / Per-item min weight (pre-renorm clamp; prevents starvation)"
meta = { min = 0.0, max = 1.0, step = 0.01, conditional_on = { key = "adaptive_motion_enabled", op = "==", value = true } }

[[parameters]]
key = "adaptive_weight_ceil"
type = "float"
default = 0.30
widget = "range"
description = "每项最大采样权重(归一化前钳制,防独占) / Per-item max weight (pre-renorm clamp; caps dominance)"
meta = { min = 0.0, max = 1.0, step = 0.01, conditional_on = { key = "adaptive_motion_enabled", op = "==", value = true } }

# ---------------------------------------------------------------------------
# Parameters — §5 Reference-motion consumption
# ---------------------------------------------------------------------------

# §5 Reference-clip consumption is AMP / motion-tracking — IsaacLab-only. The
# SB3 MuJoCo env cannot replay reference clips, so these are hidden on SB3
# canvases (validator F1 fail-louds if motion_ref clips are actually wired).
[[parameters]]
key = "consumption_mode"
type = "enum"
choices = ["amp_discriminator", "tracking_target", "hybrid"]
description = "Reference clip 消费模式 (IsaacLab only)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "phase_mode"
type = "enum"
default = "loop"
choices = ["loop", "once", "clamp"]
description = "Phase 模式"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "motion_fps"
type = "float"
default = 50.0
widget = "range"
description = "Motion clip FPS"
meta = { min = 10.0, max = 240.0, step = 1.0, conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "random_start_phase"
type = "bool"
default = true
description = "随机起始 phase"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

# ---------------------------------------------------------------------------
# Parameters — §6 Command velocity curriculum
# ---------------------------------------------------------------------------

[[parameters]]
key = "command_curriculum_enabled"
type = "bool"
default = false
description = "启用命令速度 curriculum"

[[parameters]]
key = "command_curriculum_start"
type = "float"
default = 0.25
widget = "range"
description = "Curriculum 起始倍率"
meta = { conditional_on = { key = "command_curriculum_enabled", op = "==", value = true }, min = 0.0, max = 1.0, step = 0.01 }

[[parameters]]
key = "command_curriculum_end"
type = "float"
default = 1.0
widget = "range"
description = "Curriculum 终止倍率"
meta = { conditional_on = { key = "command_curriculum_enabled", op = "==", value = true }, min = 0.0, max = 5.0, step = 0.01 }

[[parameters]]
key = "command_curriculum_ramp_iters"
type = "int"
default = 800
widget = "index"
description = "Curriculum ramp 外层 iter 数"
meta = { conditional_on = { key = "command_curriculum_enabled", op = "==", value = true }, min = 1, max = 1000000 }

# ---------------------------------------------------------------------------
# Parameters — §7 AMP Reference State Initialization (RSI)
# ---------------------------------------------------------------------------
# Active only when il_ppo_trainer.training_mode == "AMP_PPO". Cross-node
# conditional hiding is not yet supported by the conditional engine, so
# these fields stay visible under PPO too — the compiler simply skips
# the RSI emit branch when training_mode != AMP_PPO (env_cfg_compiler
# _root_env_cfg path). Enabling them under PPO is a no-op.

[[parameters]]
key = "reference_state_init_enabled"
type = "bool"
default = false
description = "AMP RSI 开关 / Reference State Initialization (IsaacLab AMP_PPO only)"
meta = { conditional_on = { key = "backend", op = "==", value = "isaac_lab" } }

[[parameters]]
key = "rsi_prob"
type = "float"
default = 0.8
widget = "range"
description = "RSI 触发概率 / RSI activation probability"
meta = { min = 0.0, max = 1.0, step = 0.05, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "reference_state_init_enabled", op = "==", value = true } ] }

[[parameters]]
key = "rsi_joint_noise"
type = "float"
default = 0.02
widget = "range"
description = "RSI 关节噪声幅度 / RSI joint angle noise"
meta = { min = 0.0, max = 0.2, step = 0.005, conditional_on = [ { key = "backend", op = "==", value = "isaac_lab" }, { key = "reference_state_init_enabled", op = "==", value = true } ] }
