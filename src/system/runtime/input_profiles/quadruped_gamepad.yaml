name: quadruped_gamepad
robot_family: quadruped
input_type: gamepad
max_vx: 1.0
max_vy: 0.5
max_vyaw: 1.5
deadzone: 0.1
smoothing_alpha: 0.3
axis_mapping:
  left_stick_y: vx
  left_stick_x: vy
  right_stick_x: vyaw
mapping:
  left_stick_y: { target: vx, scale: -1.0, deadzone: 0.1 }
  left_stick_x: { target: vy, scale: 0.5, deadzone: 0.1 }
  right_stick_x: { target: vyaw, scale: 1.0, deadzone: 0.15 }
