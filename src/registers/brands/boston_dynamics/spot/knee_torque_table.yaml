# Boston Dynamics Spot - knee joint torque lookup table (torque_lookup v1).
#
# DATA ONLY. This directory (registers/brands/<brand>/<model>/) contains brand
# DATA, never logic. No Python imports, no executable code. See README.md.
#
# Source : IsaacLab isaaclab_assets/isaaclab_assets/robots/spot.py
#          (module-level `joint_parameter_lookup`), IsaacLab v2.3.2,
#          commit 37ddf626871758333d6ed89cf64ad702aef127d0.
#          In-source note: "This data was collected by the Boston Dynamics
#          AI Institute." Original columns: [joint_angle_rad,
#          transmission_ratio, max_torque_Nm] (101 rows).
# Imported: 2026-05-25.
#
# Extraction: column 0 (angle) -> `axis`; column 2 (max_torque) -> max_torque.
#   Column 1 (transmission_ratio) is DROPPED on purpose. Per PV-2(b),
#   IsaacLab RemotizedPDActuator.compute() exposes that column as a property
#   but NEVER references it - it does not enter the PD law or the torque
#   clamp. TorqueLookupTable.to_isaaclab_array() re-emits a constant
#   gear_ratio=1.0 in its place when feeding IsaacLab back; behaviorally
#   identical because the column is inert.
#
# Coverage: spans the full MJCF knee range (spot.xml fl_kn range -2.7929..
#   -0.2544 rad). Peak |tau_max| = 113.236 N.m at angle -1.443626 rad;
#   endpoints 37.165 / 30.602 N.m.
# -----------------------------------------------------------------------------
schema_version: 1
axis: joint_position_rad
interpolation: linear
symmetric: true
extrapolation: clamp_to_endpoint
