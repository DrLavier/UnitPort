# UnitPort drop-in on the Mangdang factory Flask panel unit.
#
# Installed by deploy_brand_runtime.ensure_brand_runtime() on Mini Pupper v2
# robots, removed by uninstall_robot.sh. Purely additive — the only directive
# we layer on is the Conflicts relation with unitport-minipupper.service.
# No ExecStart override, no environment mutation.
#
# Effect: starting unitport-minipupper.service auto-stops this unit
# (Conflicts= is bidirectional in semantics but must be declared on both
# sides to handle both start directions symmetrically). The factory image's
# original unit file is never touched, so `uninstall_robot.sh --purge-deps`
# plus `rm` of this drop-in restores the vendor baseline byte-for-byte.
#
# Background: the PCA9685 I2C bus serialises — Flask and CHAMP cannot both
# drive it.

[Unit]
Conflicts=unitport-minipupper.service
