# UnitPort USB link — DHCP-only configuration scoped to usb0.
#
# dnsmasq does NOT support inline comments on directive lines — a line like
# `dhcp-option=3  # note` is parsed with "# note" as part of the value and
# silently fails to load, leaving the unit stuck in "activating". So every
# comment below lives on its own line.
#
# port=0 disables DNS so systemd-resolved retains ownership of :53 on the
# other interfaces. bind-interfaces + except-interface entries prevent any
# accidental binding on wlan0 / eth0 / lo.

interface=usb0
bind-interfaces
except-interface=lo
except-interface=wlan0
except-interface=eth0

# Disable the DNS side of dnsmasq entirely — we only want DHCP on usb0.
port=0

# DHCP pool — small, only need one lease at a time since it's a point-to-
# point USB link. 1h lease is enough for a tethering session.
dhcp-range=192.168.55.100,192.168.55.110,1h

# Suppress default-gateway and DNS options — usb0 is a peer link, not an
# internet uplink. Bare option numbers tell dnsmasq "don't send this one".
dhcp-option=3
dhcp-option=6

# Advisory hostname option for host-side discovery tools.
dhcp-option=12,minipupper

# Pin the host to 192.168.55.2 so the robot-side handshake probe knows
# exactly where to reach it. The MAC below matches the single NCM function
# host_addr set by unitport-usb-gadget.sh. NCM is the only function the
# gadget exposes (Windows 10 1703+, macOS 10.10+, Linux 2.6.35+ all bind
# NCM natively without a driver install), so a single dhcp-host line is
# all we need.
dhcp-host=de:ad:be:ef:00:01,192.168.55.2
